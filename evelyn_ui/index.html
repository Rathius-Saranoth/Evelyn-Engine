              btnsDiv.style.gap = "8px";
              btnsDiv.style.flexWrap = "wrap";

              const inspectBtn = document.createElement("button");
              inspectBtn.className = "btn-ghost";
              inspectBtn.style.color = "var(--text)";
              inspectBtn.innerHTML = "👁️ Preview & Review";
              inspectBtn.onclick = () => openModal("approval", t.data);

              const approveBtn = document.createElement("button");
              approveBtn.className = "btn-ghost";
              approveBtn.style.borderColor = "var(--tool-border)";
              approveBtn.style.color = "var(--tool-text)";
              approveBtn.textContent = statusItem.type === "write" ? "Approve & Write" : "Approve";
              approveBtn.onclick = () => handleApproval(t.data, true);

              const denyBtn = document.createElement("button");
              denyBtn.className = "btn-ghost danger";
              denyBtn.textContent = "Deny";
              denyBtn.onclick = () => promptAndDenyApproval(t.data);

              btnsDiv.appendChild(inspectBtn);
              btnsDiv.appendChild(approveBtn);
              btnsDiv.appendChild(denyBtn);
              badge.appendChild(btnsDiv);
            } else if (status === "approved") {
              badge = document.createElement("button");
              badge.className = "write-badge success";
              badge.textContent = `✓ ${WRITE_TOOLS[t.name].label}`;
              badge.onclick = () => openModal("approval", t.data);
              badge.style.cursor = "pointer";
            } else if (status === "denied") {
              badge = document.createElement("span");
              badge.className = "write-badge danger";
              badge.textContent = `✗ ${t.name === "write_file" ? "File write" : "Command"} denied`;
            } else if (status === "failed") {
              badge = document.createElement("span");
              badge.className = "write-badge danger";
              badge.textContent = `❌ ${t.name === "write_file" ? "File write" : "Command"} failed`;
            } else if (status === "expired") {
              badge = document.createElement("span");
              badge.className = "write-badge warning";
              badge.textContent = `⚠️ Approval expired`;
            } else {
              // 'unknown'
              badge = document.createElement("span");
              badge.className = "write-badge warning";
              badge.textContent = `⚠️ Approval expired/lost`;
            }
          } else {
            badge = document.createElement("span");
            badge.className = "write-badge";
            badge.textContent = `${WRITE_TOOLS[t.name].icon} ${WRITE_TOOLS[t.name].label}`;
          }
          container.appendChild(badge);
        }
        // Insert before msg-actions (TTS/regen) if present, otherwise append
        const actions = wrap.querySelector(".msg-actions");
        if (actions) wrap.insertBefore(container, actions);
        else wrap.appendChild(container);
      }

        await handleApproval(approvalId, false, reason.trim());

      let isStreaming = false;

      let currentStream = {
        id: null,
        lastChunkId: -1,
        wrap: null,
        userMsgDiv: null,
        thinkingHandler: null,
        addActivity: null,
        removeActivity: null,
        bubble: null,
        cursorEl: null,
        actLog: null,
        actRemoved: false,
        contentText: "",
        usedTools: [],
        isReading: false,
        isDone: false,
      };

      function startStreamingUI(statusText = "Thinking…") {
        isStreaming = true;
        const sendBtn = document.getElementById("send-btn");
        if (sendBtn) {
          sendBtn.disabled = false;
          sendBtn.classList.add("btn-stop");
          sendBtn.textContent = "■";
          sendBtn.title = "Stop generating";
        }
        document.querySelector(".avatar").classList.add("active");
        setStatus(statusText);
      }

      function finishStreamingUI() {
        isStreaming = false;
        const sendBtn = document.getElementById("send-btn");
        if (sendBtn) {
          sendBtn.disabled = false;
          sendBtn.classList.remove("btn-stop");
          sendBtn.textContent = "↑";
          sendBtn.title = "Send";
        }
        document.querySelector(".avatar").classList.remove("active");
        const input = document.getElementById("input");
        if (input) input.focus();
        updateDevUIBadge();
      }

      async function stopGeneration() {
        if (!isStreaming) return;
        const sendBtn = document.getElementById("send-btn");
        if (sendBtn) {
          sendBtn.disabled = true;
          sendBtn.textContent = "…";
        }
        setStatus("Stopping…");

        const streamId = currentStream.id || sessionStorage.getItem("active_stream_id");

        // Abort client-side fetch reader
        if (currentStream.abortController) {
          try {
            currentStream.abortController.abort();
          } catch {}
        }

        // Request backend cancellation
        try {
          await fetch(`${API_BASE}/chat/stop`, {
            method: "POST",
            headers: headers(),
            body: JSON.stringify({ stream_id: streamId }),
          });
        } catch (err) {
          console.warn("Error calling /chat/stop:", err);
        }

        // Finalize UI state
        if (currentStream.thinkingHandler) currentStream.thinkingHandler.finalize();
        if (currentStream.removeActivity) currentStream.removeActivity();
        if (currentStream.cursorEl) currentStream.cursorEl.remove();

        if (!currentStream.bubble) {
          currentStream.bubble = document.createElement("div");
          currentStream.bubble.className = "bubble";
          if (currentStream.wrap) currentStream.wrap.appendChild(currentStream.bubble);
        }
        currentStream.bubble.innerHTML = renderMarkdown("[Response interrupted -- please try again.]");

        if (currentStream.userMsgDiv) {
          addRegenToUserMsg(currentStream.userMsgDiv);
        }

        currentStream.isDone = true;
        sessionStorage.removeItem("active_stream_id");
        setStatus("Ready");
        finishStreamingUI();
        scrollBottom();
      }

      function handleStreamEvent(evt, chunkId) {
        if (chunkId !== undefined && chunkId !== null && !isNaN(chunkId)) {
          currentStream.lastChunkId = chunkId;
        }

        if (evt.type === "stream_session") {
          currentStream.id = evt.stream_id;
          sessionStorage.setItem("active_stream_id", evt.stream_id);
          return;
        }

        if (evt.type === "status") {
          if (currentStream.addActivity) currentStream.addActivity(null, evt.msg);
          setStatus(evt.msg);
          return;
        }

        if (evt.type === "thinking") {
          if (currentStream.thinkingHandler) {
            if (currentStream.thinkingHandler.handleThinking) {
              currentStream.thinkingHandler.handleThinking(evt.round || 1, evt.delta);
            } else {
              currentStream.thinkingHandler.handleDelta(evt.delta);
            }
          }
          return;
        }

        if (evt.type === "tool_start" || evt.type === "tool") {
          const toolName = evt.tool || evt.name || "unknown";
          if (currentStream.thinkingHandler && currentStream.thinkingHandler.handleToolStart) {
            currentStream.thinkingHandler.handleToolStart(evt.round || 1, toolName, evt.args);
          }
          if (currentStream.addActivity) {
            currentStream.addActivity("⚙️", toolName.replace(/_/g, " "));
          }
          setStatus(`Running ${toolName.replace(/_/g, " ")}…`);
          currentStream.usedTools.push(toolName);
          scrollBottom();
          return;
        }

        if (evt.type === "tool_end") {
          const toolName = evt.tool || evt.name || "unknown";
          if (currentStream.thinkingHandler && currentStream.thinkingHandler.handleToolEnd) {
            currentStream.thinkingHandler.handleToolEnd(evt.round || 1, toolName, evt.status, evt.summary, evt.data);
          }
          scrollBottom();
          return;
        }

        if (evt.type === "tool_data") {
          const idx = currentStream.usedTools.indexOf(evt.name);
          if (idx !== -1) {
            currentStream.usedTools[idx] = `${evt.name}[${evt.data}]`;
          }
          return;
        }

        if (evt.type === "approval_required") {
          if (evt.approval_id) {
            approvalStatuses[evt.approval_id] = {
              id: evt.approval_id,
              tool: evt.tool,
              args: evt.args,
              status: "pending",
            };
            fetchPendingApprovals();
          }
          return;
        }

        if (evt.type === "quarantine_preamble") {
          return;
        }

        if (evt.type === "text") {
          if (!currentStream.bubble) {
            if (currentStream.addActivity) currentStream.addActivity("✍️", "Generating response…");
            if (currentStream.removeActivity) currentStream.removeActivity();
            if (currentStream.wrap) {
              currentStream.wrap.querySelectorAll(".tool-indicator .spinner").forEach((s) => {
                s.style.animation = "none";
                s.style.borderColor = "var(--tool-text)";
              });
            }
            currentStream.bubble = document.createElement("div");
            currentStream.bubble.className = "bubble";
            currentStream.cursorEl = document.createElement("span");
            currentStream.cursorEl.className = "cursor";
            currentStream.bubble.appendChild(currentStream.cursorEl);
            if (currentStream.wrap) currentStream.wrap.appendChild(currentStream.bubble);
          }
          currentStream.contentText += evt.delta;
          currentStream.bubble.innerHTML = renderMarkdown(currentStream.contentText);
          currentStream.bubble.appendChild(currentStream.cursorEl);
          setStatus("Streaming…");
          scrollBottom();
          return;
        }

        if (evt.type === "metrics") {
          updateTelemetry(evt.prompt_eval_count, evt.eval_count);
          return;
        }

        if (evt.type === "stopped") {
          if (currentStream.thinkingHandler) currentStream.thinkingHandler.finalize();
          if (currentStream.removeActivity) currentStream.removeActivity();
          if (currentStream.cursorEl) currentStream.cursorEl.remove();
          if (!currentStream.bubble) {
            currentStream.bubble = document.createElement("div");
            currentStream.bubble.className = "bubble";
            if (currentStream.wrap) currentStream.wrap.appendChild(currentStream.bubble);
          }
          currentStream.bubble.innerHTML = renderMarkdown("[Response interrupted -- please try again.]");
          if (currentStream.userMsgDiv) {
            addRegenToUserMsg(currentStream.userMsgDiv);
          }
          currentStream.isDone = true;
          sessionStorage.removeItem("active_stream_id");
          setStatus("Ready");
          finishStreamingUI();
          scrollBottom();
          return;
        }

        if (evt.type === "done") {
          if (currentStream.thinkingHandler) currentStream.thinkingHandler.finalize(evt.metrics);
          if (currentStream.cursorEl) currentStream.cursorEl.remove();
          if (currentStream.bubble) currentStream.bubble.innerHTML = renderMarkdown(currentStream.contentText);

          if (currentStream.wrap) {
            const { actions, ttsBtn } = createMessageActions(evt.message_id || null, currentStream.contentText, null);
            currentStream.wrap.appendChild(actions);
            addWriteBadges(currentStream.wrap, currentStream.usedTools, currentStream.contentText);
            if (_autoSpeech) playTTS(currentStream.contentText, ttsBtn);
          }

          if (currentStream.userMsgDiv) {
            addRegenToUserMsg(currentStream.userMsgDiv);
          }

          setStatus("Ready");
          scrollBottom();
          currentStream.isDone = true;
          sessionStorage.removeItem("active_stream_id");
          return;
        }
      }

      async function consumeStreamResponse(resp) {
        currentStream.isReading = true;
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";

        try {
          let pendingChunkId = null;
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });

            const lines = buf.split("\n");
            buf = lines.pop();

            for (const line of lines) {
              if (line.startsWith("id: ")) {
                pendingChunkId = parseInt(line.slice(4).trim(), 10);
                continue;
              }
              if (!line.startsWith("data: ")) continue;
              let evt;
              try {
                evt = JSON.parse(line.slice(6));
              } catch {
                continue;
              }
              handleStreamEvent(evt, pendingChunkId);
              pendingChunkId = null;
            }
          }
        } finally {
          currentStream.isReading = false;
        }
      }

      function setupAssistantStreamContext(initialIcon, initialText, userMsgDiv = null) {
        const wrap = createAssistantMessage();
        const actLog = document.createElement("div");
        actLog.className = "activity-log";
        wrap.appendChild(actLog);
        let actRemoved = false;

        function addActivity(icon, text, isDone = false) {
          const prev = actLog.querySelector(".activity-step:last-child");
          if (prev) prev.classList.add("done");
          const step = document.createElement("div");
          step.className = "activity-step";
          step.innerHTML = icon
            ? `<span class="step-icon">${icon}</span><span>${text}</span>`
            : `<div class="step-dot"></div><span>${text}</span>`;
          if (isDone) step.classList.add("done");
          actLog.appendChild(step);
          scrollBottom();
        }

        function removeActivity() {
          if (!actRemoved) {
            actLog.remove();
            actRemoved = true;
          }
        }

        if (initialText) {
          addActivity(initialIcon, initialText);
        }
        const thinkingHandler = createThinkingHandler(
          wrap,
          () => (currentStream ? currentStream.bubble : null),
          addActivity
        );

        return {
          wrap,
          actLog,
          addActivity,
          removeActivity,
          thinkingHandler,
          userMsgDiv,
        };
      }

      async function executeChatStream({ endpoint, payload, streamCtx, statusLabel = "Thinking…" }) {
        const { wrap, actLog, addActivity, removeActivity, thinkingHandler, userMsgDiv } = streamCtx;

        startStreamingUI(statusLabel);

        currentStream = {
          id: null,
          lastChunkId: -1,
          wrap,
          userMsgDiv,
          thinkingHandler,
          addActivity,
          removeActivity,
          bubble: null,
          cursorEl: null,
          actLog,
          actRemoved: false,
          contentText: "",
          usedTools: [],
          abortController: new AbortController(),
          isReading: false,
          isDone: false,
        };

        try {
          const resp = await fetch(`${API_BASE}${endpoint}`, {
            method: "POST",
            headers: headers(),
            body: JSON.stringify(payload),
            signal: currentStream.abortController.signal,
          });

          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

          await consumeStreamResponse(resp);

          if (!currentStream.isDone && currentStream.id) {
            await reconnectActiveStream();
          }
        } catch (err) {
          if (err.name === "AbortError") {
            // User aborted via stop button
            return;
          }
          removeActivity();
          await reconcileStreamFailure(wrap, userMsgDiv, err);
        } finally {
          if (currentStream && currentStream.isDone) {
            finishStreamingUI();
          }
        }
      }

      async function reconnectActiveStream() {
        if (!currentStream || !currentStream.id || currentStream.isDone) return;

        // Abort any existing stalled socket before opening a fresh reconnect stream
        if (currentStream.abortController) {
          try {
            currentStream.abortController.abort();
          } catch {}
        }
        currentStream.abortController = new AbortController();

        console.log(`[Stream Reconnect] Reconnecting to stream ${currentStream.id} after chunk #${currentStream.lastChunkId}`);
        setStatus("Reconnecting…");
        try {
          const resp = await fetch(`${API_BASE}/chat/stream/${currentStream.id}?after=${currentStream.lastChunkId}`, {
            headers: headers(),
            signal: currentStream.abortController.signal,
          });
          if (resp.status === 404) {
            console.log("[Stream Reconnect] Session not found or finished on server — reloading history");
            currentStream.isDone = true;
            sessionStorage.removeItem("active_stream_id");
            if (currentStream.wrap && currentStream.wrap.parentNode) {
              currentStream.wrap.remove();
            }
            await loadHistory();
            finishStreamingUI();
            setStatus("Ready");
            return;
          }
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          await consumeStreamResponse(resp);
          if (currentStream.isDone) {
            finishStreamingUI();
          }
        } catch (err) {
          if (err.name !== "AbortError") {
            console.warn("[Stream Reconnect] Failed to reconnect stream:", err);
            await reconcileStreamFailure(currentStream.wrap, currentStream.userMsgDiv, err);
          }
        }
      }

      async function reconcileStreamFailure(wrap, userMsgDiv, err) {
        // 1. Check if backend still has an active in-flight stream session
        try {
          const resp = await fetch(`${API_BASE}/chat/active_stream`, { headers: headers() });
          if (resp.ok) {
            const activeData = await resp.json();
            if (activeData.active && activeData.stream_id) {
              currentStream.id = activeData.stream_id;
              await reconnectActiveStream();
              return;
            }
          }
        } catch {
          // Network issue
        }

        // 2. Check if the server finished and saved the turn during connection drop
        try {
          const resp = await fetch(`${API_BASE}/latest_message_id`, { headers: headers() });
          if (resp.ok) {
            const { id: serverLatest } = await resp.json();
            if (serverLatest > lastRenderedMsgId) {
              console.log(`[Stream Reconciler] Server persisted msg #${serverLatest} — loading history`);
              if (wrap && wrap.parentNode) wrap.remove();
              if (currentStream) currentStream.isDone = true;
              sessionStorage.removeItem("active_stream_id");
              await loadHistory();
              setStatus("Ready");
              finishStreamingUI();
              return;
            }
          }
        } catch {
          // Network issue
        }

        // 3. Genuine failure: show error card in wrap and offer regeneration button
        if (currentStream) currentStream.isDone = true;
        sessionStorage.removeItem("active_stream_id");
        if (wrap && !wrap.querySelector(".bubble")) {
          const errBubble = document.createElement("div");
          errBubble.className = "bubble";
          errBubble.style.color = "#ff6666";
          errBubble.textContent = `Error: ${err ? err.message : "Connection lost"}`;
          wrap.appendChild(errBubble);
        }
        if (userMsgDiv) {
          addRegenToUserMsg(userMsgDiv);
        }
        setStatus("Error");
        finishStreamingUI();
      }

      // ---------------------------------------------------------------------------
      // Media / Attachment Handling & Pre-flight Canvas Downscaling
      // ---------------------------------------------------------------------------
      let stagedAttachments = [];

      async function extractExifMetadata(file) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const buffer = e.target.result;
              const view = new DataView(buffer);
              if (view.byteLength < 4 || view.getUint16(0, false) !== 0xffd8) {
                return resolve({});
              }
              let offset = 2;
              let exifOffset = -1;
              while (offset < view.byteLength) {
                if (view.getUint8(offset) !== 0xff) break;
                const marker = view.getUint8(offset + 1);
                if (marker === 0xe1) {
                  exifOffset = offset + 4;
                  break;
                }
                const len = view.getUint16(offset + 2, false);
                offset += 2 + len;
              }

              if (exifOffset === -1 || exifOffset + 6 > view.byteLength) {
                return resolve({});
              }

              const exifHeader = [0x45, 0x78, 0x69, 0x66, 0x00, 0x00];
              for (let i = 0; i < 6; i++) {
                if (view.getUint8(exifOffset + i) !== exifHeader[i]) return resolve({});
              }

              const tiffOffset = exifOffset + 6;
              const endianMarker = view.getUint16(tiffOffset, false);
              const littleEndian = endianMarker === 0x4949;

              if (endianMarker !== 0x4949 && endianMarker !== 0x4d4d) return resolve({});
              if (view.getUint16(tiffOffset + 2, littleEndian) !== 0x002a) return resolve({});

              const ifd0Offset = tiffOffset + view.getUint32(tiffOffset + 4, littleEndian);
              if (ifd0Offset + 2 > view.byteLength) return resolve({});

              const out = {};
              let exifSubIFDOffset = -1;
              let gpsIFDOffset = -1;

              function readString(strOffset, count) {
                let s = "";
                for (let i = 0; i < count - 1; i++) {
                  if (strOffset + i >= view.byteLength) break;
                  const c = view.getUint8(strOffset + i);
                  if (c === 0) break;
                  s += String.fromCharCode(c);
                }
                return s.trim();
              }

              function readRational(rOffset) {
                if (rOffset + 8 > view.byteLength) return 0;
                const num = view.getUint32(rOffset, littleEndian);
                const den = view.getUint32(rOffset + 4, littleEndian);
                return den === 0 ? 0 : num / den;
              }

              const numEntries = view.getUint16(ifd0Offset, littleEndian);
              for (let i = 0; i < numEntries; i++) {
                const entryOffset = ifd0Offset + 2 + i * 12;
                if (entryOffset + 12 > view.byteLength) break;
                const tag = view.getUint16(entryOffset, littleEndian);
                const type = view.getUint16(entryOffset + 2, littleEndian);
                const count = view.getUint32(entryOffset + 4, littleEndian);
                const valOffset = tiffOffset + view.getUint32(entryOffset + 8, littleEndian);

                if (tag === 0x010f && type === 2) out.camera_make = readString(valOffset, count);
                if (tag === 0x0110 && type === 2) out.camera_model = readString(valOffset, count);
                if (tag === 0x0132 && type === 2) out.datetime = readString(valOffset, count);
                if (tag === 0x8769 && type === 4)
                  exifSubIFDOffset = tiffOffset + view.getUint32(entryOffset + 8, littleEndian);
                if (tag === 0x8825 && type === 4)
                  gpsIFDOffset = tiffOffset + view.getUint32(entryOffset + 8, littleEndian);
              }

              if (exifSubIFDOffset > 0 && exifSubIFDOffset + 2 <= view.byteLength) {
                const subEntries = view.getUint16(exifSubIFDOffset, littleEndian);
                for (let i = 0; i < subEntries; i++) {
                  const entryOffset = exifSubIFDOffset + 2 + i * 12;
                  if (entryOffset + 12 > view.byteLength) break;
                  const tag = view.getUint16(entryOffset, littleEndian);
                  const type = view.getUint16(entryOffset + 2, littleEndian);
                  const count = view.getUint32(entryOffset + 4, littleEndian);
                  const valOffset = tiffOffset + view.getUint32(entryOffset + 8, littleEndian);

                  if (tag === 0x9003 && type === 2) out.datetimeoriginal = readString(valOffset, count);
                  if (tag === 0xa434 && type === 2) out.lensmodel = readString(valOffset, count);
                }
              }

              if (gpsIFDOffset > 0 && gpsIFDOffset + 2 <= view.byteLength) {
                const gpsEntries = view.getUint16(gpsIFDOffset, littleEndian);
                let latRef = "N",
                  lonRef = "E";
                let latVals = [],
                  lonVals = [];
                let altVal = null;

                for (let i = 0; i < gpsEntries; i++) {
                  const entryOffset = gpsIFDOffset + 2 + i * 12;
                  if (entryOffset + 12 > view.byteLength) break;
                  const tag = view.getUint16(entryOffset, littleEndian);
                  const type = view.getUint16(entryOffset + 2, littleEndian);
                  const valOffset = tiffOffset + view.getUint32(entryOffset + 8, littleEndian);

                  if (tag === 0x0001 && type === 2)
                    latRef = String.fromCharCode(view.getUint8(entryOffset + 8)).toUpperCase();
                  if (tag === 0x0003 && type === 2)
                    lonRef = String.fromCharCode(view.getUint8(entryOffset + 8)).toUpperCase();
                  if (tag === 0x0002 && type === 5) {
                    latVals = [
                      readRational(valOffset),
                      readRational(valOffset + 8),
                      readRational(valOffset + 16),
                    ];
                  }
                  if (tag === 0x0004 && type === 5) {
                    lonVals = [
                      readRational(valOffset),
                      readRational(valOffset + 8),
                      readRational(valOffset + 16),
                    ];
                  }
                  if (tag === 0x0006 && type === 5) {
                    altVal = readRational(valOffset);
                  }
                }

                if (latVals.length === 3 && lonVals.length === 3) {
                  let lat = latVals[0] + latVals[1] / 60 + latVals[2] / 3600;
                  if (latRef === "S") lat = -lat;
                  let lon = lonVals[0] + lonVals[1] / 60 + lonVals[2] / 3600;
                  if (lonRef === "W") lon = -lon;

                  if (lat !== 0 || lon !== 0) {
                    out.gps = {
                      latitude: parseFloat(lat.toFixed(6)),
                      longitude: parseFloat(lon.toFixed(6)),
                    };
                    if (altVal !== null) {
                      out.gps.altitude_m = parseFloat(altVal.toFixed(2));
                    }
                  }
                }
              }

              resolve(out);
            } catch (err) {
              console.debug("EXIF extraction error:", err);
              resolve({});
            }
          };
          reader.onerror = () => resolve({});
          reader.readAsArrayBuffer(file);
        });
      }

      async function processImageFile(file) {
        const exifMeta = await extractExifMetadata(file);

        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const maxDim = 2048;
              let width = img.width;
              let height = img.height;

              if (width > maxDim || height > maxDim) {
                if (width > height) {
                  height = Math.round((height * maxDim) / width);
                  width = maxDim;
                } else {
                  width = Math.round((width * maxDim) / height);
                  height = maxDim;
                }
              }

              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);

              const outputMime =
                file.type === "image/png" && file.size < 2000000 ? "image/png" : "image/jpeg";
              const dataUrl = canvas.toDataURL(outputMime, 0.9);

              resolve({
                id: "staged_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9),
                name: file.name || "Pasted image",
                size: Math.round(dataUrl.length * 0.75),
                mime: outputMime,
                dataUrl: dataUrl,
                metadata: exifMeta,
              });
            };
            img.onerror = () => reject(new Error("Failed loading image for processing"));
            img.src = e.target.result;
          };
          reader.onerror = (err) => reject(err);
          reader.readAsDataURL(file);
        });
      }

      async function stageFiles(files) {
        for (const file of files) {
          if (file.type.startsWith("image/")) {
            try {
              const item = await processImageFile(file);
              stagedAttachments.push(item);
            } catch (err) {
              console.warn("Could not stage image attachment:", err);
            }
          }
        }
        const fileInput = document.getElementById("media-file-input");
        if (fileInput) fileInput.value = "";
        renderAttachmentPreviews();
      }

      function removeAttachment(index) {
        stagedAttachments.splice(index, 1);
        renderAttachmentPreviews();
      }

      function clearAttachments() {
        stagedAttachments = [];
        renderAttachmentPreviews();
      }

      function renderAttachmentPreviews() {
        const bar = document.getElementById("attachment-preview-bar");
        if (!bar) return;
        if (stagedAttachments.length === 0) {
          bar.style.display = "none";
          bar.innerHTML = "";
          return;
        }

        bar.style.display = "flex";
        bar.innerHTML = "";
        stagedAttachments.forEach((att, idx) => {
          const chip = document.createElement("div");
          chip.className = "attachment-chip";
          chip.innerHTML = `
            <img src="${att.dataUrl}" alt="Preview" />
            <span style="max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml(att.name)}</span>
            <button class="remove-btn" title="Remove" type="button" onclick="removeAttachment(${idx})">✕</button>
          `;
          bar.appendChild(chip);
        });
      }

        const modal = document.getElementById("lightbox-modal");

        if (!modal || !img) return;

        img.src = src;
        activeLightboxAttRef = att;

        if (statusEl) statusEl.textContent = "";

        // Pre-fill from att if present

        }
        if (domainEl) domainEl.value = att?.taxonomy_domain || "Personal/Photo";
        if (guidEl) guidEl.textContent = activeLightboxGuid ? activeLightboxGuid.slice(0, 16) + "…" : "Local";
        if (resEl) resEl.textContent = (att?.width && att?.height) ? `${att.width}×${att.height}` : "-";
        
        let meta = att?.metadata || att?.metadata_json;
        if (typeof meta === "string") {
          try { meta = JSON.parse(meta); } catch (e) { meta = {}; }
        }
        meta = meta || {};

        if (dateEl) dateEl.textContent = meta.datetimeoriginal || meta.datetime || "-";
        if (camEl) camEl.textContent = (meta.camera_make || meta.camera_model) ? `${meta.camera_make || ""} ${meta.camera_model || ""}`.trim() : "-";

        modal.classList.add("active");

        // Fetch authoritative metadata from API if GUID is present
        if (activeLightboxGuid) {
          try {
            const resp = await fetch(`${API_BASE}/api/media/${activeLightboxGuid}`, { headers: headers() });
            if (resp.ok) {
              const live = await resp.json();
              if (descEl && live.description) descEl.value = live.description;
              if (tagsEl && live.tags) {
                tagsEl.value = Array.isArray(live.tags) ? live.tags.join(", ") : (live.tags || "");
              }
              if (domainEl && live.taxonomy_domain) domainEl.value = live.taxonomy_domain;
              if (resEl && live.width && live.height) resEl.textContent = `${live.width}×${live.height}`;
              
              let liveMeta = live.metadata || live.metadata_json;
              if (typeof liveMeta === "string") {
                try { liveMeta = JSON.parse(liveMeta); } catch(e) { liveMeta = {}; }
              }
              liveMeta = liveMeta || {};
              if (dateEl) dateEl.textContent = liveMeta.datetimeoriginal || liveMeta.datetime || "-";
              if (camEl) camEl.textContent = (liveMeta.camera_make || liveMeta.camera_model) ? `${liveMeta.camera_make || ""} ${liveMeta.camera_model || ""}`.trim() : "-";
            }
          } catch (err) {
            console.debug("Could not fetch live media metadata:", err);
          }
        }
      }

        if (!activeLightboxGuid) {
          const statusEl = document.getElementById("media-save-status");
          if (statusEl) {
            statusEl.textContent = "Cannot save: Image is local only.";
            statusEl.style.color = "#f87171";
          }
          return;
        }

        const desc = document.getElementById("media-edit-desc")?.value || "";
        const tagsRaw = document.getElementById("media-edit-tags")?.value || "";
        const domain = document.getElementById("media-edit-domain")?.value || "";

        const btn = document.getElementById("media-save-btn");

        if (statusEl) {
          statusEl.textContent = "Saving & indexing…";
          statusEl.style.color = "#a1a1aa";
        }

          const resp = await fetch(`${API_BASE}/api/media/${activeLightboxGuid}`, {

            },

              tags: tags,
              taxonomy_domain: domain,
            }),
          });

          if (!resp.ok) throw new Error(`HTTP error ${resp.status}`);
          const resData = await resp.json();

          if (activeLightboxAttRef) {
            activeLightboxAttRef.description = desc;
            activeLightboxAttRef.tags = tags;
            activeLightboxAttRef.taxonomy_domain = domain;
          }

          if (statusEl) {
            statusEl.textContent = "Saved & indexed into memory! ✓";
            statusEl.style.color = "#10b981";
            setTimeout(() => {
              if (statusEl && statusEl.textContent.includes("Saved")) statusEl.textContent = "";
            }, 3000);
          }
        } catch (err) {
          console.error("Save media error:", err);
          if (statusEl) {
            statusEl.textContent = "Error saving changes.";
            statusEl.style.color = "#f87171";
          }
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      window.addEventListener("paste", (e) => {
        const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
        if (!items) return;
        const imageFiles = [];
        for (const item of items) {
          if (item.type.indexOf("image") !== -1) {
            const blob = item.getAsFile();
            if (blob) imageFiles.push(blob);

        if (imageFiles.length > 0) {

      document.body.addEventListener("dragover", (e) => {

      document.body.addEventListener("dragleave", (e) => {
        document.querySelector(".input-row")?.classList.remove("drag-over");
      });
      document.body.addEventListener("drop", (e) => {
        e.preventDefault();
        document.querySelector(".input-row")?.classList.remove("drag-over");

      async function sendMessage() {
        const input = document.getElementById("input");
        const text = input.value.trim();
        const attachments = [...stagedAttachments];
        if ((!text && attachments.length === 0) || isStreaming) return;

        input.value = "";
        input.style.height = "auto";
        clearAttachments();
        await executeChatTurn(text, attachments);
      }

      async function sendSystemMessage(text) {
        if (isStreaming) return;
        await executeChatTurn(text);
      }

      async function handleApproval(approvalId, approve, reason = "") {
        const card = document.getElementById(`approval-card-${approvalId}`);
        if (card) {
          card.querySelectorAll("button").forEach((btn) => (btn.disabled = true));
        }

        const action = approve ? "approve" : "deny";
        try {
          const resp = await fetch(`${API_BASE}/api/terminal/${action}/${approvalId}`, {
            method: "POST",
            headers: headers(),
          });

          if (resp.ok) {
            const data = await resp.json();
            const statusItem = approvalStatuses[approvalId];
            const itemType = statusItem ? statusItem.type : "command";

            if (approvalStatuses[approvalId]) {
              approvalStatuses[approvalId].status = approve ? "approved" : "denied";
            } else {
              approvalStatuses[approvalId] = {
                id: approvalId,
                status: approve ? "approved" : "denied",
              };
            }

            if (card) {
              if (approve) {
                card.style.borderColor = "var(--tool-border)";
                card.style.background = "rgba(102,187,119,0.05)";
                card.innerHTML = `
                  <div style="font-size: 13px; font-weight: 600; color: var(--tool-text); cursor: pointer;" onclick="openModal('approval', '${approvalId}')">
                    ✓ ${itemType === "write" ? "File Written & Saved" : "Approved and Executed"} (Click to view)
                  </div>
                `;
              } else {
                card.style.borderColor = "var(--border)";
                card.style.background = "transparent";
                const reasonText = reason ? ` — Reason: "${escapeHtml(reason)}"` : "";
                card.innerHTML = `
                  <div style="font-size: 13px; font-weight: 600; color: var(--text-dim);">
                    ✗ Denied${reasonText}
                  </div>
                `;
              }
            }

            if (pendingApprovals) {
              pendingApprovals = pendingApprovals.filter((item) => item.id !== approvalId);
            }

            if (approve) {
              // Only send system output for command tools, NOT silent file writes
              if (itemType !== "write" && data.result) {
                sendSystemMessage(`[System: Command output:\n${data.result}]`);
              }
            } else {
              // If user provided a denial reason, send it to Evelyn so she can course-correct
              if (reason) {
                sendSystemMessage(`[${itemType === "write" ? "File write" : "Command"} denied by user: ${reason}]`);
              }
            }
          } else {
            const err = await resp.text();
            alert(`Failed to ${action}: ${err}`);
            if (card) card.querySelectorAll("button").forEach((btn) => (btn.disabled = false));
          }
        } catch (err) {
          alert(`Error: ${err.message}`);
          if (card) card.querySelectorAll("button").forEach((btn) => (btn.disabled = false));
        }
      }

      async function executeChatTurn(text, attachments = []) {
        const sentAt = Date.now() / 1000;
        const userMsgDiv = appendUserMessage(text, sentAt, attachments);
        const streamCtx = setupAssistantStreamContext("📨", "Message sent", userMsgDiv);

        const chatPayload = { message: text };
        if (selectedEffort !== null) {
          chatPayload.think = selectedEffort;
        }
        if (attachments && attachments.length > 0) {
          chatPayload.images = attachments.map((a) => ({
            data: a.dataUrl,
            name: a.name,
            metadata: a.metadata || {},
          }));
        }

        await executeChatStream({
          endpoint: "/chat",
          payload: chatPayload,
          streamCtx,
          statusLabel: "Thinking…",
        });
      }

      // ---------------------------------------------------------------------------
      const HISTORY_PAGE_SIZE = 50;
      let oldestLoadedId = null; // tracks cursor for "load more"
      let hasMoreHistory = false; // whether older messages exist
      let lastRenderedMsgId = 0; // tracks latest rendered msg for visibility recovery

      function renderMessageToContainer(m, container) {
        if (m.role === "user") {
          appendUserMessage(m.content, m.ts, m.attachments || []);
        } else if (m.content === "[THREAD_BREAK]") {
          const divider = document.createElement("div");
          divider.className = "thread-divider";

          container.appendChild(divider);
        } else if (m.role === "assistant") {
          const wrap = createAssistantMessage(m.ts);
          const traceBlock = renderActivityTraceBlock(m.thinking, m.tools_used);
          if (traceBlock) {
            wrap.appendChild(traceBlock);
          }
          const b = document.createElement("div");
          b.className = "bubble";
          b.innerHTML = renderMarkdown(m.content);
          wrap.appendChild(b);
          const { actions } = createMessageActions(m.id, m.content, m.feedback);

      function insertLoadMoreButton() {
        const container = document.getElementById("messages");
        // Remove any existing load-more button
        const existing = container.querySelector(".load-more-wrap");
        if (existing) existing.remove();
        if (!hasMoreHistory) return;
        const wrapDiv = document.createElement("div");
        wrapDiv.className = "load-more-wrap";
        const btn = document.createElement("button");
        btn.className = "btn-load-more";
        btn.textContent = "↑ Load older messages";
        btn.onclick = loadOlderMessages;
        wrapDiv.appendChild(btn);

      function handleAuthError(resp) {
        if (resp && resp.status === 401) {
          const key = prompt("API Key Required / Invalid. Enter your Evelyn API key (X-Evelyn-Key):");
          if (key) {
            localStorage.setItem("evelyn_api_key", key);
            location.reload();
          }

      async function loadHistory() {
        try {
          const resp = await fetch(`${API_BASE}/history?limit=${HISTORY_PAGE_SIZE}`, {
            headers: headers(),
          });
          if (!resp.ok) {
            handleAuthError(resp);
            return;
          }
          const msgs = await resp.json();
          const container = document.getElementById("messages");
          container.innerHTML = "";

          // Track pagination cursor
          if (msgs.length > 0) {
            oldestLoadedId = msgs[0].id;
            hasMoreHistory = msgs.length >= HISTORY_PAGE_SIZE;
          } else {
            oldestLoadedId = null;
            hasMoreHistory = false;
          }

          // Show "load more" button if there are likely older messages
          insertLoadMoreButton();

          let lastDateLabel = null;
          for (const m of msgs) {
            if (m.ts) {
              const d = new Date(m.ts * 1000);
              const dateLabel = d.toLocaleDateString("en-US", {
                weekday: "short",
                month: "short",
                day: "numeric",
                year: "numeric",
              });
              if (lastDateLabel !== null && dateLabel !== lastDateLabel) {
                const dateDiv = document.createElement("div");
                dateDiv.className = "date-divider";
                dateDiv.textContent = dateLabel;
                container.appendChild(dateDiv);
              }
              lastDateLabel = dateLabel;
            }
            renderMessageToContainer(m, container);
          }
          // Add regen button to the last user message only
          const allUser = container.querySelectorAll(".msg.user");
          if (allUser.length > 0) {
            addRegenToUserMsg(allUser[allUser.length - 1]);
          }
          scrollBottom();
          // Hydrate telemetry from the most recent assistant message
          let latestPromptTokens = 0;
          let latestEvalTokens = 0;
          for (let i = msgs.length - 1; i >= 0; i--) {
            if (msgs[i].prompt_eval_count !== undefined && msgs[i].prompt_eval_count !== null) {
              latestPromptTokens = msgs[i].prompt_eval_count;
              latestEvalTokens = msgs[i].eval_count || 0;
              break;
            }
          }
          if (latestPromptTokens > 0) updateTelemetry(latestPromptTokens, latestEvalTokens);

          // Update visibility-recovery cursor from loaded messages
          if (msgs.length > 0) {
            lastRenderedMsgId = Math.max(lastRenderedMsgId, msgs[msgs.length - 1].id);
          }
        } catch (e) {
          console.warn("Could not load history:", e);
        }
      }

      async function loadOlderMessages() {
        if (!oldestLoadedId || !hasMoreHistory) return;
        const btn = document.querySelector(".btn-load-more");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Loading…";
        }

        try {
          const resp = await fetch(
            `${API_BASE}/history?limit=${HISTORY_PAGE_SIZE}&before=${oldestLoadedId}`,
            { headers: headers() }
          );
          if (!resp.ok) return;
          const msgs = await resp.json();
          if (msgs.length === 0) {
            hasMoreHistory = false;
            const wrap = document.querySelector(".load-more-wrap");
            if (wrap) wrap.remove();
            return;
          }

          // Update cursor
          oldestLoadedId = msgs[0].id;
          hasMoreHistory = msgs.length >= HISTORY_PAGE_SIZE;

          const container = document.getElementById("messages");
          // Remember scroll position so we can restore it after prepending
          const prevScrollHeight = container.scrollHeight;

          // Remove existing load-more button before prepending
          const existingBtn = container.querySelector(".load-more-wrap");
          if (existingBtn) existingBtn.remove();

          // Build a document fragment with the older messages
          // We need to temporarily append to container to reuse render helpers,
          // then move those nodes to the top.
          const marker = document.createElement("div");
          marker.id = "_load-more-marker";
          container.appendChild(marker);

          for (const m of msgs) {
            renderMessageToContainer(m, container);
          }

          // Collect all nodes that were appended after the marker
          const newNodes = [];
          let node = marker.nextSibling;
          while (node) {
            newNodes.push(node);
            node = node.nextSibling;
          }
          marker.remove();

          // Find the first real message (skip old load-more button position)
          const firstChild = container.firstChild;
          for (const n of newNodes) {
            container.insertBefore(n, firstChild);
          }

          // Re-insert load-more button at top if more history exists
          insertLoadMoreButton();

          // Restore scroll position so the user stays where they were
          container.scrollTop = container.scrollHeight - prevScrollHeight;
        } catch (e) {
          console.warn("Could not load older messages:", e);
        }
      }

      function editUserMessage(userMsgDiv) {
        if (isStreaming) return;
        const bubble = userMsgDiv.querySelector(".bubble");
        if (!bubble) return;

        // Don't open duplicate edit box
        if (userMsgDiv.querySelector(".msg-edit-box")) return;

        const currentText = userMsgDiv.dataset.rawText || bubble.innerText.trim();

        // Add editing class to expand container width
        userMsgDiv.classList.add("editing");

        // Hide bubble and action buttons while editing
        bubble.style.display = "none";
        const actions = userMsgDiv.querySelector(".msg-actions");
        if (actions) actions.style.display = "none";

        // Create edit container
        const editBox = document.createElement("div");
        editBox.className = "msg-edit-box";

        const textarea = document.createElement("textarea");
        textarea.className = "msg-edit-textarea";
        textarea.value = currentText;

        const adjustHeight = () => {
          textarea.style.height = "auto";
          textarea.style.height = Math.max(90, textarea.scrollHeight) + "px";
        };
        textarea.addEventListener("input", adjustHeight);

        const editActions = document.createElement("div");
        editActions.className = "msg-edit-actions";

        const cancelBtn = document.createElement("button");
        cancelBtn.className = "btn-edit-cancel";
        cancelBtn.textContent = "Cancel";

        const saveBtn = document.createElement("button");
        saveBtn.className = "btn-edit-save";
        saveBtn.textContent = "Save & Submit";

        const closeEditBox = () => {
          editBox.remove();
          userMsgDiv.classList.remove("editing");
          bubble.style.display = "";
          if (actions) actions.style.display = "";
        };

        cancelBtn.onclick = closeEditBox;

        saveBtn.onclick = () => {
          const newText = textarea.value.trim();
          closeEditBox();
          if (newText && newText !== currentText) {
            submitEditedMessage(userMsgDiv, newText);
          }
        };

        textarea.onkeydown = (e) => {
          if (e.key === "Escape") {
            closeEditBox();
          } else if (e.key === "Enter") {
            if ((e.ctrlKey || e.metaKey) && !e.shiftKey) {
              e.preventDefault();
              saveBtn.click();
            } else if (!e.shiftKey && !isTouchDevice()) {
              e.preventDefault();
              saveBtn.click();
            }
          }
        };

        editActions.appendChild(cancelBtn);
        editActions.appendChild(saveBtn);
        editBox.appendChild(textarea);
        editBox.appendChild(editActions);

        userMsgDiv.appendChild(editBox);
        adjustHeight();
        textarea.focus();
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
      }

      async function submitEditedMessage(userMsgDiv, newText) {
        if (isStreaming) return;
        userMsgDiv.dataset.rawText = newText;
        const bubble = userMsgDiv.querySelector(".bubble");
        if (bubble) bubble.innerHTML = renderMarkdown(newText);

        // Remove the assistant message(s) following this user message
        let next = userMsgDiv.nextElementSibling;
        while (next && next.classList.contains("msg") && next.classList.contains("assistant")) {
          const toRemove = next;
          next = next.nextElementSibling;
          toRemove.remove();
        }

        const oldActions = userMsgDiv.querySelector(".msg-actions");
        if (oldActions) oldActions.remove();

        const streamCtx = setupAssistantStreamContext("✏️", "Resubmitting edited message…", userMsgDiv);

        await executeChatStream({
          endpoint: "/edit",
          payload: { message: newText },
          streamCtx,
          statusLabel: "Editing message…",
        });
      }

      async function regenerateResponse(userMsgDiv) {
        if (isStreaming) return;
        // Remove the assistant message(s) following this user message
        let next = userMsgDiv.nextElementSibling;
        while (next && next.classList.contains("msg") && next.classList.contains("assistant")) {
          const toRemove = next;
          next = next.nextElementSibling;
          toRemove.remove();
        }
        // Remove the regen button from this user message
        const oldBtn = userMsgDiv.querySelector(".btn-regen");
        if (oldBtn) oldBtn.remove();

        const streamCtx = setupAssistantStreamContext("🔄", "Regenerating response…", userMsgDiv);

        await executeChatStream({
          endpoint: "/regenerate",
          payload: {},
          streamCtx,
          statusLabel: "Regenerating…",
        });
      }

      async function pollTaskStatus(taskName, intervalMs, btn, defaultLabel, notice) {
        return new Promise((resolve) => {
          let networkErrors = 0;
          const MAX_NETWORK_ERRORS = 3;

          function resetBtn() {
            btn.disabled = false;
            btn.textContent = defaultLabel;
            btn.style.borderColor = "";
            btn.style.color = "";
          }

          const poll = setInterval(async () => {
            try {
              const resp = await fetch(`${API_BASE}/task_status/${taskName}`, {
                headers: headers(),
              });
              const data = await resp.json();
              networkErrors = 0; // Reset on successful response

              if (data.status === "done") {
                clearInterval(poll);
                notice.className = "system-notice done";
                notice.innerHTML = `<span>✅</span><span>${defaultLabel} completed.</span>`;
                btn.textContent = `✓ ${defaultLabel} done`;
                btn.style.borderColor = "var(--tool-text)";
                btn.style.color = "var(--tool-text)";
                setTimeout(resetBtn, 4000);
                resolve("done");
              } else if (data.status === "error") {
                clearInterval(poll);
                notice.className = "system-notice error";
                notice.innerHTML = `<span>❌</span><span>${defaultLabel} failed: ${data.error || "unknown error"}</span>`;
                btn.textContent = `✗ ${defaultLabel} failed`;
                btn.style.borderColor = "#ff6666";
                btn.style.color = "#ff6666";
                setTimeout(resetBtn, 4000);
                resolve("error");
              } else if (data.status === "unknown") {
                // Server restarted — task state was lost (in-memory dict cleared)
                clearInterval(poll);
                notice.className = "system-notice error";
                notice.innerHTML = `<span>⚠️</span><span>${defaultLabel} — server restarted, task state lost. Check console for result.</span>`;
                setTimeout(resetBtn, 4000);
                resolve("unknown");
              }
              // status === 'running' — keep polling
            } catch {
              // Network error — give it a few tries before giving up
              networkErrors++;
              if (networkErrors >= MAX_NETWORK_ERRORS) {
                clearInterval(poll);
                notice.className = "system-notice error";
                notice.innerHTML = `<span>⚠️</span><span>${defaultLabel} — lost connection to server. Check if it's still running.</span>`;
                setTimeout(resetBtn, 4000);
                resolve("disconnected");
              }
            }
          }, intervalMs);
        });
      }

      // ---------------------------------------------------------------------------
      // Visibility recovery — reconnect active stream or pull missed history
      // ---------------------------------------------------------------------------
      document.addEventListener("visibilitychange", async () => {
        if (document.visibilityState !== "visible") return;

        // If tab was streaming when backgrounded, check active stream on server
        if (isStreaming && currentStream && !currentStream.isDone) {
          try {
            const resp = await fetch(`${API_BASE}/chat/active_stream`, { headers: headers() });
            if (resp.ok) {
              const activeData = await resp.json();
              if (activeData.active && activeData.stream_id) {
                currentStream.id = activeData.stream_id;
                await reconnectActiveStream();
                return;
              } else {
                // Server finished the turn while tab was away — reload history cleanly
                currentStream.isDone = true;
                sessionStorage.removeItem("active_stream_id");
                if (currentStream.wrap && currentStream.wrap.parentNode) {
                  currentStream.wrap.remove();
                }
                finishStreamingUI();
                await loadHistory();
                setStatus("Ready");
                return;
              }
            }
          } catch (e) {
            // Network blip
          }
        }

        // If idle (or stream finished), check if any new messages exist on server
        try {
          const resp = await fetch(`${API_BASE}/latest_message_id`, { headers: headers() });
          if (!resp.ok) return;
          const { id: serverLatest } = await resp.json();

          if (serverLatest > lastRenderedMsgId) {
            console.log(
              `[Visibility Recovery] Server has msg #${serverLatest}, UI has #${lastRenderedMsgId} — reloading history`
            );
            if (isStreaming) {
              finishStreamingUI();
            }
            setStatus("Reconnected");
            await loadHistory();
            setStatus("Ready");
          }
        } catch {
          // Offline or server down
        }
      });

      // API key prompt if not set
      if (
        !API_KEY &&
        window.location.hostname !== "localhost" &&
        window.location.hostname !== "127.0.0.1"
      ) {
        const key = prompt("Enter your Evelyn API key (X-Evelyn-Key):");
        if (key) {
          localStorage.setItem("evelyn_api_key", key);
          location.reload();
        }
      }

      // Startup & Active Stream Resumption
      async function checkAndResumeActiveStream() {
        try {
          const resp = await fetch(`${API_BASE}/chat/active_stream`, { headers: headers() });
          if (!resp.ok) return false;
          const activeData = await resp.json();
          if (!activeData.active || !activeData.stream_id) {
            sessionStorage.removeItem("active_stream_id");
            // Check if a message finished right before loadHistory
            try {
              const latestResp = await fetch(`${API_BASE}/latest_message_id`, { headers: headers() });
              if (latestResp.ok) {
                const { id } = await latestResp.json();
                if (id > lastRenderedMsgId) {
                  await loadHistory();
                }
              }
            } catch {}
            return false;
          }

          const streamIdToResume = activeData.stream_id;
          console.log(`[Startup] Resuming in-flight stream session: ${streamIdToResume}`);
          sessionStorage.setItem("active_stream_id", streamIdToResume);

          const streamCtx = setupAssistantStreamContext(null, null);
          const { wrap, actLog, addActivity, removeActivity, thinkingHandler } = streamCtx;

          startStreamingUI("Streaming…");

          currentStream = {
            id: streamIdToResume,
            lastChunkId: -1,
            wrap: wrap,
            userMsgDiv: null,
            thinkingHandler: thinkingHandler,
            addActivity: addActivity,
            removeActivity: removeActivity,
            bubble: null,
            cursorEl: null,
            actLog: actLog,
            actRemoved: false,
            contentText: "",
            usedTools: [],
            abortController: new AbortController(),
            isReading: false,
            isDone: false,
          };

          const streamResp = await fetch(`${API_BASE}/chat/stream/${streamIdToResume}?after=-1`, {
            headers: headers(),
            signal: currentStream.abortController.signal,
          });

          if (streamResp.ok) {
            await consumeStreamResponse(streamResp);
            return true;
          } else {
            sessionStorage.removeItem("active_stream_id");
            wrap.remove();
            await loadHistory();
            return false;
          }
        } catch (e) {
          if (e.name !== "AbortError") {
            console.warn("[Startup] Failed to resume stream:", e);
          }
          sessionStorage.removeItem("active_stream_id");
          return false;
        } finally {
          if (currentStream && currentStream.isDone) {
            finishStreamingUI();
          }
        }
      }

      async function fetchStatus() {
        try {
          const resp = await fetch(`${API_BASE}/status`, { headers: headers() });
          if (resp.ok) {
            const data = await resp.json();
            if (data.num_ctx) {
              maxContextTokens = data.num_ctx;
              if (lastTelemetryTokens > 0) {
                updateTelemetry(lastTelemetryTokens, lastTelemetryEvalTokens);
              }
            }
          }
        } catch (e) {
          console.warn("Could not fetch status:", e);
        }
      }

      async function initApp() {
        await fetchStatus();
        await loadHistory();
        updateDevUIBadge();
        // Check for active background stream and resume if in-flight
        await checkAndResumeActiveStream();
      }

      initApp();

      async function updateDevUIBadge() {
        try {
          const [resResearch, resExt, resProp] = await Promise.all([
            fetch(`${API_BASE}/research/list`, { headers: headers() }),
            fetch(`${API_BASE}/api/review/extractions`, { headers: headers() }),
            fetch(`${API_BASE}/api/review/proposals`, { headers: headers() }),
          ]);

          let activeResearch = false;
          let pendingReviews = false;

          if (resResearch.ok) {
            const tasks = await resResearch.json();
            activeResearch = tasks.some(
              (t) =>
                t.status === "running" ||
                ["plan", "search", "extract", "evaluate", "synthesize"].includes(t.status)
            );
          }

          if (resExt.ok && resProp.ok) {
            const extractions = await resExt.json();
            const proposals = await resProp.json();
            pendingReviews = extractions.length > 0 || proposals.length > 0;
          }

          const pulse = document.getElementById("research-pulse");
          if (pulse) {
            if (activeResearch) {
              pulse.style.display = "inline-block";
              pulse.style.background = "var(--accent)";
              pulse.style.boxShadow = "0 0 6px var(--accent)";
              pulse.style.animation = "pulse-research 1.5s infinite";
            } else if (pendingReviews) {
              pulse.style.display = "inline-block";
              pulse.style.background = "#fbbf24";
              pulse.style.boxShadow = "none";
              pulse.style.animation = "none";
            } else {
              pulse.style.display = "none";
            }
          }
        } catch (e) {
          // Ignore network issues
        }
      }
      updateDevUIBadge();

      // ---------------------------------------------------------------------------
      // Dynamic Ambient Island & Thought Bubble Client Functions
      // ---------------------------------------------------------------------------
      let currentAmbientThoughtId = null;

      function getCircadianStatus() {
        const hour = new Date().getHours();
        const isDiurnal = hour >= 9 && hour < 21;
        return {
          icon: isDiurnal ? "☀️" : "🌙",
          label: isDiurnal ? "Daytime Quiet" : "Nighttime Rest",
          description: isDiurnal
            ? "Evelyn is active and listening. Spontaneous daytime thoughts appear here during pauses in conversation."
            : "Evelyn is in nocturnal quiet/rest hours. Ambient thought generation pauses until morning.",
        };
      }

      async function fetchAmbientFeed() {
        if (document.hidden) return;
        try {
          const res = await fetch("/ambient/feed?limit=10", { headers: headers() });
          if (!res.ok) return;
          const data = await res.json();
          const items = data.items || [];
          const island = document.getElementById("ambient-header-island");
          const idlePill = document.getElementById("ambient-idle-pill");
          const idleIcon = document.getElementById("ambient-idle-icon");
          const idleSnippet = document.getElementById("ambient-idle-snippet");
          const thoughtPill = document.getElementById("ambient-thought-pill");
          const thoughtSnippet = document.getElementById("ambient-thought-snippet");
          const thoughtBadge = document.getElementById("ambient-thought-badge");
          const mediaPill = document.getElementById("ambient-media-pill");
          const mediaBadge = document.getElementById("ambient-media-badge");
          const dismissBtn = document.getElementById("ambient-dismiss-btn");
          const dismissAllBtn = document.getElementById("ambient-dismiss-all-btn");
          const popoverContent = document.getElementById("ambient-popover-content");
          const popoverTime = document.getElementById("ambient-popover-time");
          const popoverTag = document.getElementById("ambient-popover-tag");
          const popoverQueue = document.getElementById("ambient-popover-queue");

          // Filter undismissed thoughts and sort chronologically (FIFO queue: oldest first)
          const activeThoughts = items
            .filter((i) => i.type === "thought" && !i.dismissed)
            .sort((a, b) => (a.ts || 0) - (b.ts || 0));

          const mediaItems = items.filter((i) => i.type === "media_share" && !i.dismissed);
          const circadian = getCircadianStatus();

          if (island) island.style.display = "inline-flex";

          if (activeThoughts.length > 0) {
            const oldestThought = activeThoughts[0];
            currentAmbientThoughtId = oldestThought.id;
            if (idlePill) idlePill.style.display = "none";
            if (thoughtPill) thoughtPill.style.display = "inline-flex";
            if (thoughtSnippet) thoughtSnippet.textContent = oldestThought.content;

            if (thoughtBadge) {
              if (activeThoughts.length > 1) {
                thoughtBadge.textContent = `${activeThoughts.length}`;
                thoughtBadge.style.display = "inline-flex";
                thoughtBadge.title = `${activeThoughts.length} unread daytime thoughts`;
              } else {
                thoughtBadge.style.display = "none";
              }
            }

            if (popoverContent) popoverContent.textContent = oldestThought.content;
            if (popoverTime && oldestThought.ts) {
              const d = new Date(oldestThought.ts * 1000);
              popoverTime.textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            }
            if (popoverTag) {
              const mood = oldestThought.metadata?.mood || "Reflective";
              popoverTag.textContent = `💭 ${mood.toUpperCase()} THOUGHT`;
            }
            if (popoverQueue) {
              popoverQueue.textContent = activeThoughts.length > 1 ? `1 of ${activeThoughts.length}` : "";
            }
            if (dismissBtn) dismissBtn.style.display = "inline-block";
            if (dismissAllBtn) {
              dismissAllBtn.style.display = activeThoughts.length > 1 ? "inline-block" : "none";
            }
          } else {
            currentAmbientThoughtId = null;
            if (thoughtPill) thoughtPill.style.display = "none";
            if (thoughtBadge) thoughtBadge.style.display = "none";
            if (idlePill) {
              idlePill.style.display = "inline-flex";
              if (idleIcon) idleIcon.textContent = circadian.icon;
              if (idleSnippet) idleSnippet.textContent = circadian.label;
            }
            if (popoverContent) popoverContent.textContent = circadian.description;
            if (popoverTime) popoverTime.textContent = "";
            if (popoverTag) popoverTag.textContent = `${circadian.icon} AMBIENT STATUS`;
            if (popoverQueue) popoverQueue.textContent = "";
            if (dismissBtn) dismissBtn.style.display = "none";
            if (dismissAllBtn) dismissAllBtn.style.display = "none";
          }

          if (mediaItems.length > 0) {
            if (mediaPill) mediaPill.style.display = "inline-flex";
            if (mediaBadge) mediaBadge.textContent = mediaItems.length;
          } else {
            if (mediaPill) mediaPill.style.display = "none";
          }
        } catch (err) {
          // Ignore transient fetch errors
        }
      }

      function toggleAmbientPopover(event) {
        if (event) event.stopPropagation();
        const popover = document.getElementById("ambient-thought-popover");
        if (popover) popover.classList.toggle("active");
      }

      function closeAmbientPopover() {
        const popover = document.getElementById("ambient-thought-popover");
        if (popover) popover.classList.remove("active");
      }

      async function dismissAmbientThought() {
        if (currentAmbientThoughtId) {
          try {
            await fetch("/ambient/dismiss", {
              method: "POST",
              headers: headers({ "Content-Type": "application/json" }),
              body: JSON.stringify({ id: currentAmbientThoughtId }),
            });
          } catch (e) {
            console.error("Failed to dismiss ambient thought:", e);
          }
        }
        closeAmbientPopover();
        fetchAmbientFeed();
      }

      async function dismissAllAmbientThoughts() {
        try {
          await fetch("/ambient/dismiss_all", {
            method: "POST",
            headers: headers({ "Content-Type": "application/json" }),
            body: JSON.stringify({ type: "thought" }),
          });
        } catch (e) {
          console.error("Failed to dismiss all ambient thoughts:", e);
        }
        closeAmbientPopover();
        fetchAmbientFeed();
      }

      function openAmbientMedia(event) {
        if (event) event.stopPropagation();
        // Hook into existing media inspector lightbox
        console.debug("Opening ambient media share modal");
      }

      document.addEventListener("click", (e) => {
        const popover = document.getElementById("ambient-thought-popover");
        const island = document.getElementById("ambient-header-island");
        if (popover && !popover.contains(e.target) && island && !island.contains(e.target)) {
          popover.classList.remove("active");
        }
      });

      // Poll ambient feed periodically (every 30s) and on tab focus
      setInterval(fetchAmbientFeed, 30000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) fetchAmbientFeed();
      });
      fetchAmbientFeed();
    </script>
    <div id="lightbox-modal" class="lightbox-modal" onclick="onLightboxBackdropClick(event)">
      <div class="lightbox-dialog" onclick="event.stopPropagation()">
        <div class="lightbox-img-pane">
          <img id="lightbox-img" src="" alt="Enlarged Image" />
        </div>
        <div class="lightbox-info-pane">
          <div class="lightbox-header">
            <span class="lightbox-title">Media Inspector</span>
            <button class="lightbox-close" type="button" onclick="closeLightbox()" title="Close">✕</button>
          </div>
          
          <div class="lightbox-field">
            <label for="media-edit-desc">Description / Caption</label>
            <textarea id="media-edit-desc" rows="3" placeholder="Image description..."></textarea>
          </div>

          <div class="lightbox-field">
            <label for="media-edit-tags">Tags (comma-separated or #tags)</label>
            <input id="media-edit-tags" type="text" placeholder="#cat, #Fox, #pets/Fox" />
          </div>

          <div class="lightbox-field">
            <label for="media-edit-domain">Taxonomy Domain</label>
            <input id="media-edit-domain" type="text" placeholder="Personal/Photo" />
          </div>

          <div class="lightbox-meta-grid" id="lightbox-meta-grid">
            <div class="lightbox-meta-item">
              GUID
              <strong id="media-meta-guid">-</strong>
            </div>
            <div class="lightbox-meta-item">
              Resolution
              <strong id="media-meta-res">-</strong>
            </div>
            <div class="lightbox-meta-item">
              Taken
              <strong id="media-meta-date">-</strong>
            </div>
            <div class="lightbox-meta-item">
              Camera
              <strong id="media-meta-camera">-</strong>
            </div>
          </div>

          <button id="media-save-btn" class="lightbox-save-btn" type="button" onclick="saveMediaMetadata()">
            Save Metadata
          </button>
          <div id="media-save-status" class="lightbox-status"></div>
        </div>
      </div>
    </div>
  </body>
</html>
