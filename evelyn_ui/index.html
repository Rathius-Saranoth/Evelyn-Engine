<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evelyn</title>
  <link rel="icon" type="image/x-icon" href="/ui/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0d0d12;
      --surface:   #13131c;
      --surface2:  #1a1a28;
      --border:    #2a2a40;
      --accent:    #7c6af7;
      --accent-dim:#4a3fb0;
      --text:      #e8e8f0;
      --text-dim:  #8888aa;
      --think-bg:  #0f1520;
      --think-border:#2a3a55;
      --think-text:#6699cc;
      --tool-bg:   #0f1a10;
      --tool-border:#2a4030;
      --tool-text: #66bb77;
      --user-bg:   #1e1e30;
      --radius:    12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #b06af7);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    header h1 { font-size: 16px; font-weight: 500; }
    header span { font-size: 12px; color: var(--text-dim); }
    .header-actions { margin-left: auto; display: flex; gap: 8px; }
    .btn-ghost {
      background: none; border: 1px solid var(--border);
      color: var(--text-dim); padding: 5px 12px; border-radius: 6px;
      cursor: pointer; font-size: 12px; transition: all 0.15s;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-ghost.danger:hover { border-color: #e86040; color: #e86040; }

    /* Thread divider */
    .thread-divider {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 0; color: var(--text-dim); font-size: 11px;
      letter-spacing: 0.05em; text-transform: uppercase;
    }
    .thread-divider::before, .thread-divider::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }

    /* System notices (background task status) */
    .system-notice {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; color: var(--text-dim); font-size: 12px;
      background: rgba(255,255,255,0.03); border-radius: 8px;
      border-left: 3px solid var(--accent);
      transition: opacity 0.3s;
    }
    .system-notice.done { border-left-color: var(--tool-text); }
    .system-notice.error { border-left-color: #ff6666; }

    /* Messages */
    #messages {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 16px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg { display: flex; flex-direction: column; max-width: 85%; gap: 2px; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }

    /* Sender + timestamp label */
    .msg-meta {
      font-size: 11px; color: var(--text-dim);
      padding: 0 4px; letter-spacing: 0.02em;
    }
    .msg.user .msg-meta { text-align: right; }
    .msg.assistant .msg-meta { text-align: left; }

    .bubble {
      padding: 12px 16px; border-radius: var(--radius); line-height: 1.6;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble { background: var(--user-bg); border: 1px solid var(--border); }
    .msg.assistant .bubble { background: var(--surface); border: 1px solid var(--border); }

    /* Thinking block */
    .think-block {
      border: 1px solid var(--think-border);
      border-radius: 8px; overflow: hidden; margin-bottom: 8px;
      background: var(--think-bg); max-width: 680px;
    }
    .think-header {
      padding: 6px 12px; display: flex; align-items: center; gap: 8px;
      cursor: pointer; user-select: none;
      border-bottom: 1px solid var(--think-border);
    }
    .think-header:hover { background: rgba(255,255,255,0.03); }
    .think-icon { font-size: 14px; }
    .think-label { font-size: 12px; color: var(--think-text); font-weight: 500; }
    .think-chevron { margin-left: auto; font-size: 11px; color: var(--text-dim); transition: transform 0.2s; }
    .think-block.open .think-chevron { transform: rotate(180deg); }
    .think-content {
      padding: 10px 14px; font-size: 13px; color: var(--think-text);
      font-family: 'JetBrains Mono', monospace; line-height: 1.5;
      display: none; max-height: 300px; overflow-y: auto;
      white-space: pre-wrap;
    }
    .think-block.open .think-content { display: block; }

    /* Tool activity */
    .tool-indicator {
      display: flex; align-items: center; gap: 8px; padding: 6px 12px;
      background: var(--tool-bg); border: 1px solid var(--tool-border);
      border-radius: 6px; font-size: 12px; color: var(--tool-text);
      margin-bottom: 6px; width: fit-content;
    }
    .tool-indicator .spinner {
      width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid var(--tool-border); border-top-color: var(--tool-text);
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Typing cursor */
    .cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); animation: blink 0.8s step-end infinite; vertical-align: text-bottom; margin-left: 2px; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Activity log (replaces typing indicator) */
    .activity-log {
      display: flex; flex-direction: column; gap: 4px;
      padding: 10px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); width: fit-content; min-width: 200px;
    }
    .activity-step {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--text-dim);
      animation: step-in 0.2s ease-out;
    }
    @keyframes step-in {
      from { opacity: 0; transform: translateY(3px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .activity-step .step-icon { font-size: 13px; flex-shrink: 0; }
    .activity-step .step-dot {
      width: 6px; height: 6px; border-radius: 50%;
      border: 1.5px solid var(--text-dim); border-top-color: var(--accent);
      flex-shrink: 0;
      animation: spin 0.8s linear infinite;
    }
    .activity-step.done .step-dot {
      animation: none;
      background: var(--tool-text); border-color: var(--tool-text);
    }

    /* Avatar pulse during generation */
    .avatar.active {
      animation: avatar-pulse 1.5s ease-in-out infinite;
    }
    @keyframes avatar-pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(124,106,247,0.15); }
      50% { box-shadow: 0 0 0 6px rgba(124,106,247,0.35); }
    }

    .msg-actions { display: flex; gap: 6px; padding: 0 4px; }
    .btn-tts {
      background: none; border: none; cursor: pointer; color: var(--text-dim);
      font-size: 16px; padding: 2px 4px; border-radius: 4px; transition: color 0.15s;
    }
    .btn-tts:hover { color: var(--accent); }
    .btn-regen {
      background: none; border: none; cursor: pointer; color: var(--text-dim);
      font-size: 14px; padding: 2px 4px; border-radius: 4px; transition: color 0.15s;
    }
    .btn-regen:hover { color: var(--accent); }

    /* Write-tool badges */
    .write-badges {
      display: flex; gap: 6px; flex-wrap: wrap;
      padding: 0 2px; margin-top: 2px;
    }
    .write-badge {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; color: var(--tool-text);
      background: var(--tool-bg); border: 1px solid var(--tool-border);
      border-radius: 4px; padding: 2px 8px;
    }

    /* Markdown-ish: inline code */
    .bubble code {
      background: var(--surface2); padding: 2px 6px; border-radius: 4px;
      font-family: 'JetBrains Mono', monospace; font-size: 13px;
    }
    .bubble strong { font-weight: 600; }

    /* Input area */
    footer {
      padding: 12px 16px; background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .input-row {
      display: flex; gap: 8px; align-items: flex-end;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 8px 12px;
      transition: border-color 0.15s;
    }
    .input-row:focus-within { border-color: var(--accent); }
    #input {
      flex: 1; background: none; border: none; color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 15px;
      resize: none; outline: none; max-height: 150px; line-height: 1.5;
      min-height: 24px;
    }
    #input::placeholder { color: var(--text-dim); }
    #send-btn {
      background: var(--accent); border: none; color: #fff;
      width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
      font-size: 18px; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; flex-shrink: 0;
    }
    #send-btn:hover { background: var(--accent-dim); }
    #send-btn:disabled { background: var(--border); cursor: not-allowed; }
    .input-hint { font-size: 11px; color: var(--text-dim); margin-top: 6px; padding-left: 4px; }

    /* Load-more button */
    .load-more-wrap {
      display: flex; justify-content: center; padding: 12px 0;
    }
    .btn-load-more {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-dim); font-family: 'Inter', sans-serif; font-size: 13px;
      padding: 8px 20px; border-radius: 8px; cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .btn-load-more:hover {
      border-color: var(--accent); color: var(--text); background: var(--surface);
    }
    .btn-load-more:disabled {
      cursor: not-allowed; opacity: 0.5;
    }

    /* Modal / Lightbox */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal-container {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); width: 90%; max-width: 800px;
      max-height: 85vh; display: flex; flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transform: translateY(20px); transition: transform 0.2s ease;
    }
    .modal-overlay.open .modal-container { transform: translateY(0); }
    .modal-header {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-title { font-weight: 500; font-size: 15px; }
    .modal-close {
      background: none; border: none; color: var(--text-dim);
      font-size: 20px; cursor: pointer; transition: color 0.15s;
    }
    .modal-close:hover { color: #fff; }
    .modal-content {
      padding: 20px; overflow-y: auto; flex: 1;
      font-size: 14px; line-height: 1.6;
    }
    .modal-content img { max-width: 100%; border-radius: 8px; }
    .modal-content h1, .modal-content h2, .modal-content h3 { margin-top: 1em; margin-bottom: 0.5em; color: #fff; }
    .modal-content p { margin-bottom: 1em; }
    @keyframes pulse-research {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
    }
  </style>
</head>
<body>
<header>
  <div class="avatar">🌙</div>
  <div>
    <h1>Evelyn</h1>
    <span id="status-text">Ready</span>
  </div>
  <div class="header-actions">
    <button class="btn-ghost" id="new-thread-btn" title="Start a new conversation thread" onclick="newThread()">✦ New Thread</button>
    <button class="btn-ghost" id="refresh-memory-btn" title="Rebuild Vault Map then re-ingest all knowledge into Chroma" onclick="refreshMemory()">✦ Refresh Memory</button>
  </div>
</header>

<div id="messages"></div>

<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="Message Evelyn…" autofocus></textarea>
    <button id="send-btn" title="Send">↑</button>
  </div>
  <div class="input-hint" style="display: flex; justify-content: space-between;">
    <span>Enter to send · Shift+Enter for newline</span>
    <span style="display: flex; gap: 12px; align-items: center;">
      <a href="/ui/dev.html" id="dev-ui-link" title="Review Queue" style="text-decoration: none; color: var(--text-dim); font-size: 11px; transition: color 0.2s; display: inline-flex; align-items: center; gap: 4px;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-dim)'">
        <span id="research-pulse" style="display: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulse-research 1.5s infinite;"></span>
        <span>⚙️ Dev UI</span>
      </a>
      <span id="telemetry" style="transition: color 0.3s; opacity: 0.8;"></span>
    </span>
  </div>
</footer>

<div class="modal-overlay" id="artifact-modal" onclick="closeModal(event)">
  <div class="modal-container" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Artifact</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-content" id="modal-content"></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// ARCHITECTURE NOTE: Mobile Backgrounding & State Hydration
// ---------------------------------------------------------------------------
// Mobile browsers (iOS Safari, Chrome) will pause JS and kill active SSE/fetch
// streams when this tab is backgrounded or the screen turns off. 
// When the tab is resumed, recoverFromConnectionDrop() detects the dead 
// stream and forces a full DOM rebuild via loadHistory().
//
// RULE: Any UI state driven by SSE events MUST have a fallback hydration path.
// If you add a new streaming event (e.g. metrics, tool states, indicators), 
// you must also ensure the backend /history endpoint serves that data, and 
// that loadHistory() can parse it to reconstruct the exact UI state on reload.
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------
const API_BASE = window.location.origin;
const API_KEY  = localStorage.getItem('evelyn_api_key') || '';

function headers(extra = {}) {
  return { 'Content-Type': 'application/json', 'X-Evelyn-Key': API_KEY, ...extra };
}

// ---------------------------------------------------------------------------
// Utility
// ---------------------------------------------------------------------------
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(text) {
  // Minimal markdown for chat bubbles
  let html = escapeHtml(text)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\[\[Research\/([^\]]+)\]\]/g, (match, slug) => {
    return `<button class="write-badge" style="cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; vertical-align: middle; border: 1px solid var(--tool-border); background: var(--tool-bg); color: var(--tool-text);" onclick="openModal('research', '${slug}')">🔍 Deep Research: ${slug}</button>`;
  });
  return html;
}

function renderFullMarkdown(text) {
  // Extended markdown for modals
  let html = escapeHtml(text)
    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');
  html = html.replace(/\[\[Research\/([^\]]+)\]\]/g, (match, slug) => {
    return `<button class="write-badge" style="cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; vertical-align: middle; border: 1px solid var(--tool-border); background: var(--tool-bg); color: var(--tool-text);" onclick="openModal('research', '${slug}')">🔍 Deep Research: ${slug}</button>`;
  });
  return `<p>${html}</p>`;
}

function scrollBottom() {
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
}

function setStatus(txt) {
  document.getElementById('status-text').textContent = txt;
}

function formatTime(ts) {
  // ts: unix timestamp (seconds) or null for "now"
  const d = ts ? new Date(ts * 1000) : new Date();
  return d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ---------------------------------------------------------------------------
// Think block builder
// ---------------------------------------------------------------------------
function createThinkBlock() {
  const wrap = document.createElement('div');
  wrap.className = 'think-block open';
  wrap.innerHTML = `
    <div class="think-header" onclick="this.parentElement.classList.toggle('open')">
      <span class="think-icon">🧠</span>
      <span class="think-label">Thinking…</span>
      <span class="think-chevron">▼</span>
    </div>
    <div class="think-content"></div>`;
  return wrap;
}

// ---------------------------------------------------------------------------
// Tool indicator
// ---------------------------------------------------------------------------
function createToolIndicator(name) {
  const el = document.createElement('div');
  el.className = 'tool-indicator';
  const labels = {
    search_vault: 'Searching vault…',
    recall_specific_memory: 'Reading memory…',
    read_journal_entry: 'Reading journal…',
    read_recent_journal_entries: 'Reviewing recent journal…',
    write_journal_entry: 'Writing journal entry…',
    log_context_fact: 'Logging fact…',
    update_context_fact: 'Updating context…',
    generate_image: 'Generating image…',
    sync_context_memory: 'Syncing memory…',
  };
  el.innerHTML = `<div class="spinner"></div><span>${labels[name] || name + '…'}</span>`;
  return el;
}

// ---------------------------------------------------------------------------
// Message rendering
// ---------------------------------------------------------------------------
function appendUserMessage(text, ts) {
  const div = document.createElement('div');
  div.className = 'msg user';
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = `You · ${formatTime(ts)}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = renderMarkdown(text);
  div.appendChild(meta);
  div.appendChild(bubble);
  document.getElementById('messages').appendChild(div);
  scrollBottom();
  return div;
}

function createAssistantMessage(ts) {
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = `Evelyn · ${formatTime(ts)}`;
  wrap.appendChild(meta);
  document.getElementById('messages').appendChild(wrap);
  scrollBottom();
  return wrap;
}

// TTS button
let ttsAudio = null;
function playTTS(text, btn) {
  if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; btn.textContent = '🔊'; return; }
  btn.textContent = '⏳';
  fetch(`${API_BASE}/tts`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'tts', input: text }),
  })
  .then(r => r.blob())
  .then(blob => {
    const url = URL.createObjectURL(blob);
    ttsAudio = new Audio(url);
    ttsAudio.play();
    btn.textContent = '⏹';
    ttsAudio.onended = () => { ttsAudio = null; btn.textContent = '🔊'; };
  })
  .catch(() => { btn.textContent = '🔊'; });
}



// ---------------------------------------------------------------------------
// Write-tool tracking — tools that create/edit files
// ---------------------------------------------------------------------------
const WRITE_TOOLS = {
  write_journal_entry:  { icon: '📓', label: 'Journal entry written' },
  log_context_fact:     { icon: '📌', label: 'Context fact logged' },
  update_context_fact:  { icon: '📝', label: 'Context fact updated' },
  generate_image:       { icon: '🎨', label: 'Image generated' },
};

function addWriteBadges(wrap, usedTools, contentText = '') {
  const writesUsed = usedTools.map(tstr => {
    const match = tstr.match(/^([^\[]+)(?:\[(.*?)\])?$/);
    return match ? { name: match[1], data: match[2] } : { name: tstr, data: null };
  }).filter(t => WRITE_TOOLS[t.name]);

  if (writesUsed.length === 0) return;
  const container = document.createElement('div');
  container.className = 'write-badges';
  for (const t of writesUsed) {
    let badge;
    if (t.name === 'generate_image') {
      let imgUrl = t.data;
      if (imgUrl) {
        badge = document.createElement('button');
        badge.onclick = () => openModal('image', imgUrl);
        badge.style.cursor = 'pointer';
      } else {
        badge = document.createElement('span');
      }
    } else if (t.name === 'write_journal_entry') {
      let docId = t.data;
      if (docId) {
        badge = document.createElement('button');
        badge.onclick = () => openModal('journal', docId);
        badge.style.cursor = 'pointer';
      } else {
        badge = document.createElement('span');
      }
    } else {
      badge = document.createElement('span');
    }
    badge.className = 'write-badge';
    badge.textContent = `${WRITE_TOOLS[t.name].icon} ${WRITE_TOOLS[t.name].label}`;
    container.appendChild(badge);
  }
  // Insert before msg-actions (TTS/regen) if present, otherwise append
  const actions = wrap.querySelector('.msg-actions');
  if (actions) wrap.insertBefore(container, actions);
  else wrap.appendChild(container);
}

// ---------------------------------------------------------------------------
// Modals
// ---------------------------------------------------------------------------
async function openModal(type, id) {
  const overlay = document.getElementById('artifact-modal');
  const title = document.getElementById('modal-title');
  const content = document.getElementById('modal-content');
  
  overlay.classList.add('open');
  content.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-dim);">Loading...</div>';
  
  if (type === 'image') {
    title.textContent = 'Generated Image';
    content.innerHTML = `<img src="${id}" style="display:block; margin:0 auto;">`;
  } else if (type === 'journal') {
    title.textContent = id;
    try {
      const resp = await fetch(`${API_BASE}/artifact?type=journal&id=${encodeURIComponent(id)}`, { headers: headers() });

// ---------------------------------------------------------------------------
// SSE streaming chat
// ---------------------------------------------------------------------------
let isStreaming = false;

// ---------------------------------------------------------------------------
// Response poll — runs after recovery to catch late-arriving assistant messages
// ---------------------------------------------------------------------------
// Problem: recovery fires after 2.5s, but at that point only the USER's
// message is committed (the empty assistant placeholder is filtered out of
// /latest_message_id).  Recovery reloads history (user msg visible), updates
// lastRenderedMsgId, and stops.  The server keeps processing for 30+ more
// seconds.  Nothing on the client detects the assistant response.
//
// Fix: after recovery loads history, start this poll.  It fires every 3s for
// up to 2 minutes.  When /latest_message_id advances again (the assistant
// response lands), reload history to show it.
// ---------------------------------------------------------------------------
let _responsePollTimer = null;

function stopResponsePoll() {
  if (_responsePollTimer) { clearInterval(_responsePollTimer); _responsePollTimer = null; }
}

function startResponsePoll() {
  stopResponsePoll();
  let attempts = 0;
  const MAX_ATTEMPTS = 40; // 2 min at 3s intervals
  setStatus('Waiting for response…');
  _responsePollTimer = setInterval(async () => {
    attempts++;
    if (attempts >= MAX_ATTEMPTS) { stopResponsePoll(); setStatus('Ready'); return; }
    try {
      const resp = await fetch(`${API_BASE}/latest_message_id`, { headers: headers() });
      if (!resp.ok) return;
      const { id } = await resp.json();
      if (id > lastRenderedMsgId) {
        stopResponsePoll();
        console.log(`[Poll] New content #${id} — reloading history`);
        await loadHistory();
        setStatus('Ready');
      }
    } catch { /* network issue — retry next interval */ }
  }, 3000);
}

// ---------------------------------------------------------------------------
// Connection-drop recovery helper
// ---------------------------------------------------------------------------
// Called from both sendMessage() and regenerateResponse() catch blocks.
// When the SSE stream dies (phone sleep, network blip), waits briefly then
// checks /latest_message_id.  If the server has something newer, reload
// history and start the response poll to catch the still-generating response.
// Returns true if recovery succeeded (caller should skip error bubble).
async function recoverFromConnectionDrop(wrap) {
  setStatus('Reconnecting…');
  // Brief wait so the server has a chance to commit anything fast
  // (tool-free responses sometimes finish within a few seconds).
  await new Promise(r => setTimeout(r, 2500));
  try {
    const resp = await fetch(`${API_BASE}/latest_message_id`, { headers: headers() });
    if (!resp.ok) return false;
    const { id: serverLatest } = await resp.json();
    if (serverLatest > lastRenderedMsgId) {
      console.log(`[Recovery] Server has msg #${serverLatest}, UI has #${lastRenderedMsgId} — reloading`);
      if (wrap && wrap.parentNode) wrap.remove();
      setStatus('Reconnected');
      await loadHistory();
      // Server may still be generating — poll until the assistant response lands
      startResponsePoll();
      return true;
    }
  } catch { /* server unreachable — fall through to error bubble */ }
  return false;
}

function updateTelemetry(tokens) {
  const el = document.getElementById('telemetry');
  if (!el) return;
  const max = 16384; // 16k context window
  el.textContent = `Context: ${(tokens / 1000).toFixed(1)}k / 16k`;
  if (tokens > max * 0.9) el.style.color = '#e86040'; // Red
  else if (tokens > max * 0.75) el.style.color = '#e8b040'; // Amber
  else el.style.color = 'var(--text-dim)'; // Normal
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || isStreaming) return;

  isStreaming = true;
  stopResponsePoll(); // cancel any poll from a previous connection drop
  document.getElementById('send-btn').disabled = true;
  document.querySelector('.avatar').classList.add('active');
  input.value = '';
  input.style.height = 'auto';
  setStatus('Thinking…');

  const sentAt = Date.now() / 1000;
  const userMsgDiv = appendUserMessage(text, sentAt);

  // Build assistant message container with activity log
  const wrap = createAssistantMessage();
  const actLog = document.createElement('div');
  actLog.className = 'activity-log';
  wrap.appendChild(actLog);
  let actRemoved = false;

  function addActivity(icon, text, isDone = false) {
    // Mark previous step as done
    const prev = actLog.querySelector('.activity-step:last-child');
    if (prev) prev.classList.add('done');
    const step = document.createElement('div');
    step.className = 'activity-step';
    step.innerHTML = icon
      ? `<span class="step-icon">${icon}</span><span>${text}</span>`
      : `<div class="step-dot"></div><span>${text}</span>`;
    if (isDone) step.classList.add('done');
    actLog.appendChild(step);
    scrollBottom();
  }

  function removeActivity() {
    if (!actRemoved) { actLog.remove(); actRemoved = true; }
  }

  addActivity('📨', 'Message sent');
  let thinkBlock = null;
  let thinkContent = null;
  let bubble = null;
  let contentText = '';
  let cursorEl = null;
  const usedTools = [];

  try {
    const resp = await fetch(`${API_BASE}/chat`, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ message: text }),
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let evt;
        try { evt = JSON.parse(line.slice(6)); } catch { continue; }

        if (evt.type === 'status') {
          addActivity(null, evt.msg);
        }

        if (evt.type === 'thinking') {
          if (!thinkBlock) {
            addActivity('🧠', 'Model thinking…');
            thinkBlock = createThinkBlock();
            thinkContent = thinkBlock.querySelector('.think-content');
            // Always insert thinking above the bubble (even if bubble exists first)
            if (bubble) {
              wrap.insertBefore(thinkBlock, bubble);
            } else {
              wrap.appendChild(thinkBlock);
            }
          }
          thinkContent.textContent += evt.delta;
          thinkContent.scrollTop = thinkContent.scrollHeight;
          scrollBottom();
        }

        if (evt.type === 'tool') {
          const toolLabels = {
            search_vault: 'Searching vault',
            recall_specific_memory: 'Reading memory',
            read_journal_entry: 'Reading journal',
            read_recent_journal_entries: 'Reviewing recent journal',
            write_journal_entry: 'Writing journal entry',
            log_context_fact: 'Logging context fact',
            update_context_fact: 'Updating context fact',
            generate_image: 'Generating image',
            sync_context_memory: 'Syncing memory',
          };
          addActivity('⚙️', toolLabels[evt.name] || evt.name.replace(/_/g, ' '));
          setStatus((toolLabels[evt.name] || evt.name) + '…');
          usedTools.push(evt.name);
          scrollBottom();
        }

        if (evt.type === 'tool_data') {
          const idx = usedTools.indexOf(evt.name);
          if (idx !== -1) {
            usedTools[idx] = `${evt.name}[${evt.data}]`;
          }
        }

        if (evt.type === 'text') {
          if (!bubble) {
            addActivity('✍️', 'Generating response…');
            removeActivity();
            // Remove completed tool indicators (spinner done)
            wrap.querySelectorAll('.tool-indicator .spinner').forEach(s => {
              s.style.animation = 'none';
              s.style.borderColor = 'var(--tool-text)';
            });
            bubble = document.createElement('div');
            bubble.className = 'bubble';
            cursorEl = document.createElement('span');
            cursorEl.className = 'cursor';
            bubble.appendChild(cursorEl);
            wrap.appendChild(bubble);
            // Finalise think label
            if (thinkBlock) {
              thinkBlock.querySelector('.think-label').textContent = 'Thought process';
              thinkBlock.classList.remove('open'); // collapse after done streaming
            }
          }
          contentText += evt.delta;
          // Insert rendered text before cursor
          bubble.innerHTML = renderMarkdown(contentText);
          bubble.appendChild(cursorEl);
          setStatus('Streaming…');
          scrollBottom();
        }

        if (evt.type === 'metrics') {
          updateTelemetry(evt.prompt_eval_count);
        }

        if (evt.type === 'done') {
          if (cursorEl) cursorEl.remove();
          if (bubble) bubble.innerHTML = renderMarkdown(contentText);
          // Add TTS on assistant
          const actions = document.createElement('div');
          actions.className = 'msg-actions';
          const ttsBtn = document.createElement('button');
          ttsBtn.className = 'btn-tts';
          ttsBtn.textContent = '🔊';
          ttsBtn.title = 'Play TTS';
          const captured = contentText;
          ttsBtn.onclick = () => playTTS(captured, ttsBtn);
          actions.appendChild(ttsBtn);
          wrap.appendChild(actions);
          addWriteBadges(wrap, usedTools, contentText);
          // Add regen button on the user message
          addRegenToUserMsg(userMsgDiv);
          setStatus('Ready');
          scrollBottom();
        }
      }
    }
  } catch (err) {
    removeActivity();
    const recovered = await recoverFromConnectionDrop(wrap);
    if (!recovered) {
      // Server unreachable or has nothing new — show the error
      const errBubble = document.createElement('div');
      errBubble.className = 'bubble';
      errBubble.style.color = '#ff6666';
      errBubble.textContent = `Error: ${err.message}`;
      wrap.appendChild(errBubble);
      addRegenToUserMsg(userMsgDiv);
      setStatus('Error');
    }
  } finally {
    isStreaming = false;
    document.getElementById('send-btn').disabled = false;
    document.querySelector('.avatar').classList.remove('active');
    input.focus();
  }
}

// ---------------------------------------------------------------------------
// History load (paginated — last 50 messages initially)
// ---------------------------------------------------------------------------
const HISTORY_PAGE_SIZE = 50;
let oldestLoadedId = null;   // tracks cursor for "load more"
let hasMoreHistory  = false; // whether older messages exist
let lastRenderedMsgId = 0;   // tracks latest rendered msg for visibility recovery

function renderMessageToContainer(m, container) {
  if (m.role === 'user') {
    appendUserMessage(m.content, m.ts);
  } else if (m.content === '[THREAD_BREAK]') {
    const divider = document.createElement('div');
    divider.className = 'thread-divider';
    divider.textContent = 'new thread';
    container.appendChild(divider);
  } else if (m.role === 'assistant') {
    const wrap = createAssistantMessage(m.ts);
    if (m.thinking) {
      const tb = createThinkBlock();
      tb.querySelector('.think-content').textContent = m.thinking;
      tb.querySelector('.think-label').textContent = 'Thought process';
      tb.classList.remove('open');
      wrap.appendChild(tb);
    }
    const b = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = renderMarkdown(m.content);
    wrap.appendChild(b);
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    const ttsBtn = document.createElement('button');
    ttsBtn.className = 'btn-tts';
    ttsBtn.textContent = '🔊';
    const captured = m.content;
    ttsBtn.onclick = () => playTTS(captured, ttsBtn);
    actions.appendChild(ttsBtn);
    wrap.appendChild(actions);
    if (m.tools_used) {
      addWriteBadges(wrap, m.tools_used.split(','), m.content);
    }
  }
}

function insertLoadMoreButton() {
  const container = document.getElementById('messages');
  // Remove any existing load-more button
  const existing = container.querySelector('.load-more-wrap');
  if (existing) existing.remove();
  if (!hasMoreHistory) return;
  const wrapDiv = document.createElement('div');
  wrapDiv.className = 'load-more-wrap';
  const btn = document.createElement('button');
  btn.className = 'btn-load-more';
  btn.textContent = '↑ Load older messages';
  btn.onclick = loadOlderMessages;
  wrapDiv.appendChild(btn);
  container.insertBefore(wrapDiv, container.firstChild);
}

async function loadHistory() {
  try {
    const resp = await fetch(`${API_BASE}/history?limit=${HISTORY_PAGE_SIZE}`, { headers: headers() });
    if (!resp.ok) return;
    const msgs = await resp.json();
    const container = document.getElementById('messages');
    container.innerHTML = '';

    // Track pagination cursor
    if (msgs.length > 0) {
      oldestLoadedId = msgs[0].id;
      hasMoreHistory = msgs.length >= HISTORY_PAGE_SIZE;
    } else {
      oldestLoadedId = null;
      hasMoreHistory = false;
    }

    // Show "load more" button if there are likely older messages
    insertLoadMoreButton();

    for (const m of msgs) {
      renderMessageToContainer(m, container);
    }
    // Add regen button to the last user message only
    const allUser = container.querySelectorAll('.msg.user');
    if (allUser.length > 0) {
      addRegenToUserMsg(allUser[allUser.length - 1]);
    }
    scrollBottom();
    // Hydrate telemetry from the most recent assistant message
    let latestTokens = 0;
    for (let i = msgs.length - 1; i >= 0; i--) {
      if (msgs[i].prompt_eval_count) {
        latestTokens = msgs[i].prompt_eval_count;
        break;
      }
    }
    if (latestTokens > 0) updateTelemetry(latestTokens);

    // Update visibility-recovery cursor from loaded messages
    if (msgs.length > 0) {
      lastRenderedMsgId = Math.max(lastRenderedMsgId, msgs[msgs.length - 1].id);
    }
  } catch (e) {
    console.warn('Could not load history:', e);
  }
}

async function loadOlderMessages() {
  if (!oldestLoadedId || !hasMoreHistory) return;
  const btn = document.querySelector('.btn-load-more');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }

  try {
    const resp = await fetch(
      `${API_BASE}/history?limit=${HISTORY_PAGE_SIZE}&before=${oldestLoadedId}`,
      { headers: headers() }
    );
    if (!resp.ok) return;
    const msgs = await resp.json();
    if (msgs.length === 0) {
      hasMoreHistory = false;
      const wrap = document.querySelector('.load-more-wrap');
      if (wrap) wrap.remove();
      return;
    }

    // Update cursor
    oldestLoadedId = msgs[0].id;
    hasMoreHistory = msgs.length >= HISTORY_PAGE_SIZE;

    const container = document.getElementById('messages');
    // Remember scroll position so we can restore it after prepending
    const prevScrollHeight = container.scrollHeight;

    // Remove existing load-more button before prepending
    const existingBtn = container.querySelector('.load-more-wrap');
    if (existingBtn) existingBtn.remove();

    // Build a document fragment with the older messages
    // We need to temporarily append to container to reuse render helpers,
    // then move those nodes to the top.
    const marker = document.createElement('div');
    marker.id = '_load-more-marker';
    container.appendChild(marker);

    for (const m of msgs) {
      renderMessageToContainer(m, container);
    }

    // Collect all nodes that were appended after the marker
    const newNodes = [];
    let node = marker.nextSibling;
    while (node) {
      newNodes.push(node);
      node = node.nextSibling;
    }
    marker.remove();

    // Find the first real message (skip old load-more button position)
    const firstChild = container.firstChild;
    for (const n of newNodes) {
      container.insertBefore(n, firstChild);
    }

    // Re-insert load-more button at top if more history exists
    insertLoadMoreButton();

    // Restore scroll position so the user stays where they were
    container.scrollTop = container.scrollHeight - prevScrollHeight;

  } catch (e) {
    console.warn('Could not load older messages:', e);
  }
}

  actions.appendChild(regenBtn);
}

async function regenerateResponse(userMsgDiv) {
  if (isStreaming) return;
  // Remove the assistant message(s) following this user message
  let next = userMsgDiv.nextElementSibling;
  while (next && next.classList.contains('msg') && next.classList.contains('assistant')) {
    const toRemove = next;
    next = next.nextElementSibling;
    toRemove.remove();
  }
  // Remove the regen button from this user message
  const oldBtn = userMsgDiv.querySelector('.btn-regen');
  if (oldBtn) oldBtn.remove();

  isStreaming = true;
  document.getElementById('send-btn').disabled = true;
  document.querySelector('.avatar').classList.add('active');
  setStatus('Regenerating…');

  const wrap = createAssistantMessage();
  const actLog = document.createElement('div');
  actLog.className = 'activity-log';
  wrap.appendChild(actLog);
  let actRemoved = false;

  function addActivity(icon, text, isDone = false) {
    const prev = actLog.querySelector('.activity-step:last-child');
    if (prev) prev.classList.add('done');
    const step = document.createElement('div');
    step.className = 'activity-step';
    step.innerHTML = icon
      ? `<span class="step-icon">${icon}</span><span>${text}</span>`
      : `<div class="step-dot"></div><span>${text}</span>`;
    if (isDone) step.classList.add('done');
    actLog.appendChild(step);
    scrollBottom();
  }

  function removeActivity() {
    if (!actRemoved) { actLog.remove(); actRemoved = true; }
  }

  addActivity('🔄', 'Regenerating response…');
  let thinkBlock = null;
  let thinkContent = null;
  let bubble = null;
  let contentText = '';
  let cursorEl = null;
  const usedTools = [];

  try {
    const resp = await fetch(`${API_BASE}/regenerate`, {
      method: 'POST',
      headers: headers(),
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let evt;
        try { evt = JSON.parse(line.slice(6)); } catch { continue; }

        if (evt.type === 'status') addActivity(null, evt.msg);

        if (evt.type === 'thinking') {
          if (!thinkBlock) {
            addActivity('🧠', 'Model thinking…');
            thinkBlock = createThinkBlock();
            thinkContent = thinkBlock.querySelector('.think-content');
            if (bubble) wrap.insertBefore(thinkBlock, bubble);
            else wrap.appendChild(thinkBlock);
          }
          thinkContent.textContent += evt.delta;
          thinkContent.scrollTop = thinkContent.scrollHeight;
          scrollBottom();
        }

        if (evt.type === 'tool') {
          const toolLabels = {
            search_vault: 'Searching vault', recall_specific_memory: 'Reading memory',
            read_journal_entry: 'Reading journal', read_recent_journal_entries: 'Reviewing recent journal',
            write_journal_entry: 'Writing journal entry', log_context_fact: 'Logging context fact',
            update_context_fact: 'Updating context fact', generate_image: 'Generating image',
            sync_context_memory: 'Syncing memory',
          };
          addActivity('⚙️', toolLabels[evt.name] || evt.name.replace(/_/g, ' '));
          setStatus((toolLabels[evt.name] || evt.name) + '…');
          usedTools.push(evt.name);
        }

        if (evt.type === 'text') {
          if (!bubble) {
            addActivity('✍️', 'Generating response…');
            removeActivity();
            bubble = document.createElement('div');
            bubble.className = 'bubble';
            cursorEl = document.createElement('span');
            cursorEl.className = 'cursor';
            bubble.appendChild(cursorEl);
            wrap.appendChild(bubble);
            if (thinkBlock) {
              thinkBlock.querySelector('.think-label').textContent = 'Thought process';
              thinkBlock.classList.remove('open');
            }
          }
          contentText += evt.delta;
          bubble.innerHTML = renderMarkdown(contentText);
          bubble.appendChild(cursorEl);
          setStatus('Streaming…');
          scrollBottom();
        }

        if (evt.type === 'done') {
          if (cursorEl) cursorEl.remove();
          if (bubble) bubble.innerHTML = renderMarkdown(contentText);
          const actions = document.createElement('div');

          const ttsBtn = document.createElement('button');
          ttsBtn.className = 'btn-tts';
          ttsBtn.textContent = '🔊';

          addWriteBadges(wrap, usedTools);
          // Add regen to user message
          addRegenToUserMsg(userMsgDiv);
          setStatus('Ready');
          scrollBottom();
        }
      }
    }
  } catch (err) {
    removeActivity();
    const recovered = await recoverFromConnectionDrop(wrap);
    if (!recovered) {
      const errBubble = document.createElement('div');
      errBubble.className = 'bubble';
      errBubble.style.color = '#ff6666';
      errBubble.textContent = `Error: ${err.message}`;
      wrap.appendChild(errBubble);
      addRegenToUserMsg(userMsgDiv);
      setStatus('Error');
    }
  } finally {
    isStreaming = false;
    document.getElementById('send-btn').disabled = false;
    document.querySelector('.avatar').classList.remove('active');
  }
}

function addSystemNotice(icon, text, cssClass = '') {
  const notice = document.createElement('div');
  notice.className = 'system-notice' + (cssClass ? ' ' + cssClass : '');
  notice.innerHTML = `<span>${icon}</span><span>${text}</span>`;
  document.getElementById('messages').appendChild(notice);
  scrollBottom();
  return notice;
}

async function pollTaskStatus(taskName, intervalMs, btn, defaultLabel, notice) {
  return new Promise((resolve) => {
    let networkErrors = 0;
    const MAX_NETWORK_ERRORS = 3;

    function resetBtn() {
      btn.disabled = false;
      btn.textContent = defaultLabel;
      btn.style.borderColor = '';
      btn.style.color = '';
    }

    const poll = setInterval(async () => {
      try {
        const resp = await fetch(`${API_BASE}/task_status/${taskName}`, { headers: headers() });
        const data = await resp.json();
        networkErrors = 0; // Reset on successful response

        if (data.status === 'done') {
          clearInterval(poll);
          notice.className = 'system-notice done';
          notice.innerHTML = `<span>✅</span><span>${defaultLabel} completed.</span>`;
          btn.textContent = `✓ ${defaultLabel} done`;
          btn.style.borderColor = 'var(--tool-text)';
          btn.style.color = 'var(--tool-text)';
          setTimeout(resetBtn, 4000);
          resolve('done');
        } else if (data.status === 'error') {
          clearInterval(poll);
          notice.className = 'system-notice error';
          notice.innerHTML = `<span>❌</span><span>${defaultLabel} failed: ${data.error || 'unknown error'}</span>`;
          btn.textContent = `✗ ${defaultLabel} failed`;
          btn.style.borderColor = '#ff6666';
          btn.style.color = '#ff6666';
          setTimeout(resetBtn, 4000);
          resolve('error');
        } else if (data.status === 'unknown') {
          // Server restarted — task state was lost (in-memory dict cleared)
          clearInterval(poll);
          notice.className = 'system-notice error';
          notice.innerHTML = `<span>⚠️</span><span>${defaultLabel} — server restarted, task state lost. Check console for result.</span>`;
          setTimeout(resetBtn, 4000);
          resolve('unknown');
        }
        // status === 'running' — keep polling
      } catch {
        // Network error — give it a few tries before giving up
        networkErrors++;
        if (networkErrors >= MAX_NETWORK_ERRORS) {
          clearInterval(poll);
          notice.className = 'system-notice error';
          notice.innerHTML = `<span>⚠️</span><span>${defaultLabel} — lost connection to server. Check if it's still running.</span>`;
          setTimeout(resetBtn, 4000);
          resolve('disconnected');
        }
      }
    }, intervalMs);
  });
}

async function refreshMemory() {
  const btn = document.getElementById('refresh-memory-btn');
  if (btn.disabled) return;

  const defaultLabel = '✦ Refresh Memory';
  btn.disabled = true;
  btn.textContent = '✦ Refreshing…';
  btn.style.borderColor = 'var(--accent)';
  btn.style.color = 'var(--accent)';

  const notice = addSystemNotice('✦', 'Memory refresh initiated…');

  try {
    const resp = await fetch(`${API_BASE}/refresh_memory`, { method: 'POST', headers: headers() });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    // Poll every 10s — each phase can take several minutes
    let networkErrors = 0;
    const MAX_NETWORK_ERRORS = 3;

    function resetBtn() {
      btn.disabled = false;
      btn.textContent = defaultLabel;
      btn.style.borderColor = '';
      btn.style.color = '';
    }

    const poll = setInterval(async () => {
      try {
        const r = await fetch(`${API_BASE}/task_status/refresh_memory`, { headers: headers() });
        const data = await r.json();
        networkErrors = 0;

        if (data.status === 'running') {
          notice.innerHTML = `<span>⏳</span><span>Memory Refresh: <strong>${data.phase || '…'}</strong></span>`;
        } else if (data.status === 'done') {
          clearInterval(poll);
          notice.className = 'system-notice done';
          notice.innerHTML = `<span>✅</span><span>Memory refreshed successfully!</span>`;
          btn.textContent = '✓ Refreshed';
          btn.style.borderColor = 'var(--tool-text)';
          btn.style.color = 'var(--tool-text)';
          setTimeout(resetBtn, 4000);
        } else if (data.status === 'error') {
          clearInterval(poll);
          notice.className = 'system-notice error';
          notice.innerHTML = `<span>❌</span><span>Refresh failed: ${data.error || 'unknown error'}</span>`;
          btn.textContent = '✗ Refresh failed';
          btn.style.borderColor = '#ff6666';
          btn.style.color = '#ff6666';
          setTimeout(resetBtn, 4000);
        } else if (data.status === 'unknown') {
          clearInterval(poll);
          notice.className = 'system-notice error';
          notice.innerHTML = `<span>⚠️</span><span>Task state lost — server may have restarted.</span>`;
          setTimeout(resetBtn, 4000);
        }
      } catch {
        networkErrors++;
        if (networkErrors >= MAX_NETWORK_ERRORS) {
          clearInterval(poll);
          notice.className = 'system-notice error';
          notice.innerHTML = `<span>⚠️</span><span>Lost connection to server.</span>`;
          setTimeout(resetBtn, 4000);
        }
      }
    }, 10000);

  } catch (e) {
    notice.className = 'system-notice error';
    notice.innerHTML = `<span>❌</span><span>Failed to start refresh: ${e.message}</span>`;
    btn.textContent = '✗ Refresh failed';
    btn.style.borderColor = '#ff6666';
    btn.style.color = '#ff6666';
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = defaultLabel;
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 4000);
  }
}

async function newThread() {
  const btn = document.getElementById('new-thread-btn');
  if (btn.disabled || isStreaming) return;
  btn.disabled = true;
  btn.textContent = '✦ Starting…';
  btn.style.borderColor = 'var(--accent)';
  btn.style.color = 'var(--accent)';
  try {
    const resp = await fetch(`${API_BASE}/new_thread`, { method: 'POST', headers: headers() });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    // Insert a visual divider in the current chat
    const divider = document.createElement('div');
    divider.className = 'thread-divider';
    divider.textContent = 'new thread';
    document.getElementById('messages').appendChild(divider);
    scrollBottom();
    btn.textContent = '✓ Thread started';
    btn.style.borderColor = 'var(--tool-text)';
    btn.style.color = 'var(--tool-text)';
  } catch (e) {
    btn.textContent = '✗ Failed';
    btn.style.borderColor = '#ff6666';
    btn.style.color = '#ff6666';
  } finally {
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = '✦ New Thread';
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 3000);
  }
}

document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 150) + 'px';
});
document.getElementById('send-btn').addEventListener('click', sendMessage);



// ---------------------------------------------------------------------------
// Visibility recovery — pull-based: ask the server if we missed anything
// ---------------------------------------------------------------------------
// Instead of trying to infer stream health from event timestamps (which
// breaks whenever new SSE event types are added), we track the last message
// ID the UI has rendered and compare it to the server's latest committed
// message on tab-focus.  Immune to heartbeat/status event changes.
// ---------------------------------------------------------------------------
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;

  // Small debounce — skip Alt+Tab flicker (< 2s away)
  // Not needed for correctness, just avoids a pointless fetch.

  try {
    const resp = await fetch(`${API_BASE}/latest_message_id`, { headers: headers() });
    if (!resp.ok) return;
    const data = await resp.json();
    const serverLatest = data.id || 0;

    if (serverLatest > lastRenderedMsgId) {
      console.log(`[Recovery] Server has msg #${serverLatest}, UI has #${lastRenderedMsgId} — reloading`);
      // Reset streaming state if we were mid-stream
      if (isStreaming) {
        isStreaming = false;
        document.getElementById('send-btn').disabled = false;
        document.querySelector('.avatar').classList.remove('active');
      }
      setStatus('Reconnected');
      await loadHistory();
      setStatus('Ready');
    }
  } catch {
    // Offline or server down — nothing to do, next focus will retry
  }
});

// API key prompt if not set
if (!API_KEY && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
  const key = prompt('Enter your Evelyn API key (X-Evelyn-Key):');
  if (key) { localStorage.setItem('evelyn_api_key', key); location.reload(); }
}

// Init
loadHistory();

async function updateDevUIBadge() {
  try {
    const [resResearch, resExt, resProp] = await Promise.all([
      fetch(`${API_BASE}/research/list`, { headers: headers() }),
      fetch(`${API_BASE}/api/review/extractions`, { headers: headers() }),
      fetch(`${API_BASE}/api/review/proposals`, { headers: headers() })
    ]);
    
    let activeResearch = false;
    let pendingReviews = false;
    
    if (resResearch.ok) {
      const tasks = await resResearch.json();
      activeResearch = tasks.some(t => t.status === 'running' || ['plan', 'search', 'extract', 'evaluate', 'synthesize'].includes(t.status));
    }
    
    if (resExt.ok && resProp.ok) {
      const extractions = await resExt.json();
      const proposals = await resProp.json();
      pendingReviews = (extractions.length > 0 || proposals.length > 0);
    }
    
    const pulse = document.getElementById('research-pulse');
    if (pulse) {
      if (activeResearch) {
        pulse.style.display = 'inline-block';
        pulse.style.background = 'var(--accent)';
        pulse.style.boxShadow = '0 0 6px var(--accent)';
        pulse.style.animation = 'pulse-research 1.5s infinite';
      } else if (pendingReviews) {
        pulse.style.display = 'inline-block';
        pulse.style.background = '#fbbf24';
        pulse.style.boxShadow = 'none';
        pulse.style.animation = 'none';
      } else {
        pulse.style.display = 'none';
      }
    }
  } catch (e) {
    // Ignore network issues
  }
}
updateDevUIBadge();
setInterval(updateDevUIBadge, 15000);
