<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evelyn</title>
    <link rel="icon" type="image/x-icon" href="/ui/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <script src="/ui/vendor/marked.min.js"></script>
    <script src="/ui/vendor/purify.min.js"></script>
    <style>
      :root {
        --bg: #0d0d12;
        --surface: #13131c;
        --surface2: #1a1a28;
        --border: #2a2a40;
        --accent: #7c6af7;
        --accent-dim: #4a3fb0;
        --text: #e8e8f0;
        --text-dim: #8888aa;
        --think-bg: #0f1520;
        --think-border: #2a3a55;
        --think-text: #6699cc;
        --tool-bg: #0f1a10;
        --tool-border: #2a4030;
        --tool-text: #66bb77;
        --user-bg: #1e1e30;
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        font-size: 15px;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      /* Header */
      header {
        padding: 14px 20px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), #b06af7);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      header h1 {
        font-size: 16px;
        font-weight: 500;
      }
      header span {
        font-size: 12px;
        color: var(--text-dim);
      }
      .header-actions {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }
      .btn-ghost {
        background: none;
        border: 1px solid var(--border);
        color: var(--text-dim);
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.15s;
      }
      .btn-ghost:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn-ghost.danger:hover {
        border-color: #e86040;
        color: #e86040;
      }
      .btn-ghost.active {
        border-color: var(--accent);
        color: var(--accent);
        background: rgba(139, 92, 246, 0.1);
      }

      /* Thread divider */
      .thread-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 0;
        color: var(--text-dim);
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .thread-divider::before,
      .thread-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--border), transparent);
      }

      /* System notices (background task status) */
      .system-notice {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        color: var(--text-dim);
        font-size: 12px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 8px;
        border-left: 3px solid var(--accent);
        transition: opacity 0.3s;
      }
      .system-notice.done {
        border-left-color: var(--tool-text);
      }
      .system-notice.error {
        border-left-color: #ff6666;
      }

      /* Messages */
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        scroll-behavior: smooth;
        max-width: 800px;
        margin: 0 auto;
        width: 100%;
      }
      #messages::-webkit-scrollbar {
        width: 4px;
      }
      #messages::-webkit-scrollbar-track {
        background: transparent;
      }
      #messages::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
      }

      .msg {
        display: flex;
        flex-direction: column;
        max-width: min(85%, 72ch);
        width: fit-content;
        min-width: 0;
        gap: 2px;
      }
      .msg.user {
        align-self: flex-end;
        align-items: flex-end;
      }
      .msg.assistant {
        align-self: flex-start;
        align-items: flex-start;
      }
      .msg.system {
        align-self: center;
        align-items: center;
        max-width: 90%;
        margin: 6px 0;
      }

      /* Sender + timestamp label */
      .msg-meta {
        font-size: 11px;
        color: var(--text-dim);
        padding: 0 4px;
        letter-spacing: 0.02em;
      }
      .msg.user .msg-meta {
        text-align: right;
      }
      .msg.assistant .msg-meta {
        text-align: left;
      }
      .msg.system .msg-meta {
        text-align: center;
        color: var(--accent);
        font-weight: 500;
      }

      .date-divider,
      .thread-divider {
        align-self: center;
        text-align: center;
        width: 100%;
        margin: 14px 0 8px 0;
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--text-dim);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        user-select: none;
      }
      .date-divider::before,
      .date-divider::after,
      .thread-divider::before,
      .thread-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .bubble {
        padding: 12px 16px;
        border-radius: var(--radius);
        line-height: 1.6;
        white-space: normal;
        word-break: break-word;
        overflow-wrap: break-word;
        max-width: 100%;
        min-width: 0;
      }
      .msg.user .bubble {
        background: var(--user-bg);
        border: 1px solid var(--border);
      }
      .msg.assistant .bubble {
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .msg.system .bubble {
        background: var(--surface);
        border: 1px dashed var(--border);
        color: var(--text-dim);
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        padding: 8px 12px;
        border-radius: 6px;
        width: 100%;
      }

      /* Thinking block */
      .think-block {
        border: 1px solid var(--think-border);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 8px;
        background: var(--think-bg);
        max-width: min(100%, 680px);
        min-width: 0;
      }
      .think-header {
        padding: 6px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
        border-bottom: 1px solid var(--think-border);
      }
      .think-header:hover {
        background: rgba(255, 255, 255, 0.03);
      }
      .think-icon {
        font-size: 14px;
      }
      .think-label {
        font-size: 12px;
        color: var(--think-text);
        font-weight: 500;
      }
      .think-chevron {
        margin-left: auto;
        font-size: 11px;
        color: var(--text-dim);
        transition: transform 0.2s;
      }
      .think-block.open .think-chevron {
        transform: rotate(180deg);
      }
      .think-content {
        padding: 10px 14px;
        font-size: 13px;
        color: var(--think-text);
        font-family: "JetBrains Mono", monospace;
        line-height: 1.5;
        display: none;
        max-height: 300px;
        overflow-y: auto;
        overflow-x: auto;
        white-space: pre-wrap;
        max-width: 100%;
        min-width: 0;
      }
      .think-block.open .think-content {
        display: block;
      }

      /* Tool activity */
      .tool-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        background: var(--tool-bg);
        border: 1px solid var(--tool-border);
        border-radius: 6px;
        font-size: 12px;
        color: var(--tool-text);
        margin-bottom: 6px;
        width: fit-content;
      }
      .tool-indicator .spinner {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 2px solid var(--tool-border);
        border-top-color: var(--tool-text);
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Typing cursor */
      .cursor {
        display: inline-block;
        width: 2px;
        height: 1em;
        background: var(--accent);
        animation: blink 0.8s step-end infinite;
        vertical-align: text-bottom;
        margin-left: 2px;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* Activity log (replaces typing indicator) */
      .activity-log {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 10px 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        width: fit-content;
        min-width: 200px;
      }
      .activity-step {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text-dim);
        animation: step-in 0.2s ease-out;
      }
      @keyframes step-in {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .activity-step .step-icon {
        font-size: 13px;
        flex-shrink: 0;
      }
      .activity-step .step-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        border: 1.5px solid var(--text-dim);
        border-top-color: var(--accent);
        flex-shrink: 0;
        animation: spin 0.8s linear infinite;
      }
      .activity-step.done .step-dot {
        animation: none;
        background: var(--tool-text);
        border-color: var(--tool-text);
      }

      /* Avatar pulse during generation */
      .avatar.active {
        animation: avatar-pulse 1.5s ease-in-out infinite;
      }
      @keyframes avatar-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 3px rgba(124, 106, 247, 0.15);
        }
        50% {
          box-shadow: 0 0 0 6px rgba(124, 106, 247, 0.35);
        }
      }

      .msg-actions {
        display: flex;
        gap: 6px;
        padding: 0 4px;
      }
      .btn-tts {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-dim);
        font-size: 16px;
        padding: 2px 4px;
        border-radius: 4px;
        transition: color 0.15s;
      }
      .btn-tts:hover {
        color: var(--accent);
      }
      .btn-regen,
      .btn-edit {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-dim);
        font-size: 14px;
        padding: 2px 4px;
        border-radius: 4px;
        transition: color 0.15s;
      }
      .btn-regen:hover,
      .btn-edit:hover {
        color: var(--accent);
      }

      /* In-place message edit box */
      .msg.user.editing {
        width: 100%;
        max-width: 100%;
        align-items: stretch;
      }
      .msg-edit-box {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 4px;
        width: 100%;
      }
      .msg-edit-textarea {
        width: 100%;
        min-height: 90px;
        max-height: 400px;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--accent);
        border-radius: var(--radius);
        padding: 12px 16px;
        font-family: inherit;
        font-size: 14px;
        line-height: 1.6;
        resize: vertical;
        box-sizing: border-box;
        outline: none;
        box-shadow: 0 0 12px rgba(187, 134, 252, 0.15);
      }
      .msg-edit-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .btn-edit-save {
        background: var(--accent);
        color: var(--bg-dark);
        border: none;
        border-radius: 6px;
        padding: 4px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .btn-edit-save:hover {
        opacity: 0.9;
      }
      .btn-edit-cancel {
        background: transparent;
        color: var(--text-dim);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 12px;
        font-size: 13px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      .btn-edit-cancel:hover {
        color: var(--text);
        border-color: var(--text-dim);
      }

      /* Write-tool badges */
      .write-badges {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        padding: 0 2px;
        margin-top: 2px;
      }
      .write-badge {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--tool-text);
        background: var(--tool-bg);
        border: 1px solid var(--tool-border);
        border-radius: 4px;
        padding: 2px 8px;
      }
      .write-badge.success {
        color: var(--tool-text);
        background: var(--tool-bg);
        border-color: var(--tool-border);
      }
      .write-badge.danger {
        color: #fca5a5;
        background: rgba(248, 113, 113, 0.1);
        border-color: rgba(248, 113, 113, 0.25);
      }
      .write-badge.warning {
        color: #fde047;
        background: rgba(253, 224, 71, 0.1);
        border-color: rgba(253, 224, 71, 0.25);
      }

      /* Markdown: inline code & formatting */
      .bubble code {
        background: var(--surface2);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
      }
      .bubble strong, .modal-content strong {
        font-weight: 600;
      }
      .bubble em, .modal-content em {
        font-style: italic;
      }
      .bubble h1, .modal-content h1 {
        font-size: 1.35em;
        font-weight: 600;
        margin: 0.9em 0 0.4em;
        line-height: 1.3;
        color: #fff;
      }
      .bubble h2, .modal-content h2 {
        font-size: 1.2em;
        font-weight: 600;
        margin: 0.8em 0 0.35em;
        line-height: 1.3;
        color: #fff;
      }
      .bubble h3, .modal-content h3 {
        font-size: 1.08em;
        font-weight: 600;
        margin: 0.7em 0 0.3em;
        line-height: 1.3;
        color: var(--text);
      }
      .bubble h4, .modal-content h4 {
        font-size: 1.0em;
        font-weight: 600;
        margin: 0.6em 0 0.25em;
        line-height: 1.3;
        color: var(--text);
      }
      .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child,
      .modal-content h1:first-child, .modal-content h2:first-child, .modal-content h3:first-child {
        margin-top: 0;
      }
      .bubble p, .modal-content p {
        margin: 0.45em 0;
        line-height: 1.55;
      }
      .bubble p:first-child, .modal-content p:first-child {
        margin-top: 0;
      }
      .bubble p:last-child, .modal-content p:last-child {
        margin-bottom: 0;
      }

      /* Lists & Task Checkboxes */
      .bubble ul, .bubble ol,
      .modal-content ul, .modal-content ol {
        margin: 0.5em 0;
        padding-left: 1.4em;
      }
      .bubble li, .modal-content li {
        margin: 0.25em 0;
        line-height: 1.5;
      }
      .bubble ul.contains-task-list, .modal-content ul.contains-task-list,
      .bubble ul.task-list, .modal-content ul.task-list {
        list-style: none;
        padding-left: 0.2em;
      }
      .bubble li.task-list-item, .modal-content li.task-list-item {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      .bubble li input[type="checkbox"],
      .modal-content li input[type="checkbox"] {
        margin-right: 6px;
        vertical-align: middle;
        accent-color: var(--accent);
        cursor: pointer;
      }

      /* Blockquotes & Dividers */
      .bubble blockquote,
      .modal-content blockquote {
        border-left: 3px solid var(--accent);
        margin: 0.6em 0;
        padding: 4px 12px;
        background: rgba(124, 106, 247, 0.05);
        border-radius: 0 4px 4px 0;
        color: var(--text-dim);
        font-style: italic;
      }
      .bubble hr,
      .modal-content hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 1em 0;
      }

      /* YAML Frontmatter / Metadata Card */
      .frontmatter-card {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        border-radius: 6px;
        padding: 8px 12px;
        margin: 0.4em 0 0.8em;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .frontmatter-header {
        font-weight: 600;
        color: var(--accent);
        display: flex;
        align-items: center;
        gap: 6px;
        text-transform: uppercase;
        font-size: 10px;
        letter-spacing: 0.5px;
      }
      .frontmatter-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        margin-top: 4px;
      }
      .frontmatter-item {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
      }
      .frontmatter-key {
        color: var(--text-dim);
        font-weight: 500;
      }
      .frontmatter-val {
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        background: rgba(0, 0, 0, 0.25);
        padding: 1px 5px;
        border-radius: 3px;
      }

      /* Fenced code blocks */
      .code-block {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 6px;
        margin: 0.6em 0;
        overflow: hidden;
        display: block;
        max-width: 100%;
        min-width: 0;
      }
      .code-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 12px;
        background: rgba(0, 0, 0, 0.25);
        border-bottom: 1px solid var(--border);
        min-height: 26px;
      }
      .code-lang {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--text-dim);
        text-transform: lowercase;
      }
      .copy-btn {
        background: none;
        border: 1px solid var(--border);
        border-radius: 3px;
        color: var(--text-dim);
        font-size: 11px;
        padding: 1px 7px;
        cursor: pointer;
        transition:
          color 0.15s,
          border-color 0.15s;
        font-family: inherit;
      }
      .copy-btn:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      .code-block pre {
        margin: 0;
        padding: 12px 14px;
        overflow-x: auto;
        white-space: pre;
        max-width: 100%;
        min-width: 0;
      }
      .code-block pre code {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        line-height: 1.55;
        background: none;
        padding: 0;
        border-radius: 0;
        max-width: 100%;
      }

      /* Markdown & HTML tables */
      .bubble table,
      .modal-content table {
        display: block;
        max-width: 100%;
        overflow-x: auto;
        border-collapse: collapse;
        margin: 0.8em 0;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .bubble th,
      .bubble td,
      .modal-content th,
      .modal-content td {
        border: 1px solid var(--border);
        padding: 6px 12px;
        text-align: left;
        font-size: 13px;
        line-height: 1.4;
      }
      .bubble th,
      .modal-content th {
        background: var(--surface2);
        color: #fff;
        font-weight: 600;
      }
      .bubble tr:nth-child(even) td,
      .modal-content tr:nth-child(even) td {
        background: rgba(255, 255, 255, 0.02);
      }

      /* CSS-only syntax highlighting */
      .sh-keyword {
        color: #c792ea;
      }
      .sh-string {
        color: #a5d6a7;
      }
      .sh-comment {
        color: var(--text-dim);
        font-style: italic;
      }
      .sh-number {
        color: #f78c6c;
      }

      /* Input area */
      footer {
        padding: 12px 16px;
        background: var(--surface);
        border-top: 1px solid var(--border);
      }
      .input-row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 12px;
        transition: border-color 0.15s;
        max-width: 760px;
        margin: 0 auto;
      }
      .input-row:focus-within {
        border-color: var(--accent);
      }
      #input {
        flex: 1;
        background: none;
        border: none;
        color: var(--text);
        font-family: "Inter", sans-serif;
        font-size: 15px;
        resize: none;
        outline: none;
        max-height: 150px;
        line-height: 1.5;
        min-height: 24px;
      }
      #input::placeholder {
        color: var(--text-dim);
      }
      #send-btn {
        background: var(--accent);
        border: none;
        color: #fff;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
        flex-shrink: 0;
      }
      #send-btn:hover {
        background: var(--accent-dim);
      }
      #send-btn:disabled {
        background: var(--border);
        cursor: not-allowed;
      }
      .input-hint {
        font-size: 11px;
        color: var(--text-dim);
        margin-top: 6px;
        padding-left: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 760px;
        margin: 6px auto 0 auto;
      }

      /* Effort chips — replace hint text left side */
      #effort-chips {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .effort-chip {
        background: none;
        border: 1px solid var(--border);
        color: var(--text-dim);
        font-family: "Inter", sans-serif;
        font-size: 11px;
        padding: 2px 9px;
        border-radius: 20px;
        cursor: pointer;
        transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
        line-height: 1.6;
        letter-spacing: 0.01em;
      }
      .effort-chip:hover {
        color: var(--text);
        border-color: var(--text-dim);
      }
      .effort-chip.active {
        color: var(--accent);
        border-color: var(--accent);
        box-shadow: 0 0 6px color-mix(in srgb, var(--accent) 35%, transparent);
      }

      /* Load-more button */
      .load-more-wrap {
        display: flex;
        justify-content: center;
        padding: 12px 0;
      }
      .btn-load-more {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text-dim);
        font-family: "Inter", sans-serif;
        font-size: 13px;
        padding: 8px 20px;
        border-radius: 8px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s,
          background 0.15s;
      }
      .btn-load-more:hover {
        border-color: var(--accent);
        color: var(--text);
        background: var(--surface);
      }
      .btn-load-more:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      /* Modal / Lightbox */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(5px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      .modal-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }
      .modal-container {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        width: 90%;
        max-width: 800px;
        max-height: 85vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        transform: translateY(20px);
        transition: transform 0.2s ease;
      }
      .modal-overlay.open .modal-container {
        transform: translateY(0);
      }
      .modal-header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .modal-title {
        font-weight: 500;
        font-size: 15px;
      }
      .modal-close {
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 20px;
        cursor: pointer;
        transition: color 0.15s;
      }
      .modal-close:hover {
        color: #fff;
      }
      .modal-content {
        padding: 20px;
        overflow-y: auto;
        flex: 1;
        font-size: 14px;
        line-height: 1.6;
      }
      .modal-content img {
        max-width: 100%;
        border-radius: 8px;
      }
      .modal-content h1,
      .modal-content h2,
      .modal-content h3 {
        margin-top: 1em;
        margin-bottom: 0.5em;
        color: #fff;
        max-width: 72ch;
      }
      .modal-content p {
        margin-bottom: 1em;
        max-width: 72ch;
      }
      .modal-content li {
        max-width: 72ch;
      }
      @keyframes pulse-research {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.3);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="avatar">🌙</div>
      <div>
        <h1>Evelyn</h1>
        <span id="status-text">Ready</span>
      </div>
      <div class="header-actions">
        <button
          class="btn-ghost"
          id="auto-speech-btn"
          title="Toggle auto-speech on received messages"
          onclick="toggleAutoSpeech()"
        >
          🔇 Auto-Speech
        </button>
      </div>
    </header>

    <div id="messages"></div>

    <footer>
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="Message Evelyn…" autofocus></textarea>
        <button id="send-btn" title="Send">↑</button>
      </div>
      <div class="input-hint">
        <div id="effort-chips">
          <button class="effort-chip active" data-effort="null" id="chip-auto" title="Evelyn decides thinking depth automatically">Auto</button>
          <button class="effort-chip" data-effort="low" id="chip-low" title="Brief thinking — fast replies">Low</button>
          <button class="effort-chip" data-effort="medium" id="chip-mid" title="Standard reasoning">Mid</button>
          <button class="effort-chip" data-effort="high" id="chip-high" title="Deep reflection">High</button>
        </div>
        <span style="display: flex; gap: 12px; align-items: center">
          <a
            href="/ui/dev.html"
            id="dev-ui-link"
            title="Review Queue"
            style="
              text-decoration: none;
              color: var(--text-dim);
              font-size: 11px;
              transition: color 0.2s;
              display: inline-flex;
              align-items: center;
              gap: 4px;
            "
            onmouseover="this.style.color = 'var(--text)'"
            onmouseout="this.style.color = 'var(--text-dim)'"
          >
            <span
              id="research-pulse"
              style="
                display: none;
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--accent);
                box-shadow: 0 0 6px var(--accent);
                animation: pulse-research 1.5s infinite;
              "
            ></span>
            <span>⚙️ Dev UI</span>
          </a>
        </span>
      </div>
    </footer>

    <div class="modal-overlay" id="artifact-modal" onclick="closeModal(event)">
      <div class="modal-container" onclick="event.stopPropagation()">
        <div class="modal-header">
          <div class="modal-title" id="modal-title">Artifact</div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-content" id="modal-content"></div>
      </div>
    </div>

    <script>
      // ---------------------------------------------------------------------------
      // ARCHITECTURE NOTE: Mobile Backgrounding & State Hydration
      // ---------------------------------------------------------------------------
      // Mobile browsers (iOS Safari, Chrome) will pause JS and kill active SSE/fetch
      // streams when this tab is backgrounded or the screen turns off.
      // When the tab is resumed, recoverFromConnectionDrop() detects the dead
      // stream and forces a full DOM rebuild via loadHistory().
      //
      // RULE: Any UI state driven by SSE events MUST have a fallback hydration path.
      // If you add a new streaming event (e.g. metrics, tool states, indicators),
      // you must also ensure the backend /history endpoint serves that data, and
      // that loadHistory() can parse it to reconstruct the exact UI state on reload.
      // ---------------------------------------------------------------------------

      // ---------------------------------------------------------------------------
      // Config
      // ---------------------------------------------------------------------------
      const API_BASE = window.location.origin;
      const API_KEY = localStorage.getItem("evelyn_api_key") || "";

      function headers(extra = {}) {
        return { "Content-Type": "application/json", "X-Evelyn-Key": API_KEY, ...extra };
      }

      // ---------------------------------------------------------------------------
      // Utility
      // ---------------------------------------------------------------------------
      function escapeHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function isTouchDevice() {
        return window.matchMedia("(pointer: coarse)").matches;
      }

      // applyHighlighting — CSS-only token coloring on already-HTML-escaped code.
      // Runs on complete code blocks only (never on partial streaming text).
      // Order: strings → comments → keywords → numbers to minimise collision risk.
      function applyHighlighting(code) {
        // Strings: single- and double-quoted, non-greedy, no crossing newlines.
        code = code.replace(/"([^"\n]*)"/g, '<span class="sh-string">"$1"</span>');
        code = code.replace(/'([^'\n]*)'/g, "<span class=\"sh-string\">'$1'</span>");
        // Line comments: // style and # style.
        code = code.replace(/(\/\/[^\n]*)/g, '<span class="sh-comment">$1</span>');
        code = code.replace(/(#[^\n]*)/g, '<span class="sh-comment">$1</span>');
        // Keywords (Python, JS, TS, shell-ish).
        const KW =
          "if|else|elif|for|while|return|def|function|class|const|let|var" +
          "|import|from|as|in|not|and|or|True|False|None|null|undefined" +
          "|async|await|try|except|catch|finally|throw|raise|new|this|self" +
          "|pass|break|continue|yield|lambda|with|type|interface|enum" +
          "|export|default|static|public|private|protected|void|bool|int|str|float";
        code = code.replace(new RegExp(`\\b(${KW})\\b`, "g"), '<span class="sh-keyword">$1</span>');
        // Numbers.
        code = code.replace(/\b(\d+\.?\d*)\b/g, '<span class="sh-number">$1</span>');
        return code;
      }

      function copyCode(btn) {
        const code = btn.closest(".code-block").querySelector("code");
        navigator.clipboard
          .writeText(code.textContent)
          .then(() => {
            btn.textContent = "Copied!";
            btn.style.color = "var(--accent)";
            setTimeout(() => {
              btn.textContent = "Copy";
              btn.style.color = "";
            }, 1500);
          })
          .catch(() => {
            const r = document.createRange();
            r.selectNode(code);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(r);
          });
      }

      // Configure marked with GFM, line breaks, and custom code block rendering
      if (typeof marked !== "undefined") {
        const customRenderer = {
          code(token) {
            const text = token.text || "";
            const lang = token.lang || "";
            const language = (lang || "").match(/^\S*/)?.[0] || "";
            const escaped = escapeHtml(text);
            const highlighted = applyHighlighting(escaped);
            const langBadge = language ? `<span class="code-lang">${escapeHtml(language)}</span>` : "";
            return `<div class="code-block"><div class="code-header">${langBadge}<button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>${highlighted}</code></pre></div>`;
          }
        };
        marked.use({
          gfm: true,
          breaks: true,
          renderer: customRenderer
        });
      }

      function extractFrontmatter(text) {
        if (!text) return { frontmatter: null, body: "" };
        const trimmed = text.trimStart();
        if (!trimmed.startsWith("---")) {
          return { frontmatter: null, body: text };
        }
        const match = trimmed.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
        if (!match) return { frontmatter: null, body: text };

        const rawYaml = match[1];
        const body = match[2];
        const entries = [];
        const lines = rawYaml.split(/\r?\n/);
        let currentKey = null;
        let currentVal = [];

        for (const line of lines) {
          const kvMatch = line.match(/^([A-Za-z0-9_ -]+):\s*(.*)$/);
          if (kvMatch) {
            if (currentKey) {
              entries.push({ key: currentKey, val: currentVal.join("\n").trim() });
            }
            currentKey = kvMatch[1].trim();
            currentVal = kvMatch[2] ? [kvMatch[2].trim()] : [];
          } else if (currentKey) {
            currentVal.push(line.trim());
          }
        }
        if (currentKey) {
          entries.push({ key: currentKey, val: currentVal.join("\n").trim() });
        }

        return {
          frontmatter: entries.length > 0 ? entries : null,
          body: body
        };
      }

      function renderFrontmatter(entries) {
        if (!entries || entries.length === 0) return "";
        const items = entries.map(e => `
          <div class="frontmatter-item">
            <span class="frontmatter-key">${escapeHtml(e.key)}:</span>
            <span class="frontmatter-val">${escapeHtml(e.val)}</span>
          </div>
        `).join("");
        return `<div class="frontmatter-card"><div class="frontmatter-header">📋 Metadata</div><div class="frontmatter-grid">${items}</div></div>`;
      }

      function renderMarkdown(text) {
        if (!text) return "";

        // 1. Extract leading YAML frontmatter if present
        const { frontmatter, body } = extractFrontmatter(text);
        const frontmatterHtml = frontmatter ? renderFrontmatter(frontmatter) : "";

        let html = "";
        if (typeof marked !== "undefined" && typeof marked.parse === "function") {
          html = marked.parse(body);
        } else {
          // Fallback legacy renderer if library failed to load
          let src = escapeHtml(body);
          src = src
            .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
            .replace(/\*(.*?)\*/g, "<em>$1</em>")
            .replace(/`([^`\n]+)`/g, "<code>$1</code>")
            .replace(/^### (.+)$/gm, "<h3>$1</h3>")
            .replace(/^## (.+)$/gm, "<h2>$1</h2>")
            .replace(/^# (.+)$/gm, "<h1>$1</h1>")
            .replace(/\n\n+/g, "<br><br>")
            .replace(/\n/g, "<br>");
          html = src;
        }

        // 2. Sanitize with DOMPurify if available (safely allowing onclick for copy/research buttons)
        if (typeof DOMPurify !== "undefined" && typeof DOMPurify.sanitize === "function") {
          html = DOMPurify.sanitize(html, {
            ADD_ATTR: ["onclick", "target", "checked", "disabled"],
            ADD_TAGS: ["button", "input"]
          });
        }

        // 3. Research deep-link buttons
        html = html.replace(
          /\[\[Research\/([^\]]+)\]\]/g,
          (_, slug) =>
            `<button class="write-badge" style="cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;vertical-align:middle;border:1px solid var(--tool-border);background:var(--tool-bg);color:var(--tool-text);" onclick="openModal('research','${slug}')">\uD83D\uDD0D Deep Research: ${slug}</button>`
        );

        return frontmatterHtml + html;
      }

      // renderFullMarkdown: modals (research reports, journal entries) share the
      // same full renderer. Alias kept for call-site clarity.
      function renderFullMarkdown(text) {
        return renderMarkdown(text);
      }

      function scrollBottom() {
        const el = document.getElementById("messages");
        el.scrollTop = el.scrollHeight;
      }

      function setStatus(txt) {
        document.getElementById("status-text").textContent = txt;
      }

      function formatTime(ts) {
        // ts: unix timestamp (seconds) or null for "now"
        const d = ts ? new Date(ts * 1000) : new Date();
        return d.toLocaleString([], {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      // ---------------------------------------------------------------------------
      // Think block builder & multi-section streaming handler
      // ---------------------------------------------------------------------------
      function createThinkBlock(label = "Thinking…") {
        const wrap = document.createElement("div");
        wrap.className = "think-block open";
        wrap.innerHTML = `
    <div class="think-header" onclick="this.parentElement.classList.toggle('open')">
      <span class="think-icon">🧠</span>
      <span class="think-label">${label}</span>
      <span class="think-chevron">▼</span>
    </div>
    <div class="think-content"></div>`;
        return wrap;
      }

      function createThinkingHandler(wrap, getBubble, addActivity) {
        const thinkSections = [];
        let currentThinkSection = null;

        function handleDelta(delta) {
          // Check if delta starts with a phase label: [Initial]\n, [Tool 1]\n, [Response]\n
          const labelMatch = delta.match(/^\[(Initial|Tool \d+|Response)\]\n/);
          if (labelMatch) {
            const labelName = labelMatch[1];
            if (addActivity) addActivity("🧠", `${labelName} thinking…`);
            const block = createThinkBlock(labelName);
            const bubble = getBubble ? getBubble() : null;
            if (bubble) {
              wrap.insertBefore(block, bubble);
            } else {
              wrap.appendChild(block);
            }
            const content = block.querySelector(".think-content");
            currentThinkSection = { label: labelName, block, content };
            thinkSections.push(currentThinkSection);

            const rest = delta.slice(labelMatch[0].length);
            if (rest) {
              content.textContent += rest;
              content.scrollTop = content.scrollHeight;
            }
          } else {
            if (!currentThinkSection) {
              if (addActivity) addActivity("🧠", "Model thinking…");
              const block = createThinkBlock("Thinking…");
              const bubble = getBubble ? getBubble() : null;
              if (bubble) {
                wrap.insertBefore(block, bubble);
              } else {
                wrap.appendChild(block);
              }
              const content = block.querySelector(".think-content");
              currentThinkSection = { label: "Thinking…", block, content };
              thinkSections.push(currentThinkSection);
            }
            currentThinkSection.content.textContent += delta;
            currentThinkSection.content.scrollTop = currentThinkSection.content.scrollHeight;
          }
          scrollBottom();
        }

        function finalize() {
          thinkSections.forEach((sec) => {
            const lbl = sec.block.querySelector(".think-label");
            if (lbl) {
              lbl.textContent = lbl.textContent.replace("…", "");
              if (lbl.textContent === "Thinking") {
                lbl.textContent = "Thought process";
              }
            }
            sec.block.classList.remove("open");
          });
        }

        return { handleDelta, finalize };
      }

      // ---------------------------------------------------------------------------
      // Tool indicator
      // ---------------------------------------------------------------------------
      function createToolIndicator(name) {
        const el = document.createElement("div");
        el.className = "tool-indicator";
        const labels = {
          search_vault: "Searching vault…",
          recall_specific_memory: "Reading memory…",
          read_journal: "Reading journal…",
          read_journal_entry: "Reading journal…",
          read_recent_journal_entries: "Reviewing recent journal…",
          write_journal_entry: "Writing journal entry…",
          log_context_fact: "Logging fact…",
          update_context_fact: "Updating context…",
          generate_image: "Generating image…",
          sync_context_memory: "Syncing memory…",
        };
        el.innerHTML = `<div class="spinner"></div><span>${labels[name] || name + "…"}</span>`;
        return el;
      }

      // ---------------------------------------------------------------------------
      // Message rendering
      // ---------------------------------------------------------------------------
      function appendUserMessage(text, ts) {
        const isSystem = text.startsWith("[System:");
        const div = document.createElement("div");
        div.className = isSystem ? "msg system" : "msg user";
        div.dataset.rawText = text;
        const meta = document.createElement("div");
        meta.className = "msg-meta";
        meta.textContent = isSystem ? `System · ${formatTime(ts)}` : `You · ${formatTime(ts)}`;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML = renderMarkdown(text);
        div.appendChild(meta);
        div.appendChild(bubble);
        document.getElementById("messages").appendChild(div);
        scrollBottom();
        return div;
      }

      function createAssistantMessage(ts) {
        const wrap = document.createElement("div");
        wrap.className = "msg assistant";
        const meta = document.createElement("div");
        meta.className = "msg-meta";
        meta.textContent = `Evelyn · ${formatTime(ts)}`;
        wrap.appendChild(meta);
        document.getElementById("messages").appendChild(wrap);
        scrollBottom();
        return wrap;
      }

      // TTS — Progressive chunked playback.
      // Sentence WAVs arrive via SSE as they are synthesized and are queued for
      // sequential play, so the first sentence starts before the last is ready.
      let _ttsAudio = null;
      let _ttsQueue = [];
      let _ttsStreamDone = false;
      let _ttsPlaying = false;
      let _ttsActiveBtn = null;
      let _ttsAbort = null;

      function _stopTTS() {
        if (_ttsAbort) {
          _ttsAbort.abort();
          _ttsAbort = null;
        }
        if (_ttsAudio) {
          _ttsAudio.pause();
          _ttsAudio.src = "";
          _ttsAudio = null;
        }
        _ttsQueue = [];
        _ttsStreamDone = false;
        _ttsPlaying = false;
        if (_ttsActiveBtn) {
          _ttsActiveBtn.textContent = "🔊";
          _ttsActiveBtn = null;
        }
      }

      function _playNextChunk() {
        if (_ttsQueue.length === 0) {
          _ttsPlaying = false;
          if (_ttsStreamDone) _stopTTS();
          return;
        }
        const url = _ttsQueue.shift();
        _ttsAudio = new Audio(url);
        _ttsPlaying = true;
        _ttsAudio.play().catch(() => {
          _ttsAudio = null;
          _playNextChunk();
        });
        _ttsAudio.onended = () => {
          _ttsAudio = null;
          _playNextChunk();
        };
        _ttsAudio.onerror = () => {
          _ttsAudio = null;
          _playNextChunk();
        };
      }

      async function playTTS(text, btn) {
        if (_ttsPlaying || _ttsAudio) {
          _stopTTS();
          return;
        }
        _ttsActiveBtn = btn;
        btn.textContent = "⏳";
        _ttsQueue = [];
        _ttsStreamDone = false;
        _ttsPlaying = false;
        _ttsAbort = new AbortController();

        try {
          const resp = await fetch(`${API_BASE}/tts/stream`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model: "tts", input: text }),
            signal: _ttsAbort.signal,
          });
          if (!resp.ok) throw new Error(`TTS error: ${resp.status}`);

          const reader = resp.body.getReader();
          const dec = new TextDecoder();
          let buf = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const lines = buf.split("\n");
            buf = lines.pop(); // Hold incomplete line
            for (const line of lines) {
              if (!line.startsWith("data: ")) continue;
              try {
                const ev = JSON.parse(line.slice(6));
                if (ev.chunk) {
                  _ttsQueue.push(`${API_BASE}/tts-audio/${ev.chunk}`);
                  if (!_ttsPlaying) {
                    btn.textContent = "⏹";
                    _playNextChunk();
                  }
                } else if (ev.done) {
                  _ttsStreamDone = true;
                  if (!_ttsPlaying && _ttsQueue.length === 0) _stopTTS();
                } else if (ev.error) {
                  console.error("[TTS]", ev.error);
                  _stopTTS();
                }
              } catch {}
            }
          }
        } catch (e) {
          if (e.name !== "AbortError") console.error("[TTS] stream error:", e);
          _stopTTS();
        }
      }

      // ---------------------------------------------------------------------------
      // Write-tool tracking — tools that create/edit files
      // ---------------------------------------------------------------------------
      const WRITE_TOOLS = {
        write_journal_entry: { icon: "📓", label: "Journal entry written" },
        log_context_fact: { icon: "📌", label: "Context fact logged" },
        update_context_fact: { icon: "📝", label: "Context fact updated" },
        generate_image: { icon: "🎨", label: "Image generated" },
        run_command: { icon: "💻", label: "Command executed" },
        write_file: { icon: "💾", label: "File written" },
      };

      let pendingApprovals = [];
      let approvalStatuses = {};

      async function fetchPendingApprovals() {
        try {
          const resp = await fetch(`${API_BASE}/api/terminal/pending`, { headers: headers() });
          if (resp.ok) {
            pendingApprovals = await resp.json();
            for (const item of pendingApprovals) {
              approvalStatuses[item.id] = { ...item, status: "pending" };
            }
          }
        } catch (e) {
          console.warn("Could not fetch pending approvals:", e);
        }
      }

      async function fetchApprovalStatuses(ids) {
        if (!ids || ids.length === 0) return;
        try {
          const resp = await fetch(`${API_BASE}/api/terminal/status`, {
            method: "POST",
            headers: headers(),
            body: JSON.stringify({ ids }),
          });

      function handleStreamEvent(evt, chunkId) {
        if (chunkId !== undefined && chunkId !== null && !isNaN(chunkId)) {
          currentStream.lastChunkId = chunkId;
        }

        if (evt.type === "stream_session") {
          currentStream.id = evt.stream_id;
          sessionStorage.setItem("active_stream_id", evt.stream_id);
          return;
        }

        if (evt.type === "status") {
          if (currentStream.addActivity) currentStream.addActivity(null, evt.msg);
          setStatus(evt.msg);
          return;
        }

        if (evt.type === "thinking") {
          if (currentStream.thinkingHandler) currentStream.thinkingHandler.handleDelta(evt.delta);
          return;
        }

        if (evt.type === "tool") {
          const toolLabels = {
            search_vault: "Searching vault",
            recall_specific_memory: "Reading memory",
            read_journal: "Reading journal",
            read_journal_entry: "Reading journal",
            read_recent_journal_entries: "Reviewing recent journal",
            write_journal_entry: "Writing journal entry",
            log_context_fact: "Logging context fact",
            update_context_fact: "Updating context fact",
            generate_image: "Generating image",
            sync_context_memory: "Syncing memory",
            run_command: "Running command",
            read_file: "Reading file",
            write_file: "Writing file",
          };
          if (currentStream.addActivity) {
            currentStream.addActivity("⚙️", toolLabels[evt.name] || evt.name.replace(/_/g, " "));
          }
          setStatus((toolLabels[evt.name] || evt.name) + "…");
          currentStream.usedTools.push(evt.name);
          scrollBottom();
          return;
        }

        if (evt.type === "tool_data") {
          const idx = currentStream.usedTools.indexOf(evt.name);
          if (idx !== -1) {
            currentStream.usedTools[idx] = `${evt.name}[${evt.data}]`;
          }
          return;
        }

        if (evt.type === "text") {
          if (!currentStream.bubble) {
            if (currentStream.addActivity) currentStream.addActivity("✍️", "Generating response…");
            if (currentStream.removeActivity) currentStream.removeActivity();
            if (currentStream.wrap) {
              currentStream.wrap.querySelectorAll(".tool-indicator .spinner").forEach((s) => {
                s.style.animation = "none";
                s.style.borderColor = "var(--tool-text)";
              });
            }
            currentStream.bubble = document.createElement("div");
            currentStream.bubble.className = "bubble";
            currentStream.cursorEl = document.createElement("span");
            currentStream.cursorEl.className = "cursor";
            currentStream.bubble.appendChild(currentStream.cursorEl);
            if (currentStream.wrap) currentStream.wrap.appendChild(currentStream.bubble);
            if (currentStream.thinkingHandler) currentStream.thinkingHandler.finalize();
          }
          currentStream.contentText += evt.delta;
          currentStream.bubble.innerHTML = renderMarkdown(currentStream.contentText);
          currentStream.bubble.appendChild(currentStream.cursorEl);
          setStatus("Streaming…");
          scrollBottom();
          return;
        }

        if (evt.type === "metrics") {
          updateTelemetry(evt.prompt_eval_count, evt.eval_count);
          return;
        }

        if (evt.type === "done") {
          if (currentStream.thinkingHandler) currentStream.thinkingHandler.finalize();
          if (currentStream.cursorEl) currentStream.cursorEl.remove();
          if (currentStream.bubble) currentStream.bubble.innerHTML = renderMarkdown(currentStream.contentText);
          
          if (currentStream.wrap) {
            const actions = document.createElement("div");
            actions.className = "msg-actions";
            const ttsBtn = document.createElement("button");
            ttsBtn.className = "btn-tts";
            ttsBtn.textContent = "🔊";
            ttsBtn.title = "Play TTS";
            const captured = currentStream.contentText;
            ttsBtn.onclick = () => playTTS(captured, ttsBtn);
            actions.appendChild(ttsBtn);
            currentStream.wrap.appendChild(actions);
            addWriteBadges(currentStream.wrap, currentStream.usedTools, currentStream.contentText);
            if (_autoSpeech) playTTS(captured, ttsBtn);
          }

          if (currentStream.userMsgDiv) {
            addRegenToUserMsg(currentStream.userMsgDiv);
          }

          setStatus("Ready");
          scrollBottom();
          currentStream.isDone = true;
          sessionStorage.removeItem("active_stream_id");
          return;
        }
      }

      async function consumeStreamResponse(resp) {
        currentStream.isReading = true;
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";

        try {
          let pendingChunkId = null;
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });

            const lines = buf.split("\n");
            buf = lines.pop();

            for (const line of lines) {
              if (line.startsWith("id: ")) {
                pendingChunkId = parseInt(line.slice(4).trim(), 10);
                continue;
              }
              if (!line.startsWith("data: ")) continue;
              let evt;
              try {
                evt = JSON.parse(line.slice(6));
              } catch {
                continue;
              }
              handleStreamEvent(evt, pendingChunkId);
              pendingChunkId = null;
            }
          }
        } finally {
          currentStream.isReading = false;
        }
      }

      async function reconnectActiveStream() {
        if (!currentStream.id || currentStream.isDone) return;
        
        // Abort any existing stalled socket before opening a fresh reconnect stream
        if (currentStream.abortController) {
          try {
            currentStream.abortController.abort();
          } catch {}
        }
        currentStream.abortController = new AbortController();

        console.log(`[Stream Reconnect] Reconnecting to stream ${currentStream.id} after chunk #${currentStream.lastChunkId}`);
        setStatus("Reconnecting…");
        try {
          const resp = await fetch(`${API_BASE}/chat/stream/${currentStream.id}?after=${currentStream.lastChunkId}`, {
            headers: headers(),
            signal: currentStream.abortController.signal,
          });
          if (resp.status === 404) {
            console.log("[Stream Reconnect] Session not found or finished — reloading history");
            currentStream.isDone = true;
            sessionStorage.removeItem("active_stream_id");
            await loadHistory();
            finishStreamingUI();
            setStatus("Ready");
            return;
          }
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          await consumeStreamResponse(resp);
          if (currentStream.isDone) {
            finishStreamingUI();
          }
        } catch (err) {
          if (err.name !== "AbortError") {
            console.warn("[Stream Reconnect] Failed to reconnect stream:", err);
          }
        }
      }

      // ---------------------------------------------------------------------------
      // Response poll — runs after recovery to catch late-arriving assistant messages
      // ---------------------------------------------------------------------------
      let _responsePollTimer = null;

      function stopResponsePoll() {
        if (_responsePollTimer) {
          clearInterval(_responsePollTimer);
          _responsePollTimer = null;
        }
      }

      function startResponsePoll() {
        stopResponsePoll();
        let attempts = 0;
        const MAX_ATTEMPTS = 40; // 2 min at 3s intervals
        setStatus("Waiting for response…");
        _responsePollTimer = setInterval(async () => {
          attempts++;
          if (attempts >= MAX_ATTEMPTS) {
            stopResponsePoll();
            setStatus("Ready");
            return;
          }
          try {
            const resp = await fetch(`${API_BASE}/latest_message_id`, { headers: headers() });
            if (!resp.ok) return;
            const { id } = await resp.json();
            if (id > lastRenderedMsgId) {
              stopResponsePoll();
              console.log(`[Poll] New content #${id} — reloading history`);
              await loadHistory();
              setStatus("Ready");
            }
          } catch {
            /* network issue — retry next interval */
          }
        }, 3000);
      }

      // ---------------------------------------------------------------------------
      // Connection-drop recovery helper
      // ---------------------------------------------------------------------------
      async function recoverFromConnectionDrop(wrap) {
        setStatus("Reconnecting…");
        await new Promise((r) => setTimeout(r, 2500));
        try {
          const resp = await fetch(`${API_BASE}/latest_message_id`, { headers: headers() });
          if (!resp.ok) return false;
          const { id: serverLatest } = await resp.json();
          if (serverLatest > lastRenderedMsgId) {
            console.log(
              `[Recovery] Server has msg #${serverLatest}, UI has #${lastRenderedMsgId} — reloading`
            );
            if (wrap && wrap.parentNode) wrap.remove();
            setStatus("Reconnected");
            await loadHistory();
            startResponsePoll();
            return true;
          }
        } catch {
          /* server unreachable */
        }
        return false;
      }

      async function handleApproval(approvalId, approve) {
        const card = document.getElementById(`approval-card-${approvalId}`);
        if (!card) return;

        card.querySelectorAll("button").forEach((btn) => (btn.disabled = true));

        const action = approve ? "approve" : "deny";
        try {
          const resp = await fetch(`${API_BASE}/api/terminal/${action}/${approvalId}`, {
            method: "POST",
            headers: headers(),
          });

          if (resp.ok) {
            const data = await resp.json();
            if (approvalStatuses[approvalId]) {
              approvalStatuses[approvalId].status = approve ? "approved" : "denied";
            } else {
              approvalStatuses[approvalId] = {
                id: approvalId,
                status: approve ? "approved" : "denied",
              };
            }

            if (approve) {
              card.style.borderColor = "var(--tool-border)";
              card.style.background = "rgba(102,187,119,0.05)";
              card.innerHTML = `
          <div style="font-size: 13px; font-weight: 600; color: var(--tool-text);">
            ✓ Approved and Executed
          </div>
        `;
              const resultText = data.result || "[Success]";
              sendSystemMessage(`[System: Command output:\n${resultText}]`);
            } else {
              card.style.borderColor = "var(--border)";
              card.style.background = "transparent";
              card.innerHTML = `
          <div style="font-size: 13px; font-weight: 600; color: var(--text-dim);">
            ✗ Denied
          </div>
        `;
            }
            if (pendingApprovals) {
              pendingApprovals = pendingApprovals.filter((item) => item.id !== approvalId);
            }
          } else {
            const err = await resp.text();
            alert(`Failed to ${action}: ${err}`);
            card.querySelectorAll("button").forEach((btn) => (btn.disabled = false));
          }
        } catch (err) {
          alert(`Error: ${err.message}`);
          card.querySelectorAll("button").forEach((btn) => (btn.disabled = false));
        }
      }

      async function executeChatTurn(text) {
        isStreaming = true;
        stopResponsePoll();
        document.getElementById("send-btn").disabled = true;
        document.querySelector(".avatar").classList.add("active");
        setStatus("Thinking…");

        const sentAt = Date.now() / 1000;
        const userMsgDiv = appendUserMessage(text, sentAt);

        // Build assistant message container with activity log
        const wrap = createAssistantMessage();
        const actLog = document.createElement("div");
        actLog.className = "activity-log";
        wrap.appendChild(actLog);
        let actRemoved = false;

        function addActivity(icon, text, isDone = false) {
          const prev = actLog.querySelector(".activity-step:last-child");
          if (prev) prev.classList.add("done");
          const step = document.createElement("div");
          step.className = "activity-step";
          step.innerHTML = icon
            ? `<span class="step-icon">${icon}</span><span>${text}</span>`
            : `<div class="step-dot"></div><span>${text}</span>`;
          if (isDone) step.classList.add("done");
          actLog.appendChild(step);
          scrollBottom();
        }

        function removeActivity() {
          if (!actRemoved) {
            actLog.remove();
            actRemoved = true;
          }
        }

        addActivity("📨", "Message sent");
        const thinkingHandler = createThinkingHandler(wrap, () => currentStream.bubble, addActivity);

        currentStream = {
          id: null,
          lastChunkId: -1,
          wrap: wrap,
          userMsgDiv: userMsgDiv,
          thinkingHandler: thinkingHandler,
          addActivity: addActivity,
          removeActivity: removeActivity,
          bubble: null,
          cursorEl: null,
          actLog: actLog,
          actRemoved: false,
          contentText: "",
          usedTools: [],
          abortController: new AbortController(),
          isReading: false,
          isDone: false,
        };

        try {
          const chatPayload = { message: text };
          if (selectedEffort !== null) {
            chatPayload.think = selectedEffort;
          }
          const resp = await fetch(`${API_BASE}/chat`, {
            method: "POST",
            headers: headers(),
            body: JSON.stringify(chatPayload),
            signal: currentStream.abortController.signal,
          });

          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

          await consumeStreamResponse(resp);

          if (!currentStream.isDone && currentStream.id) {
            await reconnectActiveStream();
          }
        } catch (err) {
          removeActivity();
          if (currentStream.id && !currentStream.isDone) {
            await reconnectActiveStream();
          } else {
            const recovered = await recoverFromConnectionDrop(wrap);
            if (!recovered) {
              const errBubble = document.createElement("div");
              errBubble.className = "bubble";
              errBubble.style.color = "#ff6666";
              errBubble.textContent = `Error: ${err.message}`;
              wrap.appendChild(errBubble);
              addRegenToUserMsg(userMsgDiv);
              setStatus("Error");
            }
          }
        } finally {
          if (currentStream.isDone) {
            finishStreamingUI();
          }
        }
      }

      // ---------------------------------------------------------------------------
      // History load (paginated — last 50 messages initially)
      // ---------------------------------------------------------------------------
      const HISTORY_PAGE_SIZE = 50;
      let oldestLoadedId = null; // tracks cursor for "load more"
      let hasMoreHistory = false; // whether older messages exist
      let lastRenderedMsgId = 0; // tracks latest rendered msg for visibility recovery

      function renderMessageToContainer(m, container) {
        if (m.role === "user") {
          appendUserMessage(m.content, m.ts);
        } else if (m.content === "[THREAD_BREAK]") {
          const divider = document.createElement("div");
          divider.className = "thread-divider";
          divider.textContent = "new thread";
          container.appendChild(divider);
        } else if (m.role === "assistant") {
          const wrap = createAssistantMessage(m.ts);
          if (m.thinking) {
            const sections = m.thinking.split(/(?=\[(?:Initial|Tool \d+|Response)\]\n)/g);
            if (sections.length > 1) {
              sections.forEach((sec) => {
                const mLabel = sec.match(/^\[(Initial|Tool \d+|Response)\]\n([\s\S]*)$/);
                if (mLabel) {
                  const tb = createThinkBlock(mLabel[1]);
                  tb.querySelector(".think-content").textContent = mLabel[2].trim();
                  tb.classList.remove("open");
                  wrap.appendChild(tb);
                } else if (sec.trim()) {
                  const tb = createThinkBlock("Thought process");
                  tb.querySelector(".think-content").textContent = sec.trim();
                  tb.classList.remove("open");
                  wrap.appendChild(tb);
                }
              });
            } else {
              const tb = createThinkBlock("Thought process");
              tb.querySelector(".think-content").textContent = m.thinking;
              tb.classList.remove("open");
              wrap.appendChild(tb);
            }
          }
          const b = document.createElement("div");
          b.className = "bubble";
          b.innerHTML = renderMarkdown(m.content);
          wrap.appendChild(b);
          const actions = document.createElement("div");
          actions.className = "msg-actions";
          const ttsBtn = document.createElement("button");
          ttsBtn.className = "btn-tts";
          ttsBtn.textContent = "🔊";
          const captured = m.content;
          ttsBtn.onclick = () => playTTS(captured, ttsBtn);
          actions.appendChild(ttsBtn);
          wrap.appendChild(actions);
          if (m.tools_used) {
            addWriteBadges(wrap, m.tools_used.split(","), m.content);
          }
        }
      }

      function insertLoadMoreButton() {
        const container = document.getElementById("messages");
        // Remove any existing load-more button
        const existing = container.querySelector(".load-more-wrap");
        if (existing) existing.remove();
        if (!hasMoreHistory) return;
        const wrapDiv = document.createElement("div");
        wrapDiv.className = "load-more-wrap";
        const btn = document.createElement("button");
        btn.className = "btn-load-more";
        btn.textContent = "↑ Load older messages";
        btn.onclick = loadOlderMessages;
        wrapDiv.appendChild(btn);
        container.insertBefore(wrapDiv, container.firstChild);
      }

      function handleAuthError(resp) {
        if (resp && resp.status === 401) {
          const key = prompt("API Key Required / Invalid. Enter your Evelyn API key (X-Evelyn-Key):");
          if (key) {
            localStorage.setItem("evelyn_api_key", key);
            location.reload();
          }
        }
      }

      async function loadHistory() {
        try {
          const resp = await fetch(`${API_BASE}/history?limit=${HISTORY_PAGE_SIZE}`, {
            headers: headers(),
          });
          if (!resp.ok) {
            handleAuthError(resp);
            return;
          }
          const msgs = await resp.json();
          const container = document.getElementById("messages");
          container.innerHTML = "";

          // Track pagination cursor
          if (msgs.length > 0) {
            oldestLoadedId = msgs[0].id;
            hasMoreHistory = msgs.length >= HISTORY_PAGE_SIZE;
          } else {
            oldestLoadedId = null;
            hasMoreHistory = false;
          }

          // Show "load more" button if there are likely older messages
          insertLoadMoreButton();

          let lastDateLabel = null;
          for (const m of msgs) {
            if (m.ts) {
              const d = new Date(m.ts * 1000);
              const dateLabel = d.toLocaleDateString("en-US", {
                weekday: "short",
                month: "short",
                day: "numeric",
                year: "numeric",
              });
              if (lastDateLabel !== null && dateLabel !== lastDateLabel) {
                const dateDiv = document.createElement("div");
                dateDiv.className = "date-divider";
                dateDiv.textContent = dateLabel;
                container.appendChild(dateDiv);
              }
              lastDateLabel = dateLabel;
            }
            renderMessageToContainer(m, container);
          }
          // Add regen button to the last user message only
          const allUser = container.querySelectorAll(".msg.user");
          if (allUser.length > 0) {
            addRegenToUserMsg(allUser[allUser.length - 1]);
          }
          scrollBottom();
          // Hydrate telemetry from the most recent assistant message
          let latestPromptTokens = 0;
          let latestEvalTokens = 0;
          for (let i = msgs.length - 1; i >= 0; i--) {
            if (msgs[i].prompt_eval_count !== undefined && msgs[i].prompt_eval_count !== null) {
              latestPromptTokens = msgs[i].prompt_eval_count;
              latestEvalTokens = msgs[i].eval_count || 0;
              break;
            }
          }
          if (latestPromptTokens > 0) updateTelemetry(latestPromptTokens, latestEvalTokens);

          // Update visibility-recovery cursor from loaded messages
          if (msgs.length > 0) {
            lastRenderedMsgId = Math.max(lastRenderedMsgId, msgs[msgs.length - 1].id);
          }
        } catch (e) {
          console.warn("Could not load history:", e);
        }
      }

      async function loadOlderMessages() {
        if (!oldestLoadedId || !hasMoreHistory) return;
        const btn = document.querySelector(".btn-load-more");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Loading…";
        }

        try {
          const resp = await fetch(
            `${API_BASE}/history?limit=${HISTORY_PAGE_SIZE}&before=${oldestLoadedId}`,
            { headers: headers() }
          );
          if (!resp.ok) return;
          const msgs = await resp.json();
          if (msgs.length === 0) {
            hasMoreHistory = false;
            const wrap = document.querySelector(".load-more-wrap");
            if (wrap) wrap.remove();
            return;
          }

          // Update cursor
          oldestLoadedId = msgs[0].id;
          hasMoreHistory = msgs.length >= HISTORY_PAGE_SIZE;

          const container = document.getElementById("messages");
          // Remember scroll position so we can restore it after prepending
          const prevScrollHeight = container.scrollHeight;

          // Remove existing load-more button before prepending
          const existingBtn = container.querySelector(".load-more-wrap");
          if (existingBtn) existingBtn.remove();

          // Build a document fragment with the older messages
          // We need to temporarily append to container to reuse render helpers,
          // then move those nodes to the top.
          const marker = document.createElement("div");
          marker.id = "_load-more-marker";
          container.appendChild(marker);

          for (const m of msgs) {
            renderMessageToContainer(m, container);
          }

          // Collect all nodes that were appended after the marker
          const newNodes = [];
          let node = marker.nextSibling;
          while (node) {
            newNodes.push(node);
            node = node.nextSibling;
          }
          marker.remove();

          // Find the first real message (skip old load-more button position)
          const firstChild = container.firstChild;
          for (const n of newNodes) {
            container.insertBefore(n, firstChild);
          }

          // Re-insert load-more button at top if more history exists
          insertLoadMoreButton();

          // Restore scroll position so the user stays where they were
          container.scrollTop = container.scrollHeight - prevScrollHeight;
        } catch (e) {
          console.warn("Could not load older messages:", e);
        }
      }

      function editUserMessage(userMsgDiv) {
        if (isStreaming) return;
        const bubble = userMsgDiv.querySelector(".bubble");
        if (!bubble) return;

        // Don't open duplicate edit box
        if (userMsgDiv.querySelector(".msg-edit-box")) return;

        const currentText = userMsgDiv.dataset.rawText || bubble.innerText.trim();

        // Add editing class to expand container width
        userMsgDiv.classList.add("editing");

        // Hide bubble and action buttons while editing
        bubble.style.display = "none";
        const actions = userMsgDiv.querySelector(".msg-actions");
        if (actions) actions.style.display = "none";

        // Create edit container
        const editBox = document.createElement("div");
        editBox.className = "msg-edit-box";

        const textarea = document.createElement("textarea");
        textarea.className = "msg-edit-textarea";
        textarea.value = currentText;

        const adjustHeight = () => {
          textarea.style.height = "auto";
          textarea.style.height = Math.max(90, textarea.scrollHeight) + "px";
        };
        textarea.addEventListener("input", adjustHeight);

        const editActions = document.createElement("div");
        editActions.className = "msg-edit-actions";

        const cancelBtn = document.createElement("button");
        cancelBtn.className = "btn-edit-cancel";
        cancelBtn.textContent = "Cancel";

        const saveBtn = document.createElement("button");
        saveBtn.className = "btn-edit-save";
        saveBtn.textContent = "Save & Submit";

        const closeEditBox = () => {
          editBox.remove();
          userMsgDiv.classList.remove("editing");
          bubble.style.display = "";
          if (actions) actions.style.display = "";
        };

        cancelBtn.onclick = closeEditBox;

        saveBtn.onclick = () => {
          const newText = textarea.value.trim();
          closeEditBox();
          if (newText && newText !== currentText) {
            submitEditedMessage(userMsgDiv, newText);
          }
        };

        textarea.onkeydown = (e) => {
          if (e.key === "Escape") {
            closeEditBox();
          } else if (e.key === "Enter") {
            if ((e.ctrlKey || e.metaKey) && !e.shiftKey) {
              e.preventDefault();
              saveBtn.click();
            } else if (!e.shiftKey && !isTouchDevice()) {
              e.preventDefault();
              saveBtn.click();
            }
          }
        };

        editActions.appendChild(cancelBtn);
        editActions.appendChild(saveBtn);
        editBox.appendChild(textarea);
        editBox.appendChild(editActions);

        userMsgDiv.appendChild(editBox);
        adjustHeight();
        textarea.focus();
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
      }

      async function submitEditedMessage(userMsgDiv, newText) {
        if (isStreaming) return;
        userMsgDiv.dataset.rawText = newText;
        const bubble = userMsgDiv.querySelector(".bubble");
        if (bubble) bubble.innerHTML = renderMarkdown(newText);

        // Remove the assistant message(s) following this user message
        let next = userMsgDiv.nextElementSibling;
        while (next && next.classList.contains("msg") && next.classList.contains("assistant")) {
          const toRemove = next;
          next = next.nextElementSibling;
          toRemove.remove();
        }

        const oldActions = userMsgDiv.querySelector(".msg-actions");
        if (oldActions) oldActions.remove();

        isStreaming = true;
        document.getElementById("send-btn").disabled = true;
        document.querySelector(".avatar").classList.add("active");
        setStatus("Editing message…");

        const wrap = createAssistantMessage();
        const actLog = document.createElement("div");
        actLog.className = "activity-log";
        wrap.appendChild(actLog);
        let actRemoved = false;

        function addActivity(icon, text, isDone = false) {
          const prev = actLog.querySelector(".activity-step:last-child");

          const step = document.createElement("div");
