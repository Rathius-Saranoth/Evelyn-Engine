<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evelyn</title>
  <link rel="icon" type="image/x-icon" href="/ui/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0d0d12;
      --surface:   #13131c;
      --surface2:  #1a1a28;
      --border:    #2a2a40;
      --accent:    #7c6af7;
      --accent-dim:#4a3fb0;
      --text:      #e8e8f0;
      --text-dim:  #8888aa;
      --think-bg:  #0f1520;
      --think-border:#2a3a55;
      --think-text:#6699cc;
      --tool-bg:   #0f1a10;
      --tool-border:#2a4030;
      --tool-text: #66bb77;
      --user-bg:   #1e1e30;
      --radius:    12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #b06af7);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    header h1 { font-size: 16px; font-weight: 500; }
    header span { font-size: 12px; color: var(--text-dim); }
    .header-actions { margin-left: auto; display: flex; gap: 8px; }
    .btn-ghost {
      background: none; border: 1px solid var(--border);
      color: var(--text-dim); padding: 5px 12px; border-radius: 6px;
      cursor: pointer; font-size: 12px; transition: all 0.15s;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-ghost.danger:hover { border-color: #e86040; color: #e86040; }

    /* Thread divider */
    .thread-divider {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 0; color: var(--text-dim); font-size: 11px;
      letter-spacing: 0.05em; text-transform: uppercase;
    }
    .thread-divider::before, .thread-divider::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }

    /* Messages */
    #messages {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 16px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg { display: flex; flex-direction: column; max-width: 85%; gap: 2px; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }

    /* Sender + timestamp label */
    .msg-meta {
      font-size: 11px; color: var(--text-dim);
      padding: 0 4px; letter-spacing: 0.02em;
    }
    .msg.user .msg-meta { text-align: right; }
    .msg.assistant .msg-meta { text-align: left; }

    .bubble {
      padding: 12px 16px; border-radius: var(--radius); line-height: 1.6;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble { background: var(--user-bg); border: 1px solid var(--border); }
    .msg.assistant .bubble { background: var(--surface); border: 1px solid var(--border); }

    /* Thinking block */
    .think-block {
      border: 1px solid var(--think-border);
      border-radius: 8px; overflow: hidden; margin-bottom: 8px;
      background: var(--think-bg); max-width: 680px;
    }
    .think-header {
      padding: 6px 12px; display: flex; align-items: center; gap: 8px;
      cursor: pointer; user-select: none;
      border-bottom: 1px solid var(--think-border);
    }
    .think-header:hover { background: rgba(255,255,255,0.03); }
    .think-icon { font-size: 14px; }
    .think-label { font-size: 12px; color: var(--think-text); font-weight: 500; }
    .think-chevron { margin-left: auto; font-size: 11px; color: var(--text-dim); transition: transform 0.2s; }
    .think-block.open .think-chevron { transform: rotate(180deg); }
    .think-content {
      padding: 10px 14px; font-size: 13px; color: var(--think-text);
      font-family: 'JetBrains Mono', monospace; line-height: 1.5;
      display: none; max-height: 300px; overflow-y: auto;
      white-space: pre-wrap;
    }
    .think-block.open .think-content { display: block; }

    /* Tool activity */
    .tool-indicator {
      display: flex; align-items: center; gap: 8px; padding: 6px 12px;
      background: var(--tool-bg); border: 1px solid var(--tool-border);
      border-radius: 6px; font-size: 12px; color: var(--tool-text);
      margin-bottom: 6px; width: fit-content;
    }
    .tool-indicator .spinner {
      width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid var(--tool-border); border-top-color: var(--tool-text);
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Typing cursor */
    .cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); animation: blink 0.8s step-end infinite; vertical-align: text-bottom; margin-left: 2px; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Activity log (replaces typing indicator) */
    .activity-log {
      display: flex; flex-direction: column; gap: 4px;
      padding: 10px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); width: fit-content; min-width: 200px;
    }
    .activity-step {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--text-dim);
      animation: step-in 0.2s ease-out;
    }
    @keyframes step-in {
      from { opacity: 0; transform: translateY(3px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .activity-step .step-icon { font-size: 13px; flex-shrink: 0; }
    .activity-step .step-dot {
      width: 6px; height: 6px; border-radius: 50%;
      border: 1.5px solid var(--text-dim); border-top-color: var(--accent);
      flex-shrink: 0;
      animation: spin 0.8s linear infinite;
    }
    .activity-step.done .step-dot {
      animation: none;
      background: var(--tool-text); border-color: var(--tool-text);
    }

    /* Avatar pulse during generation */
    .avatar.active {
      animation: avatar-pulse 1.5s ease-in-out infinite;
    }
    @keyframes avatar-pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(124,106,247,0.15); }
      50% { box-shadow: 0 0 0 6px rgba(124,106,247,0.35); }
    }

    .msg-actions { display: flex; gap: 6px; padding: 0 4px; }
    .btn-tts {
      background: none; border: none; cursor: pointer; color: var(--text-dim);
      font-size: 16px; padding: 2px 4px; border-radius: 4px; transition: color 0.15s;
    }
    .btn-tts:hover { color: var(--accent); }
    .btn-regen {
      background: none; border: none; cursor: pointer; color: var(--text-dim);
      font-size: 14px; padding: 2px 4px; border-radius: 4px; transition: color 0.15s;
    }
    .btn-regen:hover { color: var(--accent); }

    /* Write-tool badges */
    .write-badges {
      display: flex; gap: 6px; flex-wrap: wrap;
      padding: 0 2px; margin-top: 2px;
    }
    .write-badge {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; color: var(--tool-text);
      background: var(--tool-bg); border: 1px solid var(--tool-border);
      border-radius: 4px; padding: 2px 8px;
    }

    /* Markdown-ish: inline code */
    .bubble code {
      background: var(--surface2); padding: 2px 6px; border-radius: 4px;
      font-family: 'JetBrains Mono', monospace; font-size: 13px;
    }
    .bubble strong { font-weight: 600; }

    /* Input area */
    footer {
      padding: 12px 16px; background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .input-row {
      display: flex; gap: 8px; align-items: flex-end;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 8px 12px;
      transition: border-color 0.15s;
    }
    .input-row:focus-within { border-color: var(--accent); }
    #input {
      flex: 1; background: none; border: none; color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 15px;
      resize: none; outline: none; max-height: 150px; line-height: 1.5;
      min-height: 24px;
    }
    #input::placeholder { color: var(--text-dim); }
    #send-btn {
      background: var(--accent); border: none; color: #fff;
      width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
      font-size: 18px; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; flex-shrink: 0;
    }
    #send-btn:hover { background: var(--accent-dim); }
    #send-btn:disabled { background: var(--border); cursor: not-allowed; }
    .input-hint { font-size: 11px; color: var(--text-dim); margin-top: 6px; padding-left: 4px; }

    /* Load-more button */
    .load-more-wrap {
      display: flex; justify-content: center; padding: 12px 0;
    }
    .btn-load-more {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-dim); font-family: 'Inter', sans-serif; font-size: 13px;
      padding: 8px 20px; border-radius: 8px; cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .btn-load-more:hover {
      border-color: var(--accent); color: var(--text); background: var(--surface);
    }
    .btn-load-more:disabled {
      cursor: not-allowed; opacity: 0.5;
    }
  </style>
</head>
<body>
<header>
  <div class="avatar">🌙</div>
  <div>
    <h1>Evelyn</h1>
    <span id="status-text">Ready</span>
  </div>
  <div class="header-actions">
    <button class="btn-ghost" id="new-thread-btn" title="Start a new conversation thread" onclick="newThread()">✦ New Thread</button>
    <button class="btn-ghost" id="sync-btn" title="Sync memory to Chroma" onclick="syncMemory()">⟳ Sync</button>
  </div>
</header>

<div id="messages"></div>

<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="Message Evelyn…" autofocus></textarea>
    <button id="send-btn" title="Send">↑</button>
  </div>
  <div class="input-hint">Enter to send · Shift+Enter for newline</div>
</footer>

<script>
// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------
const API_BASE = window.location.origin;
const API_KEY  = localStorage.getItem('evelyn_api_key') || '';

function headers(extra = {}) {
  return { 'Content-Type': 'application/json', 'X-Evelyn-Key': API_KEY, ...extra };
}

// ---------------------------------------------------------------------------
// Utility
// ---------------------------------------------------------------------------
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(text) {
  // Minimal markdown: bold, inline code, line breaks
  return escapeHtml(text)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

function scrollBottom() {
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
}

function setStatus(txt) {
  document.getElementById('status-text').textContent = txt;
}

function formatTime(ts) {
  // ts: unix timestamp (seconds) or null for "now"
  const d = ts ? new Date(ts * 1000) : new Date();
  return d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ---------------------------------------------------------------------------
// Think block builder
// ---------------------------------------------------------------------------
function createThinkBlock() {
  const wrap = document.createElement('div');
  wrap.className = 'think-block open';
  wrap.innerHTML = `
    <div class="think-header" onclick="this.parentElement.classList.toggle('open')">
      <span class="think-icon">🧠</span>
      <span class="think-label">Thinking…</span>
      <span class="think-chevron">▼</span>
    </div>
    <div class="think-content"></div>`;
  return wrap;
}

// ---------------------------------------------------------------------------
// Tool indicator
// ---------------------------------------------------------------------------
function createToolIndicator(name) {
  const el = document.createElement('div');
  el.className = 'tool-indicator';
  const labels = {
    search_vault: 'Searching vault…',
    recall_specific_memory: 'Reading memory…',
    read_journal_entry: 'Reading journal…',
    read_recent_journal_entries: 'Reviewing recent journal…',
    write_journal_entry: 'Writing journal entry…',
    log_context_fact: 'Logging fact…',
    update_context_fact: 'Updating context…',
    generate_image: 'Generating image…',
    sync_context_memory: 'Syncing memory…',
  };
  el.innerHTML = `<div class="spinner"></div><span>${labels[name] || name + '…'}</span>`;
  return el;
}

// ---------------------------------------------------------------------------
// Message rendering
// ---------------------------------------------------------------------------
function appendUserMessage(text, ts) {
  const div = document.createElement('div');
  div.className = 'msg user';
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = `You · ${formatTime(ts)}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = renderMarkdown(text);
  div.appendChild(meta);
  div.appendChild(bubble);
  document.getElementById('messages').appendChild(div);
  scrollBottom();
  return div;
}

function createAssistantMessage(ts) {
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = `Evelyn · ${formatTime(ts)}`;
  wrap.appendChild(meta);
  document.getElementById('messages').appendChild(wrap);
  scrollBottom();
  return wrap;
}

// TTS button
let ttsAudio = null;
function playTTS(text, btn) {
  if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; btn.textContent = '🔊'; return; }
  btn.textContent = '⏳';
  fetch(`${API_BASE}/tts`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'tts', input: text }),
  })
  .then(r => r.blob())
  .then(blob => {
    const url = URL.createObjectURL(blob);
    ttsAudio = new Audio(url);
    ttsAudio.play();
    btn.textContent = '⏹';
    ttsAudio.onended = () => { ttsAudio = null; btn.textContent = '🔊'; };
  })
  .catch(() => { btn.textContent = '🔊'; });
}

// ---------------------------------------------------------------------------
// Wake Lock — keeps screen alive while streaming (mobile)
// ---------------------------------------------------------------------------
let wakeLockSentinel = null;
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try { wakeLockSentinel = await navigator.wakeLock.request('screen'); }
    catch { /* user denied or not supported */ }
  }
}
function releaseWakeLock() {
  if (wakeLockSentinel) { wakeLockSentinel.release().catch(() => {}); wakeLockSentinel = null; }
}

// ---------------------------------------------------------------------------
// Write-tool tracking — tools that create/edit files
// ---------------------------------------------------------------------------
const WRITE_TOOLS = {
  write_journal_entry:  { icon: '📓', label: 'Journal entry written' },
  log_context_fact:     { icon: '📌', label: 'Context fact logged' },
  update_context_fact:  { icon: '📝', label: 'Context fact updated' },
  generate_image:       { icon: '🎨', label: 'Image generated' },
};

function addWriteBadges(wrap, usedTools) {
  const writesUsed = usedTools.filter(t => WRITE_TOOLS[t]);
  if (writesUsed.length === 0) return;
  const container = document.createElement('div');
  container.className = 'write-badges';
  for (const t of writesUsed) {
    const badge = document.createElement('span');
    badge.className = 'write-badge';
    badge.textContent = `${WRITE_TOOLS[t].icon} ${WRITE_TOOLS[t].label}`;
    container.appendChild(badge);
  }
  // Insert before msg-actions (TTS/regen) if present, otherwise append
  const actions = wrap.querySelector('.msg-actions');
  if (actions) wrap.insertBefore(container, actions);
  else wrap.appendChild(container);
}

// ---------------------------------------------------------------------------
// SSE streaming chat
// ---------------------------------------------------------------------------
let isStreaming = false;

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || isStreaming) return;

  isStreaming = true;
  document.getElementById('send-btn').disabled = true;
  document.querySelector('.avatar').classList.add('active');
  input.value = '';
  input.style.height = 'auto';
  setStatus('Thinking…');
  await requestWakeLock();

  const sentAt = Date.now() / 1000;
  const userMsgDiv = appendUserMessage(text, sentAt);

  // Build assistant message container with activity log
  const wrap = createAssistantMessage();
  const actLog = document.createElement('div');
  actLog.className = 'activity-log';
  wrap.appendChild(actLog);
  let actRemoved = false;

  function addActivity(icon, text, isDone = false) {
    // Mark previous step as done
    const prev = actLog.querySelector('.activity-step:last-child');
    if (prev) prev.classList.add('done');
    const step = document.createElement('div');
    step.className = 'activity-step';
    step.innerHTML = icon
      ? `<span class="step-icon">${icon}</span><span>${text}</span>`
      : `<div class="step-dot"></div><span>${text}</span>`;
    if (isDone) step.classList.add('done');
    actLog.appendChild(step);
    scrollBottom();
  }

  function removeActivity() {
    if (!actRemoved) { actLog.remove(); actRemoved = true; }
  }

  addActivity('📨', 'Message sent');
  let thinkBlock = null;
  let thinkContent = null;
  let bubble = null;
  let contentText = '';
  let cursorEl = null;
  const usedTools = [];

  try {
    const resp = await fetch(`${API_BASE}/chat`, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ message: text }),
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let evt;
        try { evt = JSON.parse(line.slice(6)); } catch { continue; }
        lastStreamActivity = Date.now();

        if (evt.type === 'status') {
          addActivity(null, evt.msg);
        }

        if (evt.type === 'thinking') {
          if (!thinkBlock) {
            addActivity('🧠', 'Model thinking…');
            thinkBlock = createThinkBlock();
            thinkContent = thinkBlock.querySelector('.think-content');
            // Always insert thinking above the bubble (even if bubble exists first)
            if (bubble) {
              wrap.insertBefore(thinkBlock, bubble);
            } else {
              wrap.appendChild(thinkBlock);
            }
          }
          thinkContent.textContent += evt.delta;
          thinkContent.scrollTop = thinkContent.scrollHeight;
          scrollBottom();
        }

        if (evt.type === 'tool') {
          const toolLabels = {
            search_vault: 'Searching vault',
            recall_specific_memory: 'Reading memory',
            read_journal_entry: 'Reading journal',
            read_recent_journal_entries: 'Reviewing recent journal',
            write_journal_entry: 'Writing journal entry',
            log_context_fact: 'Logging context fact',
            update_context_fact: 'Updating context fact',
            generate_image: 'Generating image',
            sync_context_memory: 'Syncing memory',
          };
          addActivity('⚙️', toolLabels[evt.name] || evt.name.replace(/_/g, ' '));
          setStatus((toolLabels[evt.name] || evt.name) + '…');
          usedTools.push(evt.name);
          scrollBottom();
        }

        if (evt.type === 'text') {
          if (!bubble) {
            addActivity('✍️', 'Generating response…');
            removeActivity();
            // Remove completed tool indicators (spinner done)
            wrap.querySelectorAll('.tool-indicator .spinner').forEach(s => {
              s.style.animation = 'none';
              s.style.borderColor = 'var(--tool-text)';
            });
            bubble = document.createElement('div');
            bubble.className = 'bubble';
            cursorEl = document.createElement('span');
            cursorEl.className = 'cursor';
            bubble.appendChild(cursorEl);
            wrap.appendChild(bubble);
            // Finalise think label
            if (thinkBlock) {
              thinkBlock.querySelector('.think-label').textContent = 'Thought process';
              thinkBlock.classList.remove('open'); // collapse after done streaming
            }
          }
          contentText += evt.delta;
          // Insert rendered text before cursor
          bubble.innerHTML = renderMarkdown(contentText);
          bubble.appendChild(cursorEl);
          setStatus('Streaming…');
          scrollBottom();
        }

        if (evt.type === 'done') {
          if (cursorEl) cursorEl.remove();
          if (bubble) bubble.innerHTML = renderMarkdown(contentText);
          // Add TTS on assistant
          const actions = document.createElement('div');
          actions.className = 'msg-actions';
          const ttsBtn = document.createElement('button');
          ttsBtn.className = 'btn-tts';
          ttsBtn.textContent = '🔊';
          ttsBtn.title = 'Play TTS';
          const captured = contentText;
          ttsBtn.onclick = () => playTTS(captured, ttsBtn);
          actions.appendChild(ttsBtn);
          wrap.appendChild(actions);
          addWriteBadges(wrap, usedTools);
          // Add regen button on the user message
          addRegenToUserMsg(userMsgDiv);
          setStatus('Ready');
          scrollBottom();
        }
      }
    }
  } catch (err) {
    removeActivity();
    const errBubble = document.createElement('div');
    errBubble.className = 'bubble';
    errBubble.style.color = '#ff6666';
    errBubble.textContent = `Error: ${err.message}`;
    wrap.appendChild(errBubble);
    // Add regen button on the user message
    addRegenToUserMsg(userMsgDiv);
    setStatus('Error');
  } finally {
    isStreaming = false;
    releaseWakeLock();
    document.getElementById('send-btn').disabled = false;
    document.querySelector('.avatar').classList.remove('active');
    input.focus();
  }
}

// ---------------------------------------------------------------------------
// History load (paginated — last 50 messages initially)
// ---------------------------------------------------------------------------
const HISTORY_PAGE_SIZE = 50;
let oldestLoadedId = null;   // tracks cursor for "load more"
let hasMoreHistory  = false; // whether older messages exist

function renderMessageToContainer(m, container) {
  if (m.role === 'user') {
    appendUserMessage(m.content, m.ts);
  } else if (m.content === '[THREAD_BREAK]') {
    const divider = document.createElement('div');
    divider.className = 'thread-divider';
    divider.textContent = 'new thread';
    container.appendChild(divider);
  } else if (m.role === 'assistant') {
    const wrap = createAssistantMessage(m.ts);
    if (m.thinking) {
      const tb = createThinkBlock();
      tb.querySelector('.think-content').textContent = m.thinking;
      tb.querySelector('.think-label').textContent = 'Thought process';
      tb.classList.remove('open');
      wrap.appendChild(tb);
    }
    const b = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = renderMarkdown(m.content);
    wrap.appendChild(b);
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    const ttsBtn = document.createElement('button');
    ttsBtn.className = 'btn-tts';
    ttsBtn.textContent = '🔊';
    const captured = m.content;
    ttsBtn.onclick = () => playTTS(captured, ttsBtn);
    actions.appendChild(ttsBtn);
    wrap.appendChild(actions);
    if (m.tools_used) {
      addWriteBadges(wrap, m.tools_used.split(','));
    }
  }
}

function insertLoadMoreButton() {
  const container = document.getElementById('messages');
  // Remove any existing load-more button
  const existing = container.querySelector('.load-more-wrap');
  if (existing) existing.remove();
  if (!hasMoreHistory) return;
  const wrapDiv = document.createElement('div');
  wrapDiv.className = 'load-more-wrap';
  const btn = document.createElement('button');
  btn.className = 'btn-load-more';
  btn.textContent = '↑ Load older messages';
  btn.onclick = loadOlderMessages;
  wrapDiv.appendChild(btn);
  container.insertBefore(wrapDiv, container.firstChild);
}

async function loadHistory() {
  try {
    const resp = await fetch(`${API_BASE}/history?limit=${HISTORY_PAGE_SIZE}`, { headers: headers() });
    if (!resp.ok) return;
    const msgs = await resp.json();
    const container = document.getElementById('messages');
    container.innerHTML = '';

    // Track pagination cursor
    if (msgs.length > 0) {
      oldestLoadedId = msgs[0].id;
      hasMoreHistory = msgs.length >= HISTORY_PAGE_SIZE;
    } else {
      oldestLoadedId = null;
      hasMoreHistory = false;
    }

    // Show "load more" button if there are likely older messages
    insertLoadMoreButton();

    for (const m of msgs) {
      renderMessageToContainer(m, container);
    }
    // Add regen button to the last user message only
    const allUser = container.querySelectorAll('.msg.user');
    if (allUser.length > 0) {
      addRegenToUserMsg(allUser[allUser.length - 1]);
    }
    scrollBottom();
  } catch (e) {
    console.warn('Could not load history:', e);
  }
}

async function loadOlderMessages() {
  if (!oldestLoadedId || !hasMoreHistory) return;
  const btn = document.querySelector('.btn-load-more');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }

  try {
    const resp = await fetch(
      `${API_BASE}/history?limit=${HISTORY_PAGE_SIZE}&before=${oldestLoadedId}`,
      { headers: headers() }
    );
    if (!resp.ok) return;
    const msgs = await resp.json();
    if (msgs.length === 0) {
      hasMoreHistory = false;
      const wrap = document.querySelector('.load-more-wrap');
      if (wrap) wrap.remove();
      return;
    }

    // Update cursor
    oldestLoadedId = msgs[0].id;
    hasMoreHistory = msgs.length >= HISTORY_PAGE_SIZE;

    const container = document.getElementById('messages');
    // Remember scroll position so we can restore it after prepending
    const prevScrollHeight = container.scrollHeight;

    // Remove existing load-more button before prepending
    const existingBtn = container.querySelector('.load-more-wrap');
    if (existingBtn) existingBtn.remove();

    // Build a document fragment with the older messages
    // We need to temporarily append to container to reuse render helpers,
    // then move those nodes to the top.
    const marker = document.createElement('div');
    marker.id = '_load-more-marker';
    container.appendChild(marker);

    for (const m of msgs) {
      renderMessageToContainer(m, container);
    }

    // Collect all nodes that were appended after the marker
    const newNodes = [];
    let node = marker.nextSibling;
    while (node) {
      newNodes.push(node);
      node = node.nextSibling;
    }
    marker.remove();

    // Find the first real message (skip old load-more button position)
    const firstChild = container.firstChild;
    for (const n of newNodes) {
      container.insertBefore(n, firstChild);
    }

    // Re-insert load-more button at top if more history exists
    insertLoadMoreButton();

    // Restore scroll position so the user stays where they were
    container.scrollTop = container.scrollHeight - prevScrollHeight;

  } catch (e) {
    console.warn('Could not load older messages:', e);
  }
}

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------
// History clear removed from UI — use DELETE /history API directly if needed.

function addRegenToUserMsg(userMsgDiv) {
  // Remove any existing regen button from other user messages
  document.querySelectorAll('.msg.user .btn-regen').forEach(b => b.remove());
  // Add regen actions to this user message
  let actions = userMsgDiv.querySelector('.msg-actions');
  if (!actions) {
    actions = document.createElement('div');
    actions.className = 'msg-actions';
    userMsgDiv.appendChild(actions);
  }
  const regenBtn = document.createElement('button');
  regenBtn.className = 'btn-regen';
  regenBtn.textContent = '🔄';
  regenBtn.title = 'Regenerate response';
  regenBtn.onclick = () => regenerateResponse(userMsgDiv);
  actions.appendChild(regenBtn);
}

async function regenerateResponse(userMsgDiv) {
  if (isStreaming) return;
  // Remove the assistant message(s) following this user message
  let next = userMsgDiv.nextElementSibling;
  while (next && next.classList.contains('msg') && next.classList.contains('assistant')) {
    const toRemove = next;
    next = next.nextElementSibling;
    toRemove.remove();
  }
  // Remove the regen button from this user message
  const oldBtn = userMsgDiv.querySelector('.btn-regen');
  if (oldBtn) oldBtn.remove();

  isStreaming = true;
  document.getElementById('send-btn').disabled = true;
  document.querySelector('.avatar').classList.add('active');
  setStatus('Regenerating…');
  await requestWakeLock();

  const wrap = createAssistantMessage();
  const actLog = document.createElement('div');
  actLog.className = 'activity-log';
  wrap.appendChild(actLog);
  let actRemoved = false;

  function addActivity(icon, text, isDone = false) {
    const prev = actLog.querySelector('.activity-step:last-child');
    if (prev) prev.classList.add('done');
    const step = document.createElement('div');
    step.className = 'activity-step';
    step.innerHTML = icon
      ? `<span class="step-icon">${icon}</span><span>${text}</span>`
      : `<div class="step-dot"></div><span>${text}</span>`;
    if (isDone) step.classList.add('done');
    actLog.appendChild(step);
    scrollBottom();
  }

  function removeActivity() {
    if (!actRemoved) { actLog.remove(); actRemoved = true; }
  }

  addActivity('🔄', 'Regenerating response…');
  let thinkBlock = null;
  let thinkContent = null;
  let bubble = null;
  let contentText = '';
  let cursorEl = null;
  const usedTools = [];

  try {
    const resp = await fetch(`${API_BASE}/regenerate`, {
      method: 'POST',
      headers: headers(),
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let evt;
        try { evt = JSON.parse(line.slice(6)); } catch { continue; }
        lastStreamActivity = Date.now();

        if (evt.type === 'status') addActivity(null, evt.msg);

        if (evt.type === 'thinking') {
          if (!thinkBlock) {
            addActivity('🧠', 'Model thinking…');
            thinkBlock = createThinkBlock();
            thinkContent = thinkBlock.querySelector('.think-content');
            if (bubble) wrap.insertBefore(thinkBlock, bubble);
            else wrap.appendChild(thinkBlock);
          }
          thinkContent.textContent += evt.delta;
          thinkContent.scrollTop = thinkContent.scrollHeight;
          scrollBottom();
        }

        if (evt.type === 'tool') {
          const toolLabels = {
            search_vault: 'Searching vault', recall_specific_memory: 'Reading memory',
            read_journal_entry: 'Reading journal', read_recent_journal_entries: 'Reviewing recent journal',
            write_journal_entry: 'Writing journal entry', log_context_fact: 'Logging context fact',
            update_context_fact: 'Updating context fact', generate_image: 'Generating image',
            sync_context_memory: 'Syncing memory',
          };
          addActivity('⚙️', toolLabels[evt.name] || evt.name.replace(/_/g, ' '));
          setStatus((toolLabels[evt.name] || evt.name) + '…');
          usedTools.push(evt.name);
        }

        if (evt.type === 'text') {
          if (!bubble) {
            addActivity('✍️', 'Generating response…');
            removeActivity();
            bubble = document.createElement('div');
            bubble.className = 'bubble';
            cursorEl = document.createElement('span');
            cursorEl.className = 'cursor';
            bubble.appendChild(cursorEl);
            wrap.appendChild(bubble);
            if (thinkBlock) {
              thinkBlock.querySelector('.think-label').textContent = 'Thought process';
              thinkBlock.classList.remove('open');
            }
          }
          contentText += evt.delta;
          bubble.innerHTML = renderMarkdown(contentText);
          bubble.appendChild(cursorEl);
          setStatus('Streaming…');
          scrollBottom();
        }

        if (evt.type === 'done') {
          if (cursorEl) cursorEl.remove();
          if (bubble) bubble.innerHTML = renderMarkdown(contentText);
          const actions = document.createElement('div');
          actions.className = 'msg-actions';
          const ttsBtn = document.createElement('button');
          ttsBtn.className = 'btn-tts';
          ttsBtn.textContent = '🔊';
          const captured = contentText;
          ttsBtn.onclick = () => playTTS(captured, ttsBtn);
          actions.appendChild(ttsBtn);
          wrap.appendChild(actions);
          addWriteBadges(wrap, usedTools);
          // Add regen to user message
          addRegenToUserMsg(userMsgDiv);
          setStatus('Ready');
          scrollBottom();
        }
      }
    }
  } catch (err) {
    removeActivity();
    const errBubble = document.createElement('div');
    errBubble.className = 'bubble';
    errBubble.style.color = '#ff6666';
    errBubble.textContent = `Error: ${err.message}`;
    wrap.appendChild(errBubble);
    addRegenToUserMsg(userMsgDiv);
    setStatus('Error');
  } finally {
    isStreaming = false;
    releaseWakeLock();
    document.getElementById('send-btn').disabled = false;
    document.querySelector('.avatar').classList.remove('active');
  }
}

async function syncMemory() {
  const btn = document.getElementById('sync-btn');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = '⟳ Syncing…';
  btn.style.borderColor = 'var(--accent)';
  btn.style.color = 'var(--accent)';
  try {
    const resp = await fetch(`${API_BASE}/sync`, { method: 'POST', headers: headers() });
    const data = await resp.json();
    btn.textContent = '✓ Sync started';
    btn.style.borderColor = 'var(--tool-text)';
    btn.style.color = 'var(--tool-text)';
  } catch (e) {
    btn.textContent = '✗ Sync failed';
    btn.style.borderColor = '#ff6666';
    btn.style.color = '#ff6666';
  } finally {
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = '⟳ Sync';
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 4000);
  }
}

async function newThread() {
  const btn = document.getElementById('new-thread-btn');
  if (btn.disabled || isStreaming) return;
  btn.disabled = true;
  btn.textContent = '✦ Starting…';
  btn.style.borderColor = 'var(--accent)';
  btn.style.color = 'var(--accent)';
  try {
    const resp = await fetch(`${API_BASE}/new_thread`, { method: 'POST', headers: headers() });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    // Insert a visual divider in the current chat
    const divider = document.createElement('div');
    divider.className = 'thread-divider';
    divider.textContent = 'new thread';
    document.getElementById('messages').appendChild(divider);
    scrollBottom();
    btn.textContent = '✓ Thread started';
    btn.style.borderColor = 'var(--tool-text)';
    btn.style.color = 'var(--tool-text)';
  } catch (e) {
    btn.textContent = '✗ Failed';
    btn.style.borderColor = '#ff6666';
    btn.style.color = '#ff6666';
  } finally {
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = '✦ New Thread';
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 3000);
  }
}

document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 150) + 'px';
});
document.getElementById('send-btn').addEventListener('click', sendMessage);



// ---------------------------------------------------------------------------
// Visibility recovery — reload history only if the SSE stream is truly dead
// ---------------------------------------------------------------------------
let lastStreamActivity = 0;  // timestamp of last SSE data received

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && isStreaming) {
    // Page came back while we think we're streaming.
    // Only recover if no SSE data arrived in the last 5 seconds — a sign
    // the connection actually died while backgrounded.
    const staleSec = (Date.now() - lastStreamActivity) / 1000;
    if (staleSec < 5) return;  // Stream still alive, don't touch the DOM

    setTimeout(async () => {
      if (isStreaming) {
        console.log(`[Recovery] Stream stale ${staleSec.toFixed(1)}s — reloading history`);
        isStreaming = false;
        releaseWakeLock();
        document.getElementById('send-btn').disabled = false;
        document.querySelector('.avatar').classList.remove('active');
        setStatus('Reconnected');
        await loadHistory();
        setStatus('Ready');
      }
    }, 2000);
  }
});

// API key prompt if not set
if (!API_KEY && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
  const key = prompt('Enter your Evelyn API key (X-Evelyn-Key):');
  if (key) { localStorage.setItem('evelyn_api_key', key); location.reload(); }
}

// Init
loadHistory();
