<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evelyn - Dev UI</title>
  <link rel="icon" type="image/x-icon" href="/ui/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d12;
      --surface: #13131c;
      --surface2: #1a1a28;
      --border: #2a2a40;
      --accent: #7c6af7;
      --text: #e8e8f0;
      --text-dim: #8888aa;
      --success: #34d399;
      --danger: #f87171;
      --warning: #fbbf24;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 15px;
      line-height: 1.5; padding-bottom: 50px;
    }
    header {
      padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;
    }
    h1 { font-size: 18px; font-weight: 500; }
    .back-btn {
      color: var(--text-dim); text-decoration: none; font-size: 14px;
      background: var(--surface2); padding: 6px 12px; border-radius: 6px; transition: color 0.2s;
    }
    .back-btn:hover { color: #fff; }
    
    .tabs {
      display: flex; gap: 8px; padding: 16px 20px; background: var(--bg);
    }
    .tab-btn {
      background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border);
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500;
      transition: all 0.2s; flex: 1; text-align: center;
    }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    
    main { padding: 0 20px; max-width: 850px; margin: 0 auto; }
    
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 12px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-dim); }
    .badge { background: var(--surface2); padding: 2px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* Badges & tabs color */
    .badge.recategorize { color: var(--warning); }
    .badge.merge { color: var(--accent); }
    .badge.extraction { color: var(--success); }
    
    .badge.planning { color: #818cf8; }
    .badge.searching { color: #60a5fa; }
    .badge.evaluating { color: #f472b6; }
    .badge.synthesizing { color: #c084fc; }
    .badge.done { color: var(--success); }
    .badge.error { color: var(--danger); }
    .badge.cancelled { color: var(--text-dim); }
    .badge.paused { color: var(--warning); }
    .badge.queued { color: #38bdf8; }
    
    .card-body { font-size: 15px; }
    .card-body textarea {
      width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 12px; border-radius: 8px; font-family: inherit; font-size: 14px; resize: vertical; min-height: 80px;
    }
    
    .source-list {
      background: var(--surface2); border-radius: 8px; padding: 12px;
      font-size: 13px; color: var(--text-dim); margin-top: 8px;
    }
    .source-item { padding: 4px 0; border-bottom: 1px solid var(--border); }
    .source-item:last-child { border-bottom: none; }
    
    .card-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn {
      flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer;
      font-weight: 500; font-size: 14px; transition: opacity 0.2s; text-align: center;
    }
    .btn:hover { opacity: 0.8; }
    .btn-approve { background: var(--success); color: #000; }
    .btn-reject { background: var(--danger); color: #000; }
    .btn-edit { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-action { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-start-now { background: #d97706; color: #fff; }
    
    .research-form {
      display: flex; gap: 10px; margin-bottom: 20px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius); padding: 16px;
      align-items: center; flex-wrap: wrap;
    }
    .research-form input {
      flex: 2; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 10px 12px; border-radius: 8px; font-family: inherit; font-size: 14px; outline: none;
      min-width: 250px;
    }
    .research-form select {
      flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 10px; border-radius: 8px; font-family: inherit; font-size: 14px; outline: none;
      min-width: 130px;
    }
    .research-form button {
      background: var(--accent); color: #fff; border: none; padding: 10px 20px;
      border-radius: 8px; cursor: pointer; font-weight: 500; transition: opacity 0.2s;
    }
    .research-form button:hover { opacity: 0.9; }
    
    /* Modal styles */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      width: 100%; max-width: 900px; max-height: 90vh; display: flex; flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex;
      justify-content: space-between; align-items: center;
    }
    .modal-title { font-size: 16px; font-weight: 600; }
    .close-btn {
      background: none; border: none; color: var(--text-dim); font-size: 24px;
      cursor: pointer; line-height: 1; transition: color 0.2s;
    }
    .close-btn:hover { color: #fff; }
    .modal-body {
      padding: 20px; overflow-y: auto; flex: 1; font-size: 15px; line-height: 1.6;
      color: var(--text); font-family: inherit;
    }
    .modal-body h1, .modal-body h2, .modal-body h3 { margin-top: 16px; margin-bottom: 8px; font-weight: 600; color: #fff; }
    .modal-body h1 { font-size: 22px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .modal-body h2 { font-size: 18px; }
    .modal-body h3 { font-size: 15px; }
    .modal-body p { margin-bottom: 12px; }
    .modal-body ul, .modal-body ol { padding-left: 20px; margin-bottom: 12px; }
    .modal-body li { margin-bottom: 4px; }
    .modal-body code { background: var(--surface2); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: var(--warning); }
    .modal-body pre { background: var(--surface2); padding: 12px; border-radius: 8px; overflow-x: auto; margin-bottom: 12px; border: 1px solid var(--border); }
    .modal-body pre code { background: none; padding: 0; color: inherit; }
    
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
    .progress-bar-container {
      width: 100%; background: var(--surface2); height: 6px; border-radius: 3px; overflow: hidden; margin-top: 6px;
    }
    .progress-bar-fill {
      height: 100%; background: var(--accent); transition: width 0.4s ease;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="header-title">Review Queue</h1>
    <div style="display: flex; gap: 8px; align-items: center;">
      <button class="back-btn" onclick="loadData()" style="cursor: pointer; border: none; font-family: inherit;">⟳ Refresh</button>
      <a href="/ui/" class="back-btn">← Back to Chat</a>
    </div>
  </header>
  
  <div class="tabs">
    <button class="tab-btn active" id="tab-extractions" onclick="switchTab('extractions')">Extractions (<span id="count-ext">0</span>)</button>
    <button class="tab-btn" id="tab-proposals" onclick="switchTab('proposals')">Proposals (<span id="count-prop">0</span>)</button>
    <button class="tab-btn" id="tab-profile-updates" onclick="switchTab('profile_updates')">Profile Updates (<span id="count-prof-up">0</span>)</button>
    <button class="tab-btn" id="tab-procedures" onclick="switchTab('procedures')">Procedures (<span id="count-proc">0</span>)</button>
    <button class="tab-btn" id="tab-research" onclick="switchTab('research')">Deep Research (<span id="count-res">0</span>)</button>
  </div>
  
  <main id="container">
    <div class="empty-state">Loading...</div>
  </main>

  <!-- Modal for Report -->
  <div class="modal" id="report-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="report-modal-title">Research Report</span>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="report-modal-body"></div>
    </div>
  </div>

  <!-- Modal for Guidance -->
  <div class="modal" id="guidance-modal">
    <div class="modal-content" style="max-width: 800px;">
      <div class="modal-header">
        <span class="modal-title">Sub-Question Refinement</span>
        <button class="close-btn" onclick="closeGuidanceModal()">&times;</button>
      </div>
      <div class="modal-body" id="guidance-sq-container" style="display: flex; flex-direction: column; gap: 15px;">
        <!-- SQs dynamically injected here -->
      </div>
      <div class="modal-header" style="border-top: 1px solid var(--border); border-bottom: none; display: flex; justify-content: flex-end; gap: 10px;">
        <button class="btn btn-reject" onclick="closeGuidanceModal()">Cancel</button>
        <button class="btn btn-action" id="guidance-finalize-btn" style="max-width: 250px;">Finalize & Queue Task</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    const API_KEY = localStorage.getItem('evelyn_api_key') || '';
    let currentTab = 'extractions';
    let extractions = [];
    let proposals = [];
    let researchTasks = [];
    let procedures = [];
    let pollInterval = null;

    function headers() {
      return { 'Content-Type': 'application/json', 'X-Evelyn-Key': API_KEY };
    }

    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // A simple, very lightweight Markdown parser to render reports beautifully
    function renderMarkdown(md) {
      if (!md) return '';
      let html = escapeHtml(md);
      
      // Headers
      html = html.replace(/^### (.*?)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.*?)$/gm, '<h1>$1</h1>');
      
      // Bold & Italic
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
      
      // Inline Code
      html = html.replace(/`(.*?)`/g, '<code>$1</code>');
      
      // Preblocks (Code block)
      html = html.replace(/```(.*?)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
      
      // Unordered lists
      html = html.replace(/^\s*-\s+(.*?)$/gm, '<li>$1</li>');
      
      // Fix list nesting
      html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
      
      // Paragraphs (split by double newlines)
      html = html.replace(/\n\n/g, '</p><p>');
      html = '<p>' + html + '</p>';
      
      return html;
    }

    async function loadData() {
      try {
        const [resExt, resProp, resRes, resProc] = await Promise.all([
          fetch(`${API_BASE}/api/review/extractions`, { headers: headers() }),
          fetch(`${API_BASE}/api/review/proposals`, { headers: headers() }),
          fetch(`${API_BASE}/research/list`, { headers: headers() }),
          fetch(`${API_BASE}/api/review/procedures`, { headers: headers() })
        ]);
        if (resExt.ok) extractions = await resExt.json();
        if (resProp.ok) proposals = await resProp.json();
        if (resRes.ok) researchTasks = await resRes.json();
        if (resProc.ok) procedures = await resProc.json();
        
        const normalProposals = proposals.filter(p => p.type !== 'profile_update');
        const profileUpdates = proposals.filter(p => p.type === 'profile_update');

        document.getElementById('count-ext').textContent = extractions.length;
        document.getElementById('count-prop').textContent = normalProposals.length;
        document.getElementById('count-prof-up').textContent = profileUpdates.length;
        document.getElementById('count-proc').textContent = procedures.length;
        document.getElementById('count-res').textContent = researchTasks.length;
        
        render();
      } catch (e) {
        document.getElementById('container').innerHTML = `<div class="empty-state">Error loading data.</div>`;
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-extractions').classList.toggle('active', tab === 'extractions');
      document.getElementById('tab-proposals').classList.toggle('active', tab === 'proposals');
      document.getElementById('tab-profile-updates').classList.toggle('active', tab === 'profile_updates');
      document.getElementById('tab-procedures').classList.toggle('active', tab === 'procedures');
      document.getElementById('tab-research').classList.toggle('active', tab === 'research');
      
      const title = document.getElementById('header-title');
      if (tab === 'extractions') title.textContent = 'Review Queue';
      else if (tab === 'proposals') title.textContent = 'Proposals Queue';
      else if (tab === 'profile_updates') title.textContent = 'Profile & Persona Updates';
      else if (tab === 'procedures') title.textContent = 'Procedures Review';
      else title.textContent = 'Deep Research Dashboard';
      
      // Clear or set polling (relaxed to 20s to prevent API/DB polling overhead)
      if (tab === 'research') {
        if (!pollInterval) {
          pollInterval = setInterval(loadData, 20000);
        }
      } else {
        if (pollInterval) {
          clearInterval(pollInterval);
          pollInterval = null;
        }
      }

      render();
    }

    async function handleAction(type, id, action) {
      const endpoint = `${API_BASE}/api/review/${type}/${id}/${action}`;
      let body = null;
      
      if (action === 'edit' && type === 'extractions') {
        const obs = document.getElementById(`obs-${id}`).value;
        body = JSON.stringify({ observation: obs });
      }
      
      try {
        const res = await fetch(endpoint, { method: 'POST', headers: headers(), body });
        if (res.ok) {
          if (type === 'extractions') {
            extractions = extractions.filter(x => x.id !== id);
            document.getElementById('count-ext').textContent = extractions.length;
          } else {
            proposals = proposals.filter(x => x.id !== id);
            document.getElementById('count-prop').textContent = proposals.length;
          }
          render();
        } else {
          alert('Action failed.');
        }
      } catch (e) {
        alert('Network error.');
      }
    }

    async function handleProcedureAction(id, action) {
      const endpoint = `${API_BASE}/api/review/procedures/${id}/${action}`;
      let body = null;
      
      if (action === 'approve') {
        const trigger = document.getElementById(`proc-trigger-${id}`).value.trim();
        const steps = document.getElementById(`proc-steps-${id}`).value.trim();
        const pitfalls = document.getElementById(`proc-pitfalls-${id}`).value.trim();
        const verification = document.getElementById(`proc-verification-${id}`).value.trim();
        const tags = document.getElementById(`proc-tags-${id}`).value.trim();
        
        body = JSON.stringify({
          trigger_pattern: trigger,
          steps: steps,
          pitfalls: pitfalls || null,
          verification: verification || null,
          tags: tags || null
        });
      }
      
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: headers(),
          body: body
        });
        if (res.ok) {
          procedures = procedures.filter(p => p.id !== id);
          document.getElementById('count-proc').textContent = procedures.length;
          render();
        } else {
          alert('Action failed.');
        }
      } catch (e) {
        alert('Network error.');
      }
    }

    // Research Management actions
    async function startResearchTask() {
      const query = document.getElementById('research-query').value.trim();
      const scope = document.getElementById('research-scope').value;
      if (!query) {
        alert('Please enter a research query.');
        return;
      }
      
      try {
        const res = await fetch(`${API_BASE}/research/start`, {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ query, scope })
        });
        if (res.ok) {
          document.getElementById('research-query').value = '';
          loadData();
        } else {
          alert('Failed to start research.');
        }
      } catch (e) {
        alert('Network error starting research.');
      }
    }

    async function cancelResearchTask(taskId) {
      if (!confirm('Are you sure you want to cancel this research task?')) return;
      try {
        const res = await fetch(`${API_BASE}/research/cancel/${taskId}`, { method: 'POST', headers: headers() });
        if (res.ok) {
          loadData();
        } else {
          alert('Failed to cancel research task.');
        }
      } catch (e) {
        alert('Network error cancelling task.');
      }
    }

    async function deleteResearchTask(taskId) {
      if (!confirm('Are you sure you want to permanently delete this research task and all its files from disk?')) return;
      try {
        const res = await fetch(`${API_BASE}/research/delete/${taskId}`, { method: 'POST', headers: headers() });
        if (res.ok) {
          loadData();
        } else {
          alert('Failed to delete research task.');
        }
      } catch (e) {
        alert('Network error deleting task.');
      }
    }

    async function resumeResearchTask(taskId) {
      try {
        const res = await fetch(`${API_BASE}/research/resume/${taskId}`, { method: 'POST', headers: headers() });
        if (res.ok) {
          loadData();
        } else {
          alert('Failed to resume research task.');
        }
      } catch (e) {
        alert('Network error resuming task.');
      }
    }

    async function startNowResearchTask(taskId) {
      try {
        const res = await fetch(`${API_BASE}/research/start-now/${taskId}`, { method: 'POST', headers: headers() });
        if (res.ok) {
          loadData();
        } else {
          const err = await res.json().catch(() => ({}));
          alert(`Failed to start task: ${err.detail || res.statusText}`);
        }
      } catch (e) {
        alert('Network error starting task.');
      }
    }

    async function restartResearchTask(taskId, query, scope) {
      if (!confirm(`Are you sure you want to completely restart the research for: "${query}"?\nThis will remove the current quarantined task and create a brand new one.`)) return;
      try {
        // First delete the old one
        await fetch(`${API_BASE}/research/delete/${taskId}`, { method: 'POST', headers: headers() });
        
        // Then start a new one
        const res = await fetch(`${API_BASE}/research/start`, {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ query: query, scope: scope })
        });
        
        if (res.ok) {
          loadData();
        } else {
          alert('Failed to restart task.');
        }
      } catch (e) {
        alert('Network error restarting task.');
      }
    }

    async function readReport(taskId, topic) {
      try {
        const res = await fetch(`${API_BASE}/research/report/${taskId}`, { headers: headers() });
        if (res.ok) {
          const data = await res.json();
          document.getElementById('report-modal-title').textContent = `Report: ${topic}`;
          document.getElementById('report-modal-body').innerHTML = renderMarkdown(data.report);
          document.getElementById('report-modal').style.display = 'flex';
        } else {
          alert('Report not synthesized yet or task failed.');
        }
      } catch (e) {
        alert('Network error fetching report.');
      }
    }

    function closeModal() {
      document.getElementById('report-modal').style.display = 'none';
    }

    let currentGuidanceTaskId = null;
    
    function openGuidanceModal(taskId) {
      currentGuidanceTaskId = taskId;
      const task = researchTasks.find(t => t.task_id === taskId);
      if (!task || !task.plan || !task.plan.sub_questions) return;
      
      const container = document.getElementById('guidance-sq-container');
      container.innerHTML = '';
      
      if ((task.limit_warnings || []).includes('total_sources_cap_reached')) {
        container.innerHTML = `
          <div style="background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 8px; padding: 12px; margin-bottom: 12px; color: #f87171; font-size: 13.5px; line-height: 1.4;">
            <strong>⚠️ Scraper Cap Hit (100 Sources):</strong> The overall task limit has been reached. Evelyn cannot extract from new sources. Removing unnecessary sub-questions will automatically recalculate and free up source budget.
          </div>
        `;
      }
      
      task.plan.sub_questions.forEach(sq => {
        let badgeColor = '#6b7280';
        if (sq.confidence >= 80) badgeColor = 'var(--success)';
        else if (sq.confidence > 0 || sq.status === 'needs_guidance') badgeColor = 'var(--warning)';
        else if (sq.status === 'removed') badgeColor = 'var(--danger)';
        else if (sq.status === 'split') badgeColor = 'var(--accent)';
        
        let gapsHtml = '';
        if (sq.gaps && sq.gaps.length > 0) {
          gapsHtml = `<div style="font-size: 13px; color: var(--danger); margin-top: 6px;"><strong>Identified Gaps:</strong><ul style="margin: 4px 0 0 20px;">${sq.gaps.map(g => `<li>${escapeHtml(g)}</li>`).join('')}</ul></div>`;
        }
        
        let reasonHtml = '';
        if (sq.removed_reason) {
          reasonHtml = `<div style="font-size: 13px; color: var(--danger); margin-top: 6px;"><strong>Removed Reason:</strong> ${escapeHtml(sq.removed_reason)}</div>`;
        } else if (sq.split_reason) {
          reasonHtml = `<div style="font-size: 13px; color: var(--accent); margin-top: 6px;"><strong>Split Reason:</strong> ${escapeHtml(sq.split_reason)}</div>`;
        }
        
        let warningsHtml = '';
        if (sq.limit_warnings && sq.limit_warnings.length > 0) {
          warningsHtml = sq.limit_warnings.map(w => {
            let txt = w;
            if (w === 'depth_cap_reached') txt = 'Search depth exhausted without meeting confidence threshold.';
            else if (w === 'source_cap_reached') txt = 'Maximum source limit per sub-question reached.';
            return `<div style="font-size: 13px; color: #f87171; margin-top: 4px; font-weight: 500;">⚠️ ${escapeHtml(txt)}</div>`;
          }).join('');
        }
        
        container.innerHTML += `
          <div style="background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim);">
              <span class="badge" style="background: ${badgeColor}; color: #fff;">${escapeHtml((sq.status || 'pending').toUpperCase())} (${sq.confidence || 0}%)</span>
              <span>Depth: ${sq.search_depth || 0} | Sources: ${sq.source_count || 0}</span>
            </div>

    async function saveSqRewrite(taskId, sqId) {
      const ta = document.getElementById(`sq-edit-${sqId}`);
      const btn = document.getElementById(`sq-save-${sqId}`);
      const newQuestion = ta.value.trim();
      if (!newQuestion || newQuestion === ta.dataset.original) return;
      
      btn.disabled = true;
      btn.textContent = 'Saving...';
      
      try {
        const res = await fetch(`${API_BASE}/research/guide/${taskId}/rewrite`, {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ sq_id: sqId, new_question: newQuestion })
        });
        if (res.ok) {
          ta.dataset.original = newQuestion;
          btn.textContent = 'Saved!';
          btn.style.background = 'var(--success)';
          btn.style.color = '#000';
          setTimeout(() => {
            btn.textContent = 'Save Rewrite';
            btn.style.background = 'var(--surface2)';
            btn.style.color = 'var(--text)';
            btn.disabled = true;
          }, 2000);
          
          // Also update the local state to reflect it so refreshing doesn't overwrite immediately
          const task = researchTasks.find(t => t.task_id === taskId);
          if (task) {
             const sq = task.plan.sub_questions.find(s => s.id === sqId);
             if (sq) {
                 sq.question = newQuestion;
                 sq.status = "pending";
                 sq.search_depth = 0;
                 sq.gaps = [];
             }
          }
        } else {
          alert('Failed to save rewrite.');
          btn.disabled = false;
          btn.textContent = 'Save Rewrite';
        }
      } catch (e) {
        alert('Network error saving rewrite.');
        btn.disabled = false;
        btn.textContent = 'Save Rewrite';
      }
    }

    async function removeSubQuestion(taskId, sqId) {
      if (!confirm("Are you sure you want to remove this sub-question? This will discard it entirely from the research plan and delete any partial notes collected for it.")) return;
      
      const btn = document.getElementById(`sq-remove-${sqId}`);
      btn.disabled = true;
      btn.textContent = 'Removing...';
      
      try {
        const res = await fetch(`${API_BASE}/research/guide/${taskId}/remove`, {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ sq_id: sqId })
        });
        if (res.ok) {
          // Find container and remove it nicely
          const ta = document.getElementById(`sq-edit-${sqId}`);
          if (ta) {
             const container = ta.closest('div[style*="margin-bottom"]');
             if (container) {
                container.style.transition = 'all 0.3s ease';
                container.style.opacity = '0';
                setTimeout(() => container.remove(), 300);
             } else {
                // fallback to parent element with background
                const pContainer = ta.parentElement;
                if (pContainer) {
                   pContainer.style.transition = 'all 0.3s ease';
                   pContainer.style.opacity = '0';
                   setTimeout(() => pContainer.remove(), 300);
                }
             }
          }
          
          // Update the local state
          const task = researchTasks.find(t => t.task_id === taskId);
          if (task) {
             task.plan.sub_questions = task.plan.sub_questions.filter(s => s.id !== sqId);
          }
        } else {
          alert('Failed to remove sub-question.');
          btn.disabled = false;
          btn.textContent = 'Remove Question';
        }
      } catch (e) {
        alert('Network error removing sub-question.');
        btn.disabled = false;
        btn.textContent = 'Remove Question';
      }
    }

    function renderDiff(original, proposed) {
      if (!original) return `<pre style="white-space: pre-wrap; word-break: break-all; color: var(--success);">${escapeHtml(proposed)}</pre>`;
      
      const origLines = original.split('\n');
      const propLines = proposed.split('\n');
      
      let html = '<div class="diff-container" style="font-family: monospace; font-size: 13px; background: #07070a; border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; line-height: 1.6;">';
      
      let i = 0, j = 0;
      while (i < origLines.length || j < propLines.length) {
        const oLine = origLines[i];
        const pLine = propLines[j];
        
        if (oLine === pLine) {
          html += `<div class="diff-line" style="color: var(--text-dim); white-space: pre-wrap;">  ${escapeHtml(oLine)}</div>`;
          i++;
          j++;
        } else {
          // Find matches down the line
          let foundMatch = false;
          let lookAhead = 10;
          for (let k = 1; k < lookAhead; k++) {
            if (i + k < origLines.length && origLines[i+k] === pLine && pLine.trim() !== "") {
              for (let m = 0; m < k; m++) {
                html += `<div class="diff-line" style="background: rgba(248,113,113,0.15); color: #fca5a5; white-space: pre-wrap;">- ${escapeHtml(origLines[i+m])}</div>`;
              }
              i += k;
              foundMatch = true;
              break;
            }
            if (j + k < propLines.length && propLines[j+k] === oLine && oLine.trim() !== "") {
              for (let m = 0; m < k; m++) {
                html += `<div class="diff-line" style="background: rgba(52,211,153,0.15); color: #a7f3d0; white-space: pre-wrap;">+ ${escapeHtml(propLines[j+m])}</div>`;
              }
              j += k;
              foundMatch = true;
              break;
            }
          }
          if (!foundMatch) {
            if (i < origLines.length) {
              html += `<div class="diff-line" style="background: rgba(248,113,113,0.15); color: #fca5a5; white-space: pre-wrap;">- ${escapeHtml(oLine)}</div>`;
              i++;
            }
            if (j < propLines.length) {
              html += `<div class="diff-line" style="background: rgba(52,211,153,0.15); color: #a7f3d0; white-space: pre-wrap;">+ ${escapeHtml(pLine)}</div>`;
              j++;
            }
          }
        }
      }
      html += '</div>';
      return html;
    }

        function renderResearchList() {
          const queryVal = document.getElementById('research-search') ? document.getElementById('research-search').value.trim().toLowerCase() : '';
          const sortBy = document.getElementById('research-sort') ? document.getElementById('research-sort').value : 'newest';
          
          let filtered = [...researchTasks];
          
          if (queryVal) {
            filtered = filtered.filter(task => 
              (task.query || '').toLowerCase().includes(queryVal) ||
              (task.error || '').toLowerCase().includes(queryVal) ||
              (task.current_step || '').toLowerCase().includes(queryVal)
            );
          }
          
          if (sortBy === 'newest') {
            filtered.sort((a, b) => {
              const timeA = a.created_at ? new Date(a.created_at).getTime() : 0;
              const timeB = b.created_at ? new Date(b.created_at).getTime() : 0;
              return timeB - timeA;
            });
          } else if (sortBy === 'oldest') {
            filtered.sort((a, b) => {
              const timeA = a.created_at ? new Date(a.created_at).getTime() : 0;
              const timeB = b.created_at ? new Date(b.created_at).getTime() : 0;
              return timeA - timeB;
            });
          } else if (sortBy === 'alpha') {
            filtered.sort((a, b) => (a.query || '').localeCompare(b.query || ''));
          }

            let statusText = task.status || 'pending';

              else if (stepText === 'search') progressVal = 45;
              else if (stepText === 'evaluate') progressVal = 75;
              else if (stepText === 'synthesize') progressVal = 90;
            }
            
            let badgeClass = statusText;
            let badgeLabel = statusText;

                ].join('');

                  `<button class="btn btn-reject" onclick="deleteResearchTask('${task.task_id}')" style="background:#dc2626; color:#fff;">Remove</button>`
                ].join('');

                `<button class="btn btn-reject" onclick="cancelResearchTask('${task.task_id}')">Cancel</button>`

                `<button class="btn btn-action" onclick="resumeResearchTask('${task.task_id}')">Resume</button>`,
                `<button class="btn btn-reject" onclick="cancelResearchTask('${task.task_id}')">Cancel</button>`,
                `<button class="btn btn-reject" onclick="deleteResearchTask('${task.task_id}')" style="background:#dc2626; color:#fff;">Remove</button>`
              ].join('');

                `<button class="btn btn-reject" onclick="cancelResearchTask('${task.task_id}')">Cancel</button>`,
                `<button class="btn btn-reject" onclick="deleteResearchTask('${task.task_id}')" style="background:#dc2626; color:#fff;">Remove</button>`
              ].join('');

                `<button class="btn btn-reject" onclick="deleteResearchTask('${task.task_id}')" style="background:#dc2626; color:#fff;">Remove</button>`

              }
              buttons.push(`<button class="btn btn-reject" onclick="cancelResearchTask('${task.task_id}')">Cancel</button>`);

                  <span class="badge ${badgeClass}">${badgeLabel}</span>
                  ${task.struggling ? `<span class="badge" style="background: #eab308; color: #000; font-weight: 600;">⚠️ Struggling</span>` : ''}
                  ${task.quarantined ? `<span class="badge" style="background: #dc2626; color: #fff; font-weight: 600;">🔒 Quarantined</span>` : ''}
                  ${(task.limit_warnings || []).map(w => {
                    let lbl = w;
                    if (w === 'total_sources_cap_reached') lbl = '⚠️ Sources Cap Hit';
                    else if (w === 'orchestrator_turns_cap_reached') lbl = '⚠️ Turn Limit Hit';
                    else if (w === 'timeout_reached') lbl = '⚠️ Timeout Hit';
                    return `<span class="badge" style="background: #ef4444; color: #fff; font-weight: 600;">${escapeHtml(lbl)}</span>`;
                  }).join('')}
                  <span style="margin-left: auto;">Created: ${created} ${finished ? ' | Finished: ' + finished : ''}</span>
                </div>
                <div class="card-body">
                  <h3 style="font-size: 16px; font-weight: 500; color: #fff; margin-bottom: 6px;">${escapeHtml(task.query)}</h3>
                  <div style="font-size: 12px; color: var(--text-dim); font-family: monospace; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;">
                    <span style="opacity: 0.5;">ID:</span>
                    <span title="Click to copy task ID" onclick="navigator.clipboard.writeText('${task.task_id}').then(() => { this.textContent='Copied!'; setTimeout(() => this.textContent='${task.task_id}', 1500); })" style="cursor: pointer; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; user-select: all;" >${task.task_id}</span>
                  </div>
                  <div style="font-size: 13px; color: var(--text-dim); display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 6px;">
                    <span>Scope: <strong style="text-transform: uppercase;">${task.scope}</strong></span>
                    <span>Step: <strong style="text-transform: uppercase; color: var(--accent);">${stepText}</strong></span>
                    <span>Turns: <strong>${task.orchestrator_turns || 0}</strong></span>
                    <span>Confidence: <strong>${task.confidence !== undefined ? task.confidence + '%' : 'N/A'}</strong></span>
                    <span>Sources: <strong>${task.total_sources || 0}</strong></span>
                  </div>
                  ${statusText !== 'done' && statusText !== 'error' && statusText !== 'cancelled' ? `
                    <div class="progress-bar-container">
                      <div class="progress-bar-fill" style="width: ${progressVal}%;"></div>
                    </div>
                  ` : ''}
                  ${task.error ? `<div style="color: var(--danger); font-size: 13px; margin-top: 6px; background: rgba(248,113,113,0.05); padding: 8px; border-radius: 6px; border: 1px solid rgba(248,113,113,0.15);">${escapeHtml(task.error)}</div>` : ''}
                  ${(task.limit_warnings || []).includes('total_sources_cap_reached') ? `
                    <div style="color: #f87171; font-size: 13px; margin-top: 6px; background: rgba(239,68,68,0.04); padding: 8px; border-radius: 6px; border: 1px solid rgba(239,68,68,0.15); line-height: 1.4;">
                      <strong>⚠️ Scraper Budget Exhausted:</strong> Overall task limit of 100 sources reached. Remove unnecessary sub-questions (which will instantly recalculate and free up source budget) or increase limit in config.
                    </div>
                  ` : ''}
                </div>
                <div class="card-actions">
                  ${actionButtons}
                </div>
              </div>
            `;
          }).join('');
        }
      }
    }

    // Keyboard shortcuts for review tab
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      
      const items = currentTab === 'extractions' 
        ? extractions 
        : (currentTab === 'proposals' 
           ? proposals.filter(p => p.type !== 'profile_update') 
           : (currentTab === 'profile_updates' 
              ? proposals.filter(p => p.type === 'profile_update') 
              : []));
      if (items.length === 0) return;
      
      const firstId = items[0].id;
      if (e.key.toLowerCase() === 'a') {
        handleAction('proposals', firstId, 'approve');
      } else if (e.key.toLowerCase() === 'r' || e.key.toLowerCase() === 'd') {
        handleAction('proposals', firstId, 'deny');
      }
    });

    // Close modal on Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Init
    const params = new URLSearchParams(window.location.search);
    const initialTab = params.get('tab');
    if (initialTab && ['extractions', 'proposals', 'profile_updates', 'research'].includes(initialTab)) {
      switchTab(initialTab);
    } else {
      loadData();
    }
  </script>
</body>
</html>
