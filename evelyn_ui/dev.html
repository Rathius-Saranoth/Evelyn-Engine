            <div class="card-body" style="display: flex; flex-direction: column; gap: 12px;">
              <div style="background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px;">
                <div style="font-size: 12px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Reason / Rationale</div>
                <div style="font-size: 14px; color: var(--text); line-height: 1.4;">${escapeHtml(item.reason)}</div>
              </div>
              ${item.type === 'recategorize' 
                ? `
                <div style="background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px;">
                  <div style="font-size: 12px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Target Category</div>
                  <div style="font-size: 14px; color: var(--warning); font-weight: 600;">Move to ${escapeHtml(item.suggested_category)}</div>
                </div>` 
                : `
                <div style="background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px;">
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div style="font-size: 12px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Proposed Content</div>
                    <div style="font-size: 12px; color: var(--text-dim);">Target Category: <strong style="color: var(--accent);">${escapeHtml(item.suggested_category)}</strong></div>
                  </div>
                  <pre style="background: #07070a; border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text); white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto;">${escapeHtml(item.merged_observation)}</pre>
                </div>`
              }
              <div style="background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px;">
                <div style="font-size: 12px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">
                  Supporting Context Entries (${(item.source_entries || []).length})
                </div>
                <div class="source-list" style="background: transparent; padding: 0;">${sourcesHTML}</div>
              </div>
            </div>
            <div class="card-actions">
              <button class="btn btn-approve" onclick="handleAction('proposals', ${item.id}, 'approve')">Approve</button>
              <button class="btn btn-reject" onclick="handleAction('proposals', ${item.id}, 'deny')">Reject</button>
            </div>
          </div>
        `;
      } else if (item.item_type === 'profile_update') {
        const sourcesHTML = (item.source_entries && item.source_entries.length > 0) ? item.source_entries.map(s => `
          <div class="source-item-card" id="source-entry-${item.id}-${s.id}" style="background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 8px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
              <div style="font-size: 13px; flex: 1;">
                <span style="color: var(--accent); font-weight: 600;">[${escapeHtml(s.category)}]</span>
                <span style="color: var(--text-dim); font-size: 12px; margin-left: 4px;">(${escapeHtml(s.subject || 'R')})</span>
                <div style="color: var(--text); margin-top: 4px; line-height: 1.4;">${escapeHtml(s.observation)}</div>
                ${s.tags ? `<div style="font-size: 11px; color: var(--text-dim); margin-top: 4px;">Tags: ${escapeHtml(s.tags)}</div>` : ''}
              </div>
              <div style="display: flex; gap: 4px; flex-shrink: 0;">
                <button class="btn btn-sm" style="font-size: 11px; padding: 3px 8px; background: var(--surface2);" onclick="toggleEditSourceEntry(${item.id}, ${s.id})">Edit</button>
                <button class="btn btn-sm" style="font-size: 11px; padding: 3px 8px; background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3);" onclick="unlinkSourceEntry(${item.id}, ${s.id})">Unlink</button>
                <button class="btn btn-sm" style="font-size: 11px; padding: 3px 8px; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3);" onclick="deleteSourceEntry(${item.id}, ${s.id})">Delete</button>
              </div>
            </div>
            <div id="edit-source-form-${item.id}-${s.id}" style="display: none; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; gap: 8px; flex-direction: column;">
              <div style="display: flex; gap: 8px;">
                <input type="text" id="ce-cat-${s.id}" value="${escapeHtml(s.category)}" placeholder="Category" style="flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 12px;" />
                <input type="text" id="ce-subj-${s.id}" value="${escapeHtml(s.subject || 'R')}" placeholder="Subject" style="width: 80px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 12px;" />
              </div>
              <textarea id="ce-obs-${s.id}" style="width: 100%; min-height: 60px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 4px; font-size: 12px;">${escapeHtml(s.observation)}</textarea>
              <div style="display: flex; gap: 8px; align-items: center;">
                <input type="text" id="ce-tags-${s.id}" value="${escapeHtml(s.tags || '')}" placeholder="Tags (comma-separated)" style="flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 12px;" />
                <button class="btn btn-sm btn-approve" style="font-size: 12px; padding: 4px 10px;" onclick="saveSourceEntry(${item.id}, ${s.id})">Save</button>
                <button class="btn btn-sm" style="font-size: 12px; padding: 4px 10px; background: var(--surface2);" onclick="toggleEditSourceEntry(${item.id}, ${s.id})">Cancel</button>
              </div>
            </div>
          </div>
        `).join('') : '<div style="color: var(--text-dim); font-style: italic; font-size: 13px;">No supporting context entries remaining.</div>';

        const rawOriginal = item.merged_tags || '';
        // escapeAttr is escapeHtml + double-quote encoding, required for values
        // stored in double-quoted HTML attributes (escapeHtml omits &quot;).
        const escapeAttr = s => (!s ? '' : String(s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;'));
        
        return `
          <div class="card">
            <div class="card-header">
              <span class="badge" style="background: var(--accent); color: #fff;">PROFILE UPDATE: ${escapeHtml(item.suggested_category)}</span>
              <span>ID: ${item.id}</span>
            </div>
            <div class="card-body" style="display: flex; flex-direction: column; gap: 12px;">
              <div style="color: var(--text-dim); font-size: 13px;"><strong>Reason / Explanation:</strong><br>${escapeHtml(item.reason)}</div>
              
              <div>
                <div style="font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #fff;">Proposed Document Content (Editable prior to approval):</div>
                <textarea id="prop-edit-${item.id}"
                  style="width: 100%; min-height: 180px; font-family: 'JetBrains Mono', monospace; font-size: 13px; background: #07070a; border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 6px; resize: vertical;"
                  oninput="updateLiveDiff(${item.id})">${escapeHtml(item.merged_observation)}</textarea>
              </div>

              <div>
                <div style="font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #fff;">Live Diff Comparison:</div>
                <div id="prop-diff-${item.id}" data-original="${escapeAttr(rawOriginal)}">
                  <!-- diff populated after DOM insertion by render() -->
                </div>
              </div>

              <div style="font-size: 13px; color: var(--text-dim); margin-top: 4px;">
                <strong>Supporting Context Entries (${(item.source_entries || []).length}):</strong>
              </div>
              <div class="source-list" style="background: transparent; padding: 0;">${sourcesHTML}</div>
            </div>
            <div class="card-actions">
              <button class="btn btn-approve" onclick="handleAction('proposals', ${item.id}, 'approve')">Approve Update</button>
              <button class="btn btn-reject" onclick="handleAction('proposals', ${item.id}, 'deny')">Reject Update</button>
            </div>
          </div>
        `;
      } else if (item.item_type === 'procedure') {
        return `
          <div class="card">
            <div class="card-header">
              <span class="badge extraction" style="background: var(--accent); color: #fff;">PROCEDURE</span>
              <span>ID: ${item.id}</span>
            </div>
            <div class="card-body" style="display: flex; flex-direction: column; gap: 12px;">
              <div>
                <label style="display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; font-weight: 600;">TRIGGER PATTERN (Conversational query keyword)</label>
                <input type="text" id="proc-trigger-${item.id}" value="${escapeHtml(item.trigger_pattern)}" style="width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-family: inherit; font-size: 14px; outline: none;" />
              </div>
              <div>
                <label style="display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; font-weight: 600;">STEPS (Markdown list of operations)</label>
                <textarea id="proc-steps-${item.id}" style="width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; resize: vertical; min-height: 100px;">${escapeHtml(item.steps)}</textarea>
              </div>
              <div>
                <label style="display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; font-weight: 600;">PITFALLS / WHAT TO AVOID (Optional)</label>
                <input type="text" id="proc-pitfalls-${item.id}" value="${escapeHtml(item.pitfalls || '')}" placeholder="None" style="width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-family: inherit; font-size: 14px; outline: none;" />
              </div>
              <div>
                <label style="display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; font-weight: 600;">VERIFICATION CHECKS (Optional)</label>
                <input type="text" id="proc-verification-${item.id}" value="${escapeHtml(item.verification || '')}" placeholder="None" style="width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-family: inherit; font-size: 14px; outline: none;" />
              </div>
              <div>
                <label style="display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; font-weight: 600;">TAGS (Comma separated)</label>
                <input type="text" id="proc-tags-${item.id}" value="${escapeHtml(item.tags || '')}" placeholder="None" style="width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-family: inherit; font-size: 14px; outline: none;" />
              </div>
            </div>
            <div class="card-actions">
              <button class="btn btn-approve" onclick="handleProcedureAction(${item.id}, 'approve')">Approve Procedure</button>
              <button class="btn btn-reject" onclick="handleProcedureAction(${item.id}, 'deny')">Reject / Archive</button>
            </div>
          </div>
        `;
      }
      return '';
    }

    function render() {
      const container = document.getElementById('container');
      
      if (currentTab === 'triage') {
        const extCount = unifiedItems.filter(i => i.item_type === 'extraction').length;
        const propCount = unifiedItems.filter(i => i.item_type === 'proposal').length;
        const profUpCount = unifiedItems.filter(i => i.item_type === 'profile_update').length;
        const procCount = unifiedItems.filter(i => i.item_type === 'procedure').length;

        const filterBarHtml = `
          <div class="filter-bar">
            <button class="filter-pill ${triageFilter === 'all' ? 'active' : ''}" onclick="setTriageFilter('all')">All (${unifiedItems.length})</button>
            <button class="filter-pill ${triageFilter === 'extraction' ? 'active' : ''}" onclick="setTriageFilter('extraction')">Extractions (${extCount})</button>
            <button class="filter-pill ${triageFilter === 'proposal' ? 'active' : ''}" onclick="setTriageFilter('proposal')">Proposals (${propCount})</button>
            <button class="filter-pill ${triageFilter === 'profile_update' ? 'active' : ''}" onclick="setTriageFilter('profile_update')">Profile Updates (${profUpCount})</button>
            <button class="filter-pill ${triageFilter === 'procedure' ? 'active' : ''}" onclick="setTriageFilter('procedure')">Procedures (${procCount})</button>
          </div>
        `;

        let filteredItems = unifiedItems;
        if (triageFilter !== 'all') {
          filteredItems = unifiedItems.filter(i => i.item_type === triageFilter);
        }

        if (filteredItems.length === 0) {
          container.innerHTML = filterBarHtml + `<div class="empty-state">All caught up! No ${triageFilter === 'all' ? '' : triageFilter.replace('_', ' ')} items to review.</div>`;
          return;
        }

        container.innerHTML = filterBarHtml + filteredItems.map(item => renderTriageItemCard(item)).join('');

        // Initialize live diffs after DOM insertion — avoids embedding large renderDiff
        // output in the template string which corrupts multi-card HTML structure.
        filteredItems.filter(i => i.item_type === 'profile_update').forEach(item => {
          updateLiveDiff(item.id);
        });

      } else if (currentTab === 'research') {
        const hasForm = !!document.getElementById('research-query');
        
        let formHTML = `
          <div class="research-form">
            <div class="research-form-row">
              <input type="text" id="research-query" placeholder="Enter deep research topic or question..." />
              <select id="research-scope">
                <option value="standard">Standard (~15 min, 10-15 sources)</option>
                <option value="quick">Quick (~5 min, 3-5 sources)</option>
                <option value="deep">Deep (~30 min, 20+ sources)</option>
              </select>
              <button onclick="startResearchTask()">Launch Research</button>
            </div>
            <textarea id="research-intent" placeholder="Why are we researching this? (optional — leave blank and Evelyn will auto-detect intent from context)"></textarea>
          </div>
          <div class="research-filters" style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;">
            <input type="text" id="research-search" placeholder="🔍 Filter research by topic..." style="flex: 1; min-width: 150px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-family: inherit; font-size: 13px; outline: none;" />
            <select id="research-sort" style="background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 8px; font-family: inherit; font-size: 13px; outline: none; min-width: 130px;">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
              <option value="alpha">Alphanumeric</option>
            </select>
          </div>
          <div id="research-list-container"></div>
        `;
        
        if (!hasForm) {
          container.innerHTML = formHTML;
          document.getElementById('research-search').addEventListener('input', renderResearchList);
          document.getElementById('research-sort').addEventListener('change', renderResearchList);
        }
        
        renderResearchList();
        
        function renderResearchList() {
          const queryVal = document.getElementById('research-search') ? document.getElementById('research-search').value.trim().toLowerCase() : '';
          const sortBy = document.getElementById('research-sort') ? document.getElementById('research-sort').value : 'newest';
          
          let filtered = [...researchTasks];
          
          if (queryVal) {
            filtered = filtered.filter(task => 
              (task.query || '').toLowerCase().includes(queryVal) ||
              (task.original_question || '').toLowerCase().includes(queryVal) ||
              (task.error || '').toLowerCase().includes(queryVal) ||
              (task.current_step || '').toLowerCase().includes(queryVal)
            );
          }
          
          if (sortBy === 'newest') {
            filtered.sort((a, b) => {
              const timeA = a.created_at ? new Date(a.created_at).getTime() : 0;
              const timeB = b.created_at ? new Date(b.created_at).getTime() : 0;
              return timeB - timeA;
            });
          } else if (sortBy === 'oldest') {
            filtered.sort((a, b) => {
              const timeA = a.created_at ? new Date(a.created_at).getTime() : 0;
              const timeB = b.created_at ? new Date(b.created_at).getTime() : 0;
              return timeA - timeB;
            });
          } else if (sortBy === 'alpha') {
            filtered.sort((a, b) => (a.query || a.original_question || '').localeCompare(b.query || b.original_question || ''));
          }
          
          const listContainer = document.getElementById('research-list-container');
          if (!listContainer) return;
          
          if (filtered.length === 0) {
            listContainer.innerHTML = `<div class="empty-state">No matching research tasks found.</div>`;
            return;
          }
          
          listContainer.innerHTML = filtered.map(task => {
            const finished = task.finished_at ? new Date(task.finished_at * 1000).toLocaleString() : '';
            const created = task.created_at ? new Date(task.created_at).toLocaleString() : '';
            const primaryQuery = task.query || task.original_question || '';
            
            let progressVal = 0;
            let statusText = task.status || 'pending';
            let stepText = task.current_step || 'plan';
            
            if (statusText === 'done' || statusText === 'resolved') {
              progressVal = 100;
            } else if (statusText === 'error' || statusText === 'cancelled') {
              progressVal = 100;
            } else {
              if (stepText === 'plan') progressVal = 15;
              else if (stepText === 'search') progressVal = 45;
              else if (stepText === 'evaluate') progressVal = 75;
              else if (stepText === 'synthesize') progressVal = 90;
            }
            
            let badgeClass = statusText;
            let badgeLabel = statusText;
            if (statusText === 'searching' || statusText === 'running') {
              badgeLabel = stepText;
              if (stepText === 'plan') badgeClass = 'planning';
              else if (stepText === 'search') badgeClass = 'searching';
              else if (stepText === 'evaluate') badgeClass = 'evaluating';
              else if (stepText === 'synthesize') badgeClass = 'synthesizing';
            }
            
            let actionButtons = '';
            if (statusText === 'resolved') {
              actionButtons = `<button class="btn btn-reject" onclick="deleteResearchTask('${task.task_id}')" style="background:#dc2626; color:#fff;">Remove</button>`;
            } else if (statusText === 'done') {
              if (task.quarantined) {
                actionButtons = [
                  `<button class="btn btn-start-now" onclick="openGuidanceModal('${task.task_id}')">▶ Provide Guidance</button>`,
                  `<button class="btn btn-action" onclick="restartResearchTask('${task.task_id}', '${escapeHtml(task.query).replace(/'/g, "\\'")}', '${task.scope}')">Restart (Wipe)</button>`,
                  `<button class="btn btn-action" onclick="readReport('${task.task_id}', '${escapeHtml(task.query).replace(/'/g, "\\'")}')">Read Report</button>`,
                  `<button class="btn btn-reject" onclick="deleteResearchTask('${task.task_id}')" style="background:#dc2626; color:#fff;">Remove</button>`
                ].join('');
              } else {
                actionButtons = [
                  `<button class="btn btn-action" onclick="readReport('${task.task_id}', '${escapeHtml(task.query).replace(/'/g, "\\'")}')">Read Report</button>`,
                  `<button class="btn btn-reject" onclick="deleteResearchTask('${task.task_id}')" style="background:#dc2626; color:#fff;">Remove</button>`
                ].join('');
              }
            } else if (statusText === 'queued') {
              actionButtons = [
                `<button class="btn btn-start-now" onclick="startNowResearchTask('${task.task_id}')">▶ Start Now</button>`,
                `<button class="btn btn-reject" onclick="cancelResearchTask('${task.task_id}')">Cancel</button>`
              ].join('');
            } else if (statusText === 'paused') {
              actionButtons = [
                `<button class="btn btn-start-now" onclick="startNowResearchTask('${task.task_id}')">▶ Start Now</button>`,
                `<button class="btn btn-action" onclick="resumeResearchTask('${task.task_id}')">Resume</button>`,
                `<button class="btn btn-reject" onclick="cancelResearchTask('${task.task_id}')">Cancel</button>`,
                `<button class="btn btn-reject" onclick="deleteResearchTask('${task.task_id}')" style="background:#dc2626; color:#fff;">Remove</button>`
              ].join('');
            } else if (statusText === 'needs_guidance') {
              actionButtons = [
                `<button class="btn btn-start-now" onclick="openGuidanceModal('${task.task_id}')">▶ Provide Guidance</button>`,
                `<button class="btn btn-reject" onclick="cancelResearchTask('${task.task_id}')">Cancel</button>`,
                `<button class="btn btn-reject" onclick="deleteResearchTask('${task.task_id}')" style="background:#dc2626; color:#fff;">Remove</button>`
              ].join('');
            } else if (statusText === 'error' || statusText === 'cancelled') {
              actionButtons = [
                `<button class="btn btn-action" onclick="resumeResearchTask('${task.task_id}')">Resume / Retry</button>`,
                `<button class="btn btn-reject" onclick="deleteResearchTask('${task.task_id}')" style="background:#dc2626; color:#fff;">Remove</button>`
              ].join('');
            } else {
              let buttons = [];
              if (task.struggling) {
                buttons.push(`<button class="btn btn-start-now" onclick="openGuidanceModal('${task.task_id}')">▶ Provide Guidance</button>`);
              }
              buttons.push(`<button class="btn btn-reject" onclick="cancelResearchTask('${task.task_id}')">Cancel</button>`);
              actionButtons = buttons.join('');
            }
            
            return `
              <div class="card">
                <div class="card-header" style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                  <span class="badge ${badgeClass}">${badgeLabel}</span>
                  ${task.struggling ? `<span class="badge" style="background: #eab308; color: #000; font-weight: 600;">⚠️ Struggling</span>` : ''}
                  ${task.quarantined ? `<span class="badge" style="background: #dc2626; color: #fff; font-weight: 600;">🔒 Quarantined</span>` : ''}
                  ${(task.limit_warnings || []).map(w => {
                    let lbl = w;
                    if (w === 'total_sources_cap_reached') lbl = '⚠️ Sources Cap Hit';
                    else if (w === 'orchestrator_turns_cap_reached') lbl = '⚠️ Turn Limit Hit';
                    else if (w === 'timeout_reached') lbl = '⚠️ Timeout Hit';
                    return `<span class="badge" style="background: #ef4444; color: #fff; font-weight: 600;">${escapeHtml(lbl)}</span>`;
                  }).join('')}
                  <span style="margin-left: auto;">Created: ${created} ${finished ? ' | Finished: ' + finished : ''}</span>
                </div>
                <div class="card-body">
                  <h3 style="font-size: 16px; font-weight: 500; color: #fff; margin-bottom: 6px;">${escapeHtml(primaryQuery)}</h3>
                  <div style="font-size: 12px; color: var(--text-dim); font-family: monospace; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;">
                    <span style="opacity: 0.5;">ID:</span>
                    <span title="Click to copy task ID" onclick="navigator.clipboard.writeText('${task.task_id}').then(() => { this.textContent='Copied!'; setTimeout(() => this.textContent='${task.task_id}', 1500); })" style="cursor: pointer; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; user-select: all;" >${task.task_id}</span>
                  </div>
                  <div style="font-size: 13px; color: var(--text-dim); display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 6px;">
                    <span>Scope: <strong style="text-transform: uppercase;">${task.scope}</strong></span>
                    <span>Step: <strong style="text-transform: uppercase; color: var(--accent);">${stepText}</strong></span>
                    <span>Runtime: <strong>${formatDuration(task.accumulated_runtime)}</strong></span>
                    <span>Turns: <strong>${task.orchestrator_turns || 0}</strong></span>
                    <span>Confidence: <strong>${task.confidence !== undefined ? task.confidence + '%' : 'N/A'}</strong></span>
                    <span>Sources: <strong>${task.total_sources || 0}</strong></span>
                  </div>
                  ${statusText !== 'done' && statusText !== 'resolved' && statusText !== 'error' && statusText !== 'cancelled' ? `
                    <div class="progress-bar-container">
                      <div class="progress-bar-fill" style="width: ${progressVal}%;"></div>
                    </div>
                  ` : ''}
                  ${task.error ? `<div style="color: var(--danger); font-size: 13px; margin-top: 6px; background: rgba(248,113,113,0.05); padding: 8px; border-radius: 6px; border: 1px solid rgba(248,113,113,0.15);">${escapeHtml(task.error)}</div>` : ''}
                  ${(task.limit_warnings || []).includes('total_sources_cap_reached') ? `
                    <div style="color: #f87171; font-size: 13px; margin-top: 6px; background: rgba(239,68,68,0.04); padding: 8px; border-radius: 6px; border: 1px solid rgba(239,68,68,0.15); line-height: 1.4;">
                      <strong>⚠️ Scraper Budget Exhausted:</strong> Overall task limit of 100 sources reached. Remove unnecessary sub-questions (which will instantly recalculate and free up source budget) or increase limit in config.
                    </div>
                  ` : ''}
                </div>
                <div class="card-actions">
                  ${actionButtons}
                </div>
              </div>
            `;
          }).join('');
        }
      }
    }

    // Keyboard shortcuts for review tab
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      if (currentTab !== 'triage') return;

      let filteredItems = unifiedItems;
      if (triageFilter !== 'all') {
        filteredItems = unifiedItems.filter(i => i.item_type === triageFilter);
      }
      if (filteredItems.length === 0) return;
      
      const firstItem = filteredItems[0];
      if (e.key.toLowerCase() === 'a') {
        if (firstItem.item_type === 'extraction') handleAction('extractions', firstItem.id, 'approve');
        else if (firstItem.item_type === 'proposal' || firstItem.item_type === 'profile_update') handleAction('proposals', firstItem.id, 'approve');
        else if (firstItem.item_type === 'procedure') handleProcedureAction(firstItem.id, 'approve');
      } else if (e.key.toLowerCase() === 'r' || e.key.toLowerCase() === 'd') {
        if (firstItem.item_type === 'extraction') handleAction('extractions', firstItem.id, 'delete');
        else if (firstItem.item_type === 'proposal' || firstItem.item_type === 'profile_update') handleAction('proposals', firstItem.id, 'deny');
        else if (firstItem.item_type === 'procedure') handleProcedureAction(firstItem.id, 'deny');
      }
    });

    // Close modal on Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Init
    const params = new URLSearchParams(window.location.search);
    const initialTab = params.get('tab');
    if (initialTab) {
      switchTab(initialTab);
    }
    loadData();
  </script>
</body>
</html>
