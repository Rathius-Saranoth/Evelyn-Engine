<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evelyn - Dev UI</title>
  <link rel="icon" type="image/x-icon" href="/ui/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <script src="/ui/vendor/marked.min.js"></script>
  <script src="/ui/vendor/purify.min.js"></script>
  <style>
    :root {
      --bg: #0d0d12;
      --surface: #13131c;
      --surface2: #1a1a28;
      --border: #2a2a40;
      --accent: #7c6af7;
      --text: #e8e8f0;
      --text-dim: #8888aa;
      --success: #34d399;
      --danger: #f87171;
      --warning: #fbbf24;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .diff-line { white-space: pre-wrap; word-break: break-word; }
    .diff-line-del { background: rgba(248, 113, 113, 0.12); color: #fca5a5; }
    .diff-line-ins { background: rgba(52, 211, 153, 0.12); color: #a7f3d0; }
    .diff-word-del { background: rgba(239, 68, 68, 0.45); color: #ffffff; padding: 1px 3px; border-radius: 3px; font-weight: 500; }
    .diff-word-ins { background: rgba(16, 185, 129, 0.45); color: #ffffff; padding: 1px 3px; border-radius: 3px; font-weight: 500; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 15px;
      line-height: 1.5; padding-bottom: 50px;
    }
    header {
      padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;
    }
    h1 { font-size: 18px; font-weight: 500; }
    .back-btn {
      color: var(--text-dim); text-decoration: none; font-size: 14px;
      background: var(--surface2); padding: 6px 12px; border-radius: 6px; transition: color 0.2s;
    }
    .back-btn:hover { color: #fff; }
    
    /* Heavy Tasks Dashboard Panel */
    .heavy-tasks-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 20px; margin: 16px auto;
      max-width: 850px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .heavy-tasks-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
    }
    .heavy-tasks-title {
      font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px;
    }
    .heavy-tasks-controls {
      display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-dim);
    }
    .toggle-live {
      display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-size: 13px;
    }
    .toggle-live input { cursor: pointer; }
    .heavy-tasks-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px;
    }
    .heavy-task-card {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 13px;
      transition: border-color 0.2s;
    }
    .heavy-task-card.active-task {
      border-color: var(--accent); background: rgba(124, 106, 247, 0.08);
    }
    .heavy-task-top {
      display: flex; justify-content: space-between; align-items: center;
    }
    .heavy-task-name { font-weight: 500; color: #fff; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--text-dim);
    }
    .status-dot.running { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .status-dot.error { background: var(--danger); }
    .status-dot.paused { background: var(--warning); }

    /* Tabs & Filter bar */
    .tabs {
      display: flex; gap: 8px; padding: 0 20px 16px; background: var(--bg); max-width: 850px; margin: 0 auto;
    }
    .tab-btn {
      background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border);
      padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500;
      transition: all 0.2s; flex: 1; text-align: center;
    }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    
    .filter-bar {
      display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; align-items: center;
    }
    .filter-pill {
      background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border);
      padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 500;
      transition: all 0.2s;
    }
    .filter-pill.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .filter-pill:hover:not(.active) { color: #fff; border-color: var(--text-dim); }

    main { padding: 0 20px; max-width: 850px; margin: 0 auto; }
    
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 12px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-dim); }
    .badge { background: var(--surface2); padding: 2px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* Badges & tabs color */
    .badge.recategorize { color: var(--warning); }
    .badge.merge { color: var(--accent); }
    .badge.extraction { color: var(--success); }
    
    .badge.planning { color: #818cf8; }
    .badge.searching { color: #60a5fa; }
    .badge.evaluating { color: #f472b6; }
    .badge.synthesizing { color: #c084fc; }
    .badge.done, .badge.resolved { color: var(--success); }
    .badge.error { color: var(--danger); }
    .badge.cancelled { color: var(--text-dim); }
    .badge.paused { color: var(--warning); }
    .badge.queued { color: #38bdf8; }
    
    .card-body { font-size: 15px; }
    .card-body p, .card-body li, .source-item {
      max-width: 72ch;
    }
    .card-body textarea {
      width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 12px; border-radius: 8px; font-family: inherit; font-size: 14px; resize: vertical; min-height: 80px;
    }
    
    .source-list {
      background: var(--surface2); border-radius: 8px; padding: 12px;
      font-size: 13px; color: var(--text-dim); margin-top: 8px;
    }
    .source-item { padding: 4px 0; border-bottom: 1px solid var(--border); }
    .source-item:last-child { border-bottom: none; }
    
    .card-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn {
      flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer;
      font-weight: 500; font-size: 14px; transition: opacity 0.2s; text-align: center;
    }
    .btn:hover { opacity: 0.8; }
    .btn-approve { background: var(--success); color: #000; }
    .btn-reject { background: var(--danger); color: #000; }
    .btn-edit { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-action { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-start-now { background: #d97706; color: #fff; }
    
    .research-form {
      display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
    }
    .research-form .research-form-row {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    .research-form input {
      flex: 2; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 10px 12px; border-radius: 8px; font-family: inherit; font-size: 14px; outline: none;
      min-width: 250px;
    }
    .research-form textarea {
      flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 10px 12px; border-radius: 8px; font-family: inherit; font-size: 13px; outline: none;
      resize: vertical; min-height: 52px; max-height: 120px; width: 100%;
      color: var(--text-muted, #888); line-height: 1.4;
    }
    .research-form textarea::placeholder { color: var(--text-muted, #888); }
    .research-form select {
      flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 10px; border-radius: 8px; font-family: inherit; font-size: 14px; outline: none;
      min-width: 130px;
    }
    .research-form button {
      background: var(--accent); color: #fff; border: none; padding: 10px 20px;
      border-radius: 8px; cursor: pointer; font-weight: 500; transition: opacity 0.2s;
    }
    .research-form button:hover { opacity: 0.9; }
    
    /* Modal styles */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      width: 100%; max-width: 900px; max-height: 90vh; display: flex; flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex;
      justify-content: space-between; align-items: center;
    }
    .modal-title { font-size: 16px; font-weight: 600; }
    .close-btn {
      background: none; border: none; color: var(--text-dim); font-size: 24px;
      cursor: pointer; line-height: 1; transition: color 0.2s;
    }
    .close-btn:hover { color: #fff; }
    .modal-body {
      padding: 20px; overflow-y: auto; flex: 1; font-size: 15px; line-height: 1.6;
      color: var(--text); font-family: inherit;
    }
    .modal-body h1, .modal-body h2, .modal-body h3 { margin-top: 16px; margin-bottom: 8px; font-weight: 600; color: #fff; max-width: 72ch; }
    .modal-body h1 { font-size: 22px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .modal-body h2 { font-size: 18px; }
    .modal-body h3 { font-size: 15px; }
    .modal-body p { margin-bottom: 12px; max-width: 72ch; }
    .modal-body ul, .modal-body ol { padding-left: 20px; margin-bottom: 12px; }
    .modal-body li { margin-bottom: 4px; max-width: 72ch; }
    .modal-body ul.contains-task-list, .modal-body ul.task-list { list-style: none; padding-left: 0.2em; }
    .modal-body li.task-list-item { display: flex; align-items: baseline; gap: 6px; }
    .modal-body li input[type="checkbox"] { margin-right: 6px; vertical-align: middle; accent-color: var(--accent); cursor: pointer; }
    .modal-body blockquote { border-left: 3px solid var(--accent); margin: 0.6em 0; padding: 4px 12px; background: rgba(124, 106, 247, 0.05); border-radius: 0 4px 4px 0; color: var(--text-dim); font-style: italic; }
    .modal-body hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
    .modal-body pre { background: var(--surface2); padding: 12px; border-radius: 8px; overflow-x: auto; margin-bottom: 12px; border: 1px solid var(--border); max-width: 100%; min-width: 0; }
    .modal-body code { background: var(--surface2); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--warning); }
    .modal-body pre code { background: none; padding: 0; color: inherit; }
    .card-body table, .modal-body table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 0.8em 0; border: 1px solid var(--border); border-radius: 6px; }
    .card-body th, .card-body td, .modal-body th, .modal-body td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; font-size: 13px; line-height: 1.4; }
    .card-body th, .modal-body th { background: var(--surface2); color: #fff; font-weight: 600; }
    .card-body tr:nth-child(even) td, .modal-body tr:nth-child(even) td { background: rgba(255, 255, 255, 0.02); }

    /* YAML Frontmatter / Metadata Card */
    .frontmatter-card { background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 12px; margin: 0.4em 0 0.8em; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
    .frontmatter-header { font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: 6px; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; }
    .frontmatter-grid { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 4px; }
    .frontmatter-item { display: inline-flex; align-items: baseline; gap: 4px; }
    .frontmatter-key { color: var(--text-dim); font-weight: 500; }
    .frontmatter-val { color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 11px; background: rgba(0, 0, 0, 0.25); padding: 1px 5px; border-radius: 3px; }
    
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
    .progress-bar-container {
      width: 100%; background: var(--surface2); height: 6px; border-radius: 3px; overflow: hidden; margin-top: 6px;
    }
    .progress-bar-fill {
      height: 100%; background: var(--accent); transition: width 0.4s ease;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="header-title">Developer Dashboard</h1>
    <div style="display: flex; gap: 8px; align-items: center;">
      <button class="back-btn" onclick="loadData()" style="cursor: pointer; border: none; font-family: inherit;">⟳ Refresh</button>
      <a href="/ui/" class="back-btn">← Back to Chat</a>
    </div>
  </header>
  
  <!-- Heavy Background Tasks Dashboard Panel -->
  <div class="heavy-tasks-panel" id="heavy-tasks-panel">
    <div class="heavy-tasks-header">
      <div class="heavy-tasks-title">
        <span>⚙️ Heavy Tasks Monitor</span>
        <span id="lock-status-badge" class="badge">Checking...</span>
      </div>
      <div class="heavy-tasks-controls">
        <label class="toggle-live">
          <input type="checkbox" id="live-updates-toggle" onchange="toggleLiveUpdates(this.checked)">
          ⚡ Live Updates (5s)
        </label>
        <button class="back-btn" onclick="triggerManualSync()" style="cursor: pointer; border: none; font-size: 12px; padding: 4px 8px;">Sync Chroma</button>
        <button class="back-btn" onclick="triggerManualRefreshMemory()" style="cursor: pointer; border: none; font-size: 12px; padding: 4px 8px;">Refresh Memory</button>
      </div>
    </div>
    <div class="heavy-tasks-grid" id="heavy-tasks-grid">
      <div style="color: var(--text-dim); font-size: 13px; grid-column: 1 / -1;">Loading heavy background tasks...</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-triage" onclick="switchTab('triage')">Unified Triage Queue (<span id="count-triage">0</span>)</button>
    <button class="tab-btn" id="tab-research" onclick="switchTab('research')">Deep Research (<span id="count-res">0</span>)</button>
  </div>
  
  <main id="container">
    <div class="empty-state">Loading...</div>
  </main>

  <!-- Modal for Report -->
  <div class="modal" id="report-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="report-modal-title">Research Report</span>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="report-modal-body"></div>
    </div>
  </div>

  <!-- Modal for Guidance -->
  <div class="modal" id="guidance-modal">
    <div class="modal-content" style="max-width: 800px;">
      <div class="modal-header">
        <span class="modal-title">Sub-Question Refinement</span>
        <button class="close-btn" onclick="closeGuidanceModal()">&times;</button>
      </div>
      <div class="modal-body" id="guidance-sq-container" style="display: flex; flex-direction: column; gap: 15px;">
        <!-- SQs dynamically injected here -->
      </div>
      <div class="modal-header" style="border-top: 1px solid var(--border); border-bottom: none; display: flex; justify-content: flex-end; gap: 10px;">
        <button class="btn btn-reject" onclick="closeGuidanceModal()">Cancel</button>
        <button class="btn btn-action" id="guidance-finalize-btn" style="max-width: 250px;">Finalize & Queue Task</button>
      </div>
  <!-- Modal for Context Entry Splitting -->
  <div class="modal" id="split-modal">
    <div class="modal-content" style="max-width: 850px; max-height: 90vh; display: flex; flex-direction: column;">
      <div class="modal-header">
        <span class="modal-title" id="split-modal-title">✂️ Split Compound Context Entry</span>
        <button class="close-btn" onclick="closeSplitModal()">&times;</button>
      </div>
      <div class="modal-body" style="overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding: 20px;">
        <div style="background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px;">
          <div style="font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 600; margin-bottom: 6px;">Original Compound Entry</div>
          <div id="split-modal-orig-text" style="font-size: 13px; line-height: 1.4; color: var(--text); white-space: pre-wrap;"></div>
        </div>

        <div id="split-loading" style="display: none; padding: 25px; text-align: center; color: var(--accent);">
          <div style="font-size: 14px; font-weight: 500;">Decomposing into atomic context facts with LLM & Taxonomy...</div>
        </div>

        <div id="split-drafts-container" style="display: flex; flex-direction: column; gap: 12px;">
          <!-- Dynamically populated child split cards -->
        </div>

        <div style="display: flex; justify-content: flex-start;">
          <button class="btn btn-sm" style="background: var(--surface); border: 1px dashed var(--border); font-size: 12px; padding: 6px 12px;" onclick="addSplitDraft()">+ Add Another Atomic Fact</button>
        </div>
      </div>
      <div class="modal-header" style="border-top: 1px solid var(--border); border-bottom: none; display: flex; justify-content: flex-end; gap: 10px;">
        <button class="btn btn-reject" onclick="closeSplitModal()">Cancel</button>
        <button class="btn btn-edit" onclick="reDecomposeSplit()">Re-Analyze with LLM</button>
        <button class="btn btn-approve" id="btn-apply-split" onclick="applySplitModal()">Apply Split</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    const API_KEY = localStorage.getItem('evelyn_api_key') || '';
    let currentTab = 'triage';
    let triageFilter = 'all';
    
    let unifiedItems = [];
    let extractions = [];
    let proposals = [];
    let procedures = [];
    let researchTasks = [];
    let heavyTasksData = { is_any_running: false, tasks: [], research_tasks: [] };
    let liveUpdatesTimer = null;

    function checkUnauthorized(res) {
      if (res && res.status === 401) {
        const key = prompt("API Key Required / Invalid. Enter your Evelyn API key (X-Evelyn-Key):");
        if (key) {
          localStorage.setItem("evelyn_api_key", key);
          location.reload();
        }
      }
    }

    function headers() {
      return { 'Content-Type': 'application/json', 'X-Evelyn-Key': API_KEY };
    }

    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function formatDuration(totalSeconds) {
      if (totalSeconds === null || totalSeconds === undefined || isNaN(totalSeconds) || totalSeconds < 0) {
        return '00:00:00';
      }
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = Math.floor(totalSeconds % 60);
      return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    if (typeof marked !== 'undefined') {
      marked.use({ gfm: true, breaks: true });
    }

    function extractFrontmatter(text) {
      if (!text) return { frontmatter: null, body: "" };
      const trimmed = text.trimStart();
      if (!trimmed.startsWith("---")) {
        return { frontmatter: null, body: text };
      }
      const match = trimmed.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
      if (!match) return { frontmatter: null, body: text };

      const rawYaml = match[1];
      const body = match[2];
      const entries = [];
      const lines = rawYaml.split(/\r?\n/);
      let currentKey = null;
      let currentVal = [];

      for (const line of lines) {
        const kvMatch = line.match(/^([A-Za-z0-9_ -]+):\s*(.*)$/);
        if (kvMatch) {
          if (currentKey) {
            entries.push({ key: currentKey, val: currentVal.join("\n").trim() });
          }
          currentKey = kvMatch[1].trim();
          currentVal = kvMatch[2] ? [kvMatch[2].trim()] : [];
        } else if (currentKey) {
          currentVal.push(line.trim());
        }
      }
      if (currentKey) {
        entries.push({ key: currentKey, val: currentVal.join("\n").trim() });
      }

      return {
        frontmatter: entries.length > 0 ? entries : null,
        body: body
      };
    }

    function renderFrontmatter(entries) {
      if (!entries || entries.length === 0) return "";
      const items = entries.map(e => `
        <div class="frontmatter-item">
          <span class="frontmatter-key">${escapeHtml(e.key)}:</span>
          <span class="frontmatter-val">${escapeHtml(e.val)}</span>
        </div>
      `).join("");
      return `<div class="frontmatter-card"><div class="frontmatter-header">📋 Metadata</div><div class="frontmatter-grid">${items}</div></div>`;
    }

    function renderMarkdown(md) {
      if (!md) return '';
      const { frontmatter, body } = extractFrontmatter(md);
      const frontmatterHtml = frontmatter ? renderFrontmatter(frontmatter) : "";

      let html = '';
      if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
        html = marked.parse(body);
      } else {
        let src = escapeHtml(body);
        src = src
          .replace(/^### (.*?)$/gm, '<h3>$1</h3>')
          .replace(/^## (.*?)$/gm, '<h2>$1</h2>')
          .replace(/^# (.+)$/gm, '<h1>$1</h1>')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>')
          .replace(/`(.*?)`/g, '<code>$1</code>')
          .replace(/\n\n/g, '<br><br>')
          .replace(/\n/g, '<br>');
        html = src;
      }

      if (typeof DOMPurify !== 'undefined' && typeof DOMPurify.sanitize === 'function') {
        html = DOMPurify.sanitize(html, {
          ADD_ATTR: ["onclick", "target", "checked", "disabled"],
          ADD_TAGS: ["button", "input"]
        });
      }

      return frontmatterHtml + html;
    }

    function parseProcedureYaml(yamlStr) {
      if (!yamlStr) return {};
      const res = {};
      const mTrigger = yamlStr.match(/trigger_pattern:\s*([\s\S]*?)(?=\nsteps:|\npitfalls:|\nverification:|\ntags:|$)/i);
      if (mTrigger) res.trigger_pattern = mTrigger[1].trim().replace(/^['"]|['"]$/g, '');
      const mSteps = yamlStr.match(/steps:\s*([\s\S]*?)(?=\npitfalls:|\nverification:|\ntags:|$)/i);
      if (mSteps) res.steps = mSteps[1].trim().replace(/^['"]|['"]$/g, '');
      const mPitfalls = yamlStr.match(/pitfalls:\s*([\s\S]*?)(?=\nverification:|\ntags:|$)/i);
      if (mPitfalls) res.pitfalls = mPitfalls[1].trim().replace(/^['"]|['"]$/g, '');
      const mVerif = yamlStr.match(/verification:\s*([\s\S]*?)(?=\ntags:|$)/i);
      if (mVerif) res.verification = mVerif[1].trim().replace(/^['"]|['"]$/g, '');
      const mTags = yamlStr.match(/tags:\s*([\s\S]*?)$/i);
      if (mTags) res.tags = mTags[1].trim().replace(/^['"]|['"]$/g, '');
      return res;
    }

    async function loadData() {
      try {
        const [resUnified, resRes, resTasks] = await Promise.all([
          fetch(`${API_BASE}/api/review/unified`, { headers: headers() }),
          fetch(`${API_BASE}/research/list`, { headers: headers() }),
          fetch(`${API_BASE}/api/heavy_tasks`, { headers: headers() })
        ]);
        
        checkUnauthorized(resUnified || resRes || resTasks);

        if (resUnified.ok) {
          unifiedItems = await resUnified.json();
        } else {
          // Fallback if unified endpoint is unavailable
          const [resExt, resProp, resProc] = await Promise.all([
            fetch(`${API_BASE}/api/review/extractions`, { headers: headers() }),
            fetch(`${API_BASE}/api/review/proposals`, { headers: headers() }),
            fetch(`${API_BASE}/api/review/procedures`, { headers: headers() })
          ]);
          checkUnauthorized(resExt || resProp || resProc);
          if (resExt.ok) extractions = await resExt.json();
          if (resProp.ok) proposals = await resProp.json();
          if (resProc.ok) procedures = await resProc.json();
          
          unifiedItems = [
            ...extractions.map(x => ({ ...x, item_type: 'extraction' })),
            ...proposals.map(p => ({ ...p, item_type: p.type === 'profile_update' ? 'profile_update' : 'proposal' })),
            ...procedures.map(pr => ({ ...pr, item_type: 'procedure' }))
          ];
        }

        if (resRes.ok) researchTasks = await resRes.json();
        if (resTasks.ok) heavyTasksData = await resTasks.json();

        updateCounts();
        renderHeavyTasks();
        render();
      } catch (e) {
        document.getElementById('container').innerHTML = `<div class="empty-state">Error loading data.</div>`;
      }
    }

      const isRunning = heavyTasksData.is_any_running;
      const activeHolder = heavyTasksData.active_lock_holder;

      if (isRunning) {
        lockBadge.className = 'badge';
        lockBadge.style.background = 'var(--warning)';
        lockBadge.style.color = '#000';
        lockBadge.textContent = `🔒 Lock Held: ${activeHolder || 'Running'}`;

    async function handleAction(type, id, action) {
      if (action === 'deny' && type === 'proposals') {
        if (!confirm('Are you sure you want to reject this proposal?')) return;
      }
      const endpoint = `${API_BASE}/api/review/${type}/${id}/${action}`;
      let body = null;
      
      if (action === 'edit' && type === 'extractions') {
        // obs-${id} is the inline edit textarea on the extraction card.
        const obs = document.getElementById(`obs-${id}`)?.value;
        const cat = document.getElementById(`ext-cat-${id}`)?.value || document.getElementById(`ce-cat-${id}`)?.value;
        const subj = document.getElementById(`ext-subj-${id}`)?.value || document.getElementById(`ce-subj-${id}`)?.value;
        const tags = document.getElementById(`ext-tags-${id}`)?.value || document.getElementById(`ce-tags-${id}`)?.value;
        body = JSON.stringify({ observation: obs, category: cat, subject: subj, tags: tags });
      } else if (action === 'approve' && type === 'proposals') {
        const procTrigger = document.getElementById(`proc-merge-trigger-${id}`);
        if (procTrigger) {
          const trigger = procTrigger.value || '';
          const steps = document.getElementById(`proc-merge-steps-${id}`)?.value || '';
          const pitfalls = document.getElementById(`proc-merge-pitfalls-${id}`)?.value || '';
          const verification = document.getElementById(`proc-merge-verification-${id}`)?.value || '';
          const tags = document.getElementById(`proc-merge-tags-${id}`)?.value || '';
          const stepsIndented = steps.split('\n').map(l => '  ' + l).join('\n');
          const constructedYaml = `trigger_pattern: ${trigger}\nsteps: |\n${stepsIndented}\npitfalls: ${pitfalls}\nverification: ${verification}\ntags: ${tags}`;
          body = JSON.stringify({ modified_text: constructedYaml });
        } else {
          const editArea = document.getElementById(`prop-edit-${id}`);
          if (editArea) {
            body = JSON.stringify({ modified_text: editArea.value });
          }
        }
      }
      
      try {
        const res = await fetch(endpoint, { method: 'POST', headers: headers(), body });
        if (res.ok) {
          if (type === 'extractions') {
            unifiedItems = unifiedItems.filter(x => !(x.item_type === 'extraction' && x.id === id));
          } else {
            unifiedItems = unifiedItems.filter(x => !((x.item_type === 'proposal' || x.item_type === 'profile_update') && x.id === id));
          }
          updateCounts();
          render();
        } else {
          alert('Action failed.');
        }
      } catch (e) {
        alert('Network error.');
      }
    }

    function updateLiveDiff(id) {
      const textarea = document.getElementById(`prop-edit-${id}`);
      const diffDiv = document.getElementById(`prop-diff-${id}`);
      if (textarea && diffDiv) {
        // dataset.original holds the raw original document text stored as a
        // data-attribute. The browser decodes HTML entities automatically on
        // read, so no JSON.parse is needed — just read and diff.
        diffDiv.innerHTML = renderDiff(diffDiv.dataset.original || '', textarea.value);
      }
    }

    async function saveSourceEntry(proposalId, entryId) {
      const cat = document.getElementById(`ce-cat-${entryId}`).value;
      const subj = document.getElementById(`ce-subj-${entryId}`).value;
      const obs = document.getElementById(`ce-obs-${entryId}`).value;
      const tags = document.getElementById(`ce-tags-${entryId}`).value;

      const endpoint = `${API_BASE}/api/review/extractions/${entryId}/edit`;
      const body = JSON.stringify({ category: cat, subject: subj, observation: obs, tags: tags });

      try {
        const res = await fetch(endpoint, { method: 'POST', headers: headers(), body });
        if (res.ok) {
          const item = unifiedItems.find(x => x.id === proposalId);
          if (item && item.source_entries) {
            const s = item.source_entries.find(e => e.id === entryId);
            if (s) {
              s.category = cat;
              s.subject = subj;
              s.observation = obs;
              s.tags = tags;
            }
          }
          render();
        } else {
          alert('Failed to save entry.');
        }
      } catch (e) {
        alert('Network error while saving entry.');
      }
    }

    async function deleteSourceEntry(proposalId, entryId) {
      if (!confirm('Are you sure you want to soft-delete this context entry?')) return;
      const endpoint = `${API_BASE}/api/review/extractions/${entryId}/delete`;
      try {
        const res = await fetch(endpoint, { method: 'POST', headers: headers() });
        if (res.ok) {
          const item = unifiedItems.find(x => x.id === proposalId);
          if (item) {
            if (item.source_entries) item.source_entries = item.source_entries.filter(e => e.id !== entryId);
            if (item.source_ids) item.source_ids = item.source_ids.filter(id => id !== entryId);
          }
          render();
        } else {
          alert('Failed to delete entry.');
        }
      } catch (e) {
        alert('Network error while deleting entry.');
      }

    async function handleProcedureAction(id, action) {
      const endpoint = `${API_BASE}/api/review/procedures/${id}/${action}`;
      let body = null;
      
      if (action === 'approve') {
        const trigger = document.getElementById(`proc-trigger-${id}`).value.trim();
        const steps = document.getElementById(`proc-steps-${id}`).value.trim();
        const pitfalls = document.getElementById(`proc-pitfalls-${id}`).value.trim();
        const verification = document.getElementById(`proc-verification-${id}`).value.trim();
        const tags = document.getElementById(`proc-tags-${id}`).value.trim();
        
        body = JSON.stringify({
          trigger_pattern: trigger,
          steps: steps,
          pitfalls: pitfalls || null,
          verification: verification || null,
          tags: tags || null
        });
      }
      
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: headers(),
          body: body
        });
        if (res.ok) {
          unifiedItems = unifiedItems.filter(p => !(p.item_type === 'procedure' && p.id === id));
          updateCounts();
          render();
        } else {
          alert('Action failed.');
        }
      } catch (e) {
        alert('Network error.');
      }
    }

      const container = document.getElementById('guidance-sq-container');
      container.innerHTML = '';
      
      if (task.intent_frame) {
        container.innerHTML += `
          <div style="background: rgba(124, 106, 247, 0.12); border: 1px solid rgba(124, 106, 247, 0.3); border-radius: 8px; padding: 12px; font-size: 13.5px; line-height: 1.5; color: var(--text);">

            <div>${escapeHtml(task.intent_frame)}</div>
          </div>
        `;
      }

      if ((task.limit_warnings || []).includes('total_sources_cap_reached')) {
        container.innerHTML += `
          <div style="background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 8px; padding: 12px; margin-bottom: 12px; color: #f87171; font-size: 13.5px; line-height: 1.4;">
            <strong>⚠️ Scraper Cap Hit (100 Sources):</strong> The overall task limit has been reached. Evelyn cannot extract from new sources. Removing unnecessary sub-questions will automatically recalculate and free up source budget.
          </div>
        `;
      }
      
      task.plan.sub_questions.forEach(sq => {
        let badgeColor = '#6b7280';
        if (sq.confidence >= 80) badgeColor = 'var(--success)';
        else if (sq.confidence > 0 || sq.status === 'needs_guidance') badgeColor = 'var(--warning)';
        else if (sq.status === 'removed') badgeColor = 'var(--danger)';
        else if (sq.status === 'split') badgeColor = 'var(--accent)';
        
        let gapsHtml = '';
        if (sq.gaps && sq.gaps.length > 0) {
          gapsHtml = `<div style="font-size: 13px; color: var(--danger); margin-top: 6px;"><strong>Identified Gaps:</strong><ul style="margin: 4px 0 0 20px;">${sq.gaps.map(g => `<li>${escapeHtml(g)}</li>`).join('')}</ul></div>`;
        }
        
        let reasonHtml = '';
        if (sq.removed_reason) {
          reasonHtml = `<div style="font-size: 13px; color: var(--danger); margin-top: 6px;"><strong>Removed Reason:</strong> ${escapeHtml(sq.removed_reason)}</div>`;
        } else if (sq.split_reason) {
          reasonHtml = `<div style="font-size: 13px; color: var(--accent); margin-top: 6px;"><strong>Split Reason:</strong> ${escapeHtml(sq.split_reason)}</div>`;

        let warningsHtml = '';
        if (sq.limit_warnings && sq.limit_warnings.length > 0) {
          warningsHtml = sq.limit_warnings.map(w => {
            let txt = w;
            if (w === 'depth_cap_reached') txt = 'Search depth exhausted without meeting confidence threshold.';
            else if (w === 'source_cap_reached') txt = 'Maximum source limit per sub-question reached.';
            return `<div style="font-size: 13px; color: #f87171; margin-top: 4px; font-weight: 500;">⚠️ ${escapeHtml(txt)}</div>`;
          }).join('');
        }
        
        const displayQuery = sq.search_query || sq.question || '';

        container.innerHTML += `
          <div style="background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-dim);">
              <span class="badge" style="background: ${badgeColor}; color: #fff;">${escapeHtml((sq.status || 'pending').toUpperCase())} (${sq.confidence || 0}%)</span>
              <span>Depth: ${sq.search_depth || 0} | Sources: ${sq.source_count || 0}</span>
            </div>
            <div style="font-weight: 600; font-size: 14px; color: #fff; line-height: 1.4;">

            </div>
            <div>
              <label style="display: block; font-size: 11px; font-weight: 600; color: var(--text-dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;">Search Query (Used for Save Rewrite):</label>

          finalizeBtn.textContent = 'Finalize & Queue Task';

    async function saveSqRewrite(taskId, sqId) {
      const ta = document.getElementById(`sq-edit-${sqId}`);
      const btn = document.getElementById(`sq-save-${sqId}`);
      const newSearchQuery = ta.value.trim();
      if (!newSearchQuery || newSearchQuery === ta.dataset.original) return;
      
      btn.disabled = true;
      btn.textContent = 'Saving...';
      
      try {
        const res = await fetch(`${API_BASE}/research/guide/${taskId}/rewrite`, {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ sq_id: sqId, new_search_query: newSearchQuery })
        });
        if (res.ok) {
          ta.dataset.original = newSearchQuery;
          btn.textContent = 'Saved!';
          btn.style.background = 'var(--success)';
          btn.style.color = '#000';
          setTimeout(() => {
            btn.textContent = 'Save Rewrite';
            btn.style.background = 'var(--surface2)';
            btn.style.color = 'var(--text)';
            btn.disabled = true;
          }, 2000);
          
          const task = researchTasks.find(t => t.task_id === taskId);
          if (task) {
             const sq = task.plan.sub_questions.find(s => s.id === sqId);
             if (sq) {
                 sq.search_query = newSearchQuery;
                 sq.status = "pending";
                 sq.search_depth = 0;
                 sq.gaps = [];
             }
          }
        } else {
          alert('Failed to save rewrite.');
          btn.disabled = false;
          btn.textContent = 'Save Rewrite';
        }
      } catch (e) {
        alert('Network error saving rewrite.');
        btn.disabled = false;
        btn.textContent = 'Save Rewrite';
      }
    }

    function handleEditInput(id) {
      const item = unifiedItems.find(x => x.id === id);
      if (!item) return;
      const obs = document.getElementById(`obs-${id}`)?.value ?? item.observation;
      const cat = document.getElementById(`ext-cat-${id}`)?.value ?? item.category;
      const subj = document.getElementById(`ext-subj-${id}`)?.value ?? (item.subject || 'Ricky');
      const tags = document.getElementById(`ext-tags-${id}`)?.value ?? (item.tags || '');
      const isDirty = (obs !== item.observation || cat !== item.category || subj !== (item.subject || 'Ricky') || tags !== (item.tags || ''));
      
      const btnApprove = document.getElementById(`btn-approve-${id}`);
      const btnEdit = document.getElementById(`btn-edit-${id}`);
      const btnRevert = document.getElementById(`btn-revert-${id}`);
      if (btnApprove) btnApprove.style.display = isDirty ? 'none' : 'block';
      if (btnEdit) btnEdit.style.display = isDirty ? 'block' : 'none';
      if (btnRevert) btnRevert.style.display = isDirty ? 'block' : 'none';
    }

    function appendExtractionTag(id, tag) {
      const input = document.getElementById(`ext-tags-${id}`);
      if (!input) return;
      const current = input.value.trim();
      const tagsList = current ? current.split(',').map(t => t.trim()) : [];
      if (!tagsList.includes(tag)) {
        tagsList.push(tag);
        input.value = tagsList.join(', ');
        handleEditInput(id);
      }
    }

    function setExtractionCategory(id, cat) {
      const input = document.getElementById(`ext-cat-${id}`);
      if (!input) return;
      input.value = cat;
      handleEditInput(id);
    }

    function handleRevert(id) {
      const item = unifiedItems.find(x => x.id === id);
      if (!item) return;
      const textarea = document.getElementById(`obs-${id}`);
      if (textarea) textarea.value = item.observation;
      const catInput = document.getElementById(`ext-cat-${id}`);
      if (catInput) catInput.value = item.category;
      const subjInput = document.getElementById(`ext-subj-${id}`);
      if (subjInput) subjInput.value = item.subject || 'Ricky';
      const tagsInput = document.getElementById(`ext-tags-${id}`);
      if (tagsInput) tagsInput.value = item.tags || '';
      handleEditInput(id);
    }

    let currentSplitEntryId = null;
    let currentSplitProposalId = null;
    let currentSplitContext = null;
    let currentSplitDrafts = [];
    let currentSplitOriginal = null;

    async function openSplitModal(entryId, sourceContext, proposalId = null) {
      currentSplitEntryId = entryId;
      currentSplitProposalId = proposalId;
      currentSplitContext = sourceContext;
      currentSplitDrafts = [];

      let origText = '';
      let origCat = 'Cat05-R';
      let origSubj = 'Ricky';
      let origTags = '';

      if (sourceContext === 'extractions') {
        const item = unifiedItems.find(x => x.item_type === 'extraction' && x.id === entryId);
        if (item) {
          origText = document.getElementById(`obs-${entryId}`)?.value || item.observation;
          origCat = document.getElementById(`ext-cat-${entryId}`)?.value || item.category;
          origSubj = document.getElementById(`ext-subj-${entryId}`)?.value || item.subject || 'Ricky';
          origTags = document.getElementById(`ext-tags-${entryId}`)?.value || item.tags || '';
        }
      } else if (sourceContext === 'source') {
        const prop = unifiedItems.find(x => x.id === proposalId);
        const s = prop?.source_entries?.find(e => e.id === entryId);
        if (s) {
          origText = document.getElementById(`ce-obs-${entryId}`)?.value || s.observation;
          origCat = document.getElementById(`ce-cat-${entryId}`)?.value || s.category;
          origSubj = document.getElementById(`ce-subj-${entryId}`)?.value || s.subject || 'Ricky';
          origTags = document.getElementById(`ce-tags-${entryId}`)?.value || s.tags || '';
        }
      }

      currentSplitOriginal = {
        entry_id: entryId,
        observation: origText,
        category: origCat,
        subject: origSubj,
        tags: origTags
      };

      document.getElementById('split-modal-title').textContent = `✂️ Split Compound Context Entry #${entryId}`;
      document.getElementById('split-modal-orig-text').textContent = origText;
      document.getElementById('split-modal').style.display = 'flex';

      await reDecomposeSplit();
    }

    function closeSplitModal() {
      document.getElementById('split-modal').style.display = 'none';
      currentSplitEntryId = null;
      currentSplitProposalId = null;
      currentSplitDrafts = [];
      currentSplitOriginal = null;
    }

    async function reDecomposeSplit() {
      if (!currentSplitOriginal || !currentSplitOriginal.observation) return;
      document.getElementById('split-loading').style.display = 'block';
      document.getElementById('split-drafts-container').innerHTML = '';

      try {
        const res = await fetch(`${API_BASE}/api/context/split_preview`, {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify(currentSplitOriginal)
        });
        if (res.ok) {
          const data = await res.json();
          currentSplitDrafts = data.splits || [];
          if (currentSplitDrafts.length === 0) {
            currentSplitDrafts = [
              { category: currentSplitOriginal.category, subject: currentSplitOriginal.subject, observation: currentSplitOriginal.observation, tags: currentSplitOriginal.tags },
              { category: currentSplitOriginal.category, subject: currentSplitOriginal.subject, observation: '', tags: '' }
            ];
          }
        } else {
          alert('Failed to decompose with LLM. Creating manual split template.');
          currentSplitDrafts = [
            { category: currentSplitOriginal.category, subject: currentSplitOriginal.subject, observation: currentSplitOriginal.observation, tags: currentSplitOriginal.tags },
            { category: currentSplitOriginal.category, subject: currentSplitOriginal.subject, observation: '', tags: '' }
          ];
        }
      } catch (e) {
        alert('Network error during split preview.');
      } finally {
        document.getElementById('split-loading').style.display = 'none';
        renderSplitDrafts();
      }
    }

    function renderSplitDrafts() {
      const container = document.getElementById('split-drafts-container');
      if (!container) return;

      container.innerHTML = currentSplitDrafts.map((d, idx) => {
        const alignBadge = d.alignment_label ? `
          <span class="badge" style="font-size: 10px; background: rgba(34, 197, 94, 0.15); color: #4ade80;">${escapeHtml(d.alignment_label)}</span>
        ` : '';

        const suggTags = (d.suggested_tags && d.suggested_tags.length > 0) ? `
          <div style="display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; font-size: 11px;">
            <span style="color: var(--text-dim);">Suggestions:</span>
            ${d.suggested_tags.map(t => `<button class="filter-pill" style="padding: 1px 6px; font-size: 10px;" onclick="appendSplitDraftTag(${idx}, '${escapeHtml(t)}')">+ #${escapeHtml(t)}</button>`).join('')}
          </div>
        ` : '';

        return `
          <div class="card" style="background: var(--surface2); border: 1px solid var(--border); padding: 12px; margin-bottom: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <div style="display: flex; gap: 6px; align-items: center;">
                <span style="font-weight: 600; font-size: 12px; color: var(--accent);">Atomic Fact #${idx + 1}</span>
                ${alignBadge}
              </div>
              <button class="btn btn-sm" style="font-size: 11px; padding: 2px 6px; background: rgba(239, 68, 68, 0.15); color: #f87171;" onclick="removeSplitDraft(${idx})">✕ Remove</button>
            </div>
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
              <input type="text" id="split-cat-${idx}" value="${escapeHtml(d.category || '')}" placeholder="Category (e.g. Cat05-R)" oninput="updateSplitDraft(${idx})" style="width: 140px; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 12px;" />
              <input type="text" id="split-subj-${idx}" value="${escapeHtml(d.subject || 'Ricky')}" placeholder="Subject" oninput="updateSplitDraft(${idx})" style="width: 100px; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 12px;" />
              <input type="text" id="split-tags-${idx}" value="${escapeHtml(d.tags || '')}" placeholder="Domain Tags (e.g. Tech/Python/FastAPI)" oninput="updateSplitDraft(${idx})" style="flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 12px;" />
            </div>
            <textarea id="split-obs-${idx}" oninput="updateSplitDraft(${idx})" placeholder="Substantive atomic observation..." style="width: 100%; min-height: 60px; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 4px; font-size: 12px; line-height: 1.4;">${escapeHtml(d.observation || '')}</textarea>
            ${suggTags}
          </div>
        `;
      }).join('');
    }

    function addSplitDraft() {
      currentSplitDrafts.push({
        category: currentSplitOriginal?.category || 'Cat05-R',
        subject: currentSplitOriginal?.subject || 'Ricky',
        observation: '',
        tags: ''
      });
      renderSplitDrafts();
    }

    function removeSplitDraft(idx) {
      if (currentSplitDrafts.length <= 1) {
        alert('A split requires at least one atomic entry.');
        return;
      }
      currentSplitDrafts.splice(idx, 1);
      renderSplitDrafts();

      currentSplitDrafts.forEach((_, idx) => updateSplitDraft(idx));

      if (validDrafts.length < 2) {

          return;

      const btn = document.getElementById('btn-apply-split');
      if (btn) btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/context/split_apply`, {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({

            entries: validDrafts

        if (res.ok) {

          if (currentSplitContext === 'extractions') {

    }

    function formatDiffTokens(tokens, lcsMask, className) {
      let html = '';
      for (let k = 0; k < tokens.length; k++) {
        const token = tokens[k];
        if (lcsMask[k]) {
          html += escapeHtml(token);
        } else {
          const parts = token.split('\n');
          for (let p = 0; p < parts.length; p++) {
            if (p > 0) html += '\n';
            if (parts[p].length > 0) {
              html += `<span class="${className}">${escapeHtml(parts[p])}</span>`;
            }
          }
        }
      }
      return html;
    }

    function computeWordDiff(oldText, newText) {
      const tokensOld = oldText.match(/(\s+|[^\s\w]+|\w+)/g) || [];
      const tokensNew = newText.match(/(\s+|[^\s\w]+|\w+)/g) || [];

      const m = tokensOld.length;
      const n = tokensNew.length;

      if (m === 0 && n === 0) return { delHtml: '', insHtml: '' };

      const dp = Array.from({ length: m + 1 }, () => new Int32Array(n + 1));
      for (let i = 0; i < m; i++) {
        for (let j = 0; j < n; j++) {
          if (tokensOld[i] === tokensNew[j]) {
            dp[i + 1][j + 1] = dp[i][j] + 1;
          } else {
            dp[i + 1][j + 1] = Math.max(dp[i + 1][j], dp[i][j + 1]);
          }
        }
      }

      const lcsMaskOld = new Uint8Array(m);
      const lcsMaskNew = new Uint8Array(n);

      let i = m, j = n;
      while (i > 0 && j > 0) {
        if (tokensOld[i - 1] === tokensNew[j - 1]) {
          lcsMaskOld[i - 1] = 1;
          lcsMaskNew[j - 1] = 1;
          i--;
          j--;
        } else if (dp[i - 1][j] >= dp[i][j - 1]) {
          i--;
        } else {
          j--;
        }
      }

      const delHtml = formatDiffTokens(tokensOld, lcsMaskOld, 'diff-word-del');
      const insHtml = formatDiffTokens(tokensNew, lcsMaskNew, 'diff-word-ins');

      return { delHtml, insHtml };
    }

    function renderDiff(original, proposed) {
      if (!original) return `<pre style="white-space: pre-wrap; word-break: break-all; color: var(--success);">${escapeHtml(proposed)}</pre>`;
      
      const origLines = original.split('\n');
      const propLines = proposed.split('\n');
      
      let html = '<div class="diff-container" style="font-family: monospace; font-size: 13px; background: #07070a; border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; line-height: 1.6;">';
      
      let i = 0, j = 0;
      while (i < origLines.length || j < propLines.length) {
        if (i < origLines.length && j < propLines.length && origLines[i] === propLines[j]) {
          html += `<div class="diff-line" style="color: var(--text-dim);">  ${escapeHtml(origLines[i])}</div>`;
          i++;
          j++;
        } else {
          let delCount = 0;
          let insCount = 0;
          let matched = false;
          
          for (let look = 1; look <= 40; look++) {
            if (j + look < propLines.length && origLines[i] === propLines[j + look] && origLines[i].trim() !== '') {
              insCount = look;
              matched = true;
              break;
            }
            if (i + look < origLines.length && origLines[i + look] === propLines[j] && propLines[j].trim() !== '') {
              delCount = look;
              matched = true;
              break;
            }
            for (let d = 1; d <= look; d++) {
              if (i + d < origLines.length && j + (look - d) < propLines.length && origLines[i + d] === propLines[j + (look - d)] && origLines[i + d].trim() !== '') {
                delCount = d;
                insCount = look - d;
                matched = true;
                break;
              }
            }
            if (matched) break;
          }
          
          if (!matched) {
            delCount = origLines.length - i;
            insCount = propLines.length - j;
          }
          
          const oldBlock = origLines.slice(i, i + delCount);
          const newBlock = propLines.slice(j, j + insCount);
          
          i += delCount;
          j += insCount;
          
          const maxLen = Math.max(oldBlock.length, newBlock.length);
          for (let k = 0; k < maxLen; k++) {
            const hasOld = k < oldBlock.length;
            const hasNew = k < newBlock.length;
            
            if (hasOld && hasNew) {
              const { delHtml, insHtml } = computeWordDiff(oldBlock[k], newBlock[k]);
              html += `<div class="diff-line diff-line-del">- ${delHtml}</div>`;
              html += `<div class="diff-line diff-line-ins">+ ${insHtml}</div>`;
            } else if (hasOld) {
              html += `<div class="diff-line diff-line-del">- ${escapeHtml(oldBlock[k])}</div>`;
            } else if (hasNew) {
              html += `<div class="diff-line diff-line-ins">+ ${escapeHtml(newBlock[k])}</div>`;
            }
          }
        }
      }
      html += '</div>';
      return html;
    }
