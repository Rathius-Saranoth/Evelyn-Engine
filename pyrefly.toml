# Pyrefly configuration for the Evelyn Engine project.
# Tells Pyrefly where to find project modules and which Python to use.
# See: https://pyrefly.org/en/stable/configuration/

[project]
# The root of the source tree (relative to this file).
# Pyrefly will search here when resolving local imports like `evelyn_tools`.
source_paths = ["."]

[python]
# Point Pyrefly at the system Python that runs the server.
# This ensures it finds installed packages (fastapi, pydantic, etc.)
# from the same interpreter used by `python evelyn_server.py`.
interpreter = "C:/Users/ricky/AppData/Local/Programs/Python/Python313/python.exe"
